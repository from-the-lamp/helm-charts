apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Values.chatgptAuthPersistence.pvcName }}
spec:
  accessModes:
    - ReadWriteOnce
  {{- with .Values.chatgptAuthPersistence.storageClass }}
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.chatgptAuthPersistence.size }}
