apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.proxyConfigMap.name }}
data:
  {{ .Values.proxyConfigMap.key }}: |
    model_list:
      {{- range $model := .Values.codexModels }}
      - model_name: {{ $model }}
        litellm_params:
          model: codex/codex-{{ $model }}
      {{- end }}
      {{- range $model := .Values.codexModels }}
      - model_name: openai/{{ $model }}
        litellm_params:
          model: codex/codex-{{ $model }}
      {{- end }}
      {{- range $account := .Values.codexAccounts }}
      {{- range $model := $.Values.codexModels }}
      - model_name: {{ $model }}
        litellm_params:
          model: openai/{{ $model }}
          api_base: http://litellm-codex-{{ $account.name }}:4000
          api_key: os.environ/PROXY_MASTER_KEY
      {{- end }}
      {{- end }}
      {{- range $model := .Values.deepseekModels }}
      - model_name: {{ $model }}
        litellm_params:
          model: deepseek/{{ $model }}
          api_key: os.environ/DEEPSEEK_API_KEY
      {{- end }}
      {{- range $model := .Values.whisperModels }}
      - model_name: {{ $model }}
        litellm_params:
          model: groq/{{ $model }}
          api_key: os.environ/GROQ_API_KEY
        model_info:
          mode: audio_transcription
      {{- end }}
    router_settings:
      routing_strategy: simple-shuffle
    {{- include "lamp-litellm.codexHandlerSettings" . | nindent 4 }}
