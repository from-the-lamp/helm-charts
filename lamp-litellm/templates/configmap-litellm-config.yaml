apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.proxyConfigMap.name }}
data:
  {{ .Values.proxyConfigMap.key }}: |
    model_list:
      {{- range $model := .Values.chatgptModels }}
      - model_name: {{ $model }}
        litellm_params:
          model: chatgpt/{{ $model }}
      {{- end }}
      {{- range $model := .Values.deepseekModels }}
      - model_name: {{ $model }}
        litellm_params:
          model: deepseek/{{ $model }}
          api_key: os.environ/DEEPSEEK_API_KEY
      {{- end }}
      {{- range $model := .Values.claudeModels }}
      - model_name: {{ $model }}
        litellm_params:
          model: anthropic/{{ $model }}
          api_key: os.environ/ANTHROPIC_API_KEY
      {{- end }}
      {{- range $model := .Values.whisperModels }}
      - model_name: {{ $model }}
        litellm_params:
          model: groq/{{ $model }}
          api_key: os.environ/GROQ_API_KEY
        model_info:
          mode: audio_transcription
      {{- end }}
    router_settings:
      routing_strategy: simple-shuffle
      num_retries: 2
      timeout: 120
      fallbacks:
        {{- range $model := .Values.chatgptModels }}
        - {{ $model }}:
            {{- range $other := $.Values.chatgptModels }}
            {{- if ne $other $model }}
            - {{ $other }}
            {{- end }}
            {{- end }}
        {{- end }}
    litellm_settings:
      drop_params: true
      {{- if .Values.metrics.enabled }}
      callbacks: ["prometheus"]
      require_auth_for_metrics_endpoint: false
      {{- end }}
    general_settings:
      master_key: os.environ/PROXY_MASTER_KEY
