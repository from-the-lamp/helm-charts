apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.imagePullSecret.secretName }}
spec:
  refreshInterval: "{{ .Values.externalSecrets.refreshInterval }}"
  secretStoreRef:
    kind: "{{ .Values.externalSecrets.kind }}"
    name: "{{ .Values.externalSecrets.name }}"
  target:
    name: {{ .Values.imagePullSecret.secretName }}
    creationPolicy: "{{ .Values.externalSecrets.creationPolicy }}"
    template:
      metadata:
        annotations:
          argocd.argoproj.io/sync-wave: "-1"
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: |
          {
            "auths": {
              "{{ .Values.imagePullSecret.registry }}": {
                "auth": "{{`{{ printf "%s:%s" "`}}{{ .Values.imagePullSecret.username }}{{`" .password | b64enc }}`}}"
              }
            }
          }
  data:
    - secretKey: password
      remoteRef:
        key: {{ .Values.imagePullSecret.remoteKey }}
