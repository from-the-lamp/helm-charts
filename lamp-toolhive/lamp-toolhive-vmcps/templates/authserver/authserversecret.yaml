{{- if .Values.dex.enabled }}
{{- if eq (.Values.authServerSecret.strategy | default "vault") "selfGenerated" }}
{{- $secretName := "toolhive-authserver-secrets" }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName }}
{{- $existingData := dict }}
{{- if $existing }}
{{- $existingData = $existing.data }}
{{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
type: Opaque
data:
  hmac: {{ get $existingData "hmac" | default (randAlphaNum 32 | b64enc) }}
  signing: {{ get $existingData "signing" | default (genPrivateKey "rsa" | b64enc) }}
{{- else }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: toolhive-authserver-secrets
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    kind: {{ .Values.externalSecrets.kind }}
    name: {{ .Values.externalSecrets.name }}
  target:
    name: toolhive-authserver-secrets
    creationPolicy: {{ .Values.externalSecrets.creationPolicy }}
  data:
    - secretKey: hmac
      remoteRef:
        key: toolhive
        property: authserver-hmac
    - secretKey: signing
      remoteRef:
        key: toolhive
        property: authserver-signing
{{- end }}
{{- end }}
