{{- if .Values.tailscaleExpose.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: vmcp-mcp-tools-tailscale
  annotations:
    {{- with .Values.tailscaleExpose.tags }}
    tailscale.com/tags: {{ join "," . | quote }}
    {{- end }}
spec:
  ingressClassName: tailscale
  rules:
    - http:
        paths:
          - path: /dex
            pathType: Prefix
            backend:
              service:
                name: toolhive-dex
                port:
                  number: 5556
          - path: /
            pathType: Prefix
            backend:
              service:
                name: vmcp-mcp-tools
                port:
                  number: 4483
  tls:
    - hosts:
        - {{ .Values.tailscaleExpose.hostname | quote }}
{{- end }}
