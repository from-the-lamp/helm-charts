global:
  projectId: example-project

dex:
  enabled: true

  sso:
    google:
      enabled: false
      # redirectURI: https://toolhive-dex.example.com/dex/callback
      # hostedDomains:
      #   - example.com
      # domainToAdminEmail:
      #   example.com: admin@example.com
      # fetchTransitiveGroupMembership: true
      # serviceAccountKey:
      #   name: toolhive-dex-gsa
      # clientId:
      #   key: example-secret
      #   property: google-oauth-client-id
      # clientSecret:
      #   key: example-secret
      #   property: google-oauth-client-secret

    zitadel:
      enabled: false
      # issuer: https://example.zitadel.cloud
      # redirectURI: https://toolhive-dex.example.com/dex/callback
      # clientId:
      #   key: example-secret
      #   property: zitadel-client-id
      # clientSecret:
      #   key: example-secret
      #   property: zitadel-client-secret

    gitlab:
      enabled: true
      baseURL: https://gitlab.com
      redirectURI: https://mcp.internal.from-the-lamp.work/dex/callback
      groups:
        - from-the-lamp
      clientId:
        key: toolhive
        property: oauth-client-id
      clientSecret:
        key: toolhive
        property: oauth-client-secret

  config:
    issuer: https://mcp.internal.from-the-lamp.work/dex
    storage:
      type: kubernetes
      config:
        inCluster: true
    web:
      http: 0.0.0.0:5556
    oauth2:
      skipApprovalScreen: true
      # local/static-password ROPC login for hermes, which can't complete an
      # interactive browser OAuth flow (it's a headless gateway pod, not a
      # human with a browser) - see mcp-tools-hermes-oidc below.
      passwordConnector: local
      grantTypes:
        - authorization_code
        - refresh_token
        - password
    # id token lifetime long-lived to match the hermes-side "mint once, never
    # rotate" design already used for its (unreachable) k8s SA token attempt;
    # signingKeys must stay >= idTokens or token validation breaks once keys
    # rotate out from under a still-valid token. This also affects the human
    # GitLab-login id tokens issued by this same Dex, since expiry is global.
    expiry:
      idTokens: "87600h"
      signingKeys: "87600h"
    enablePasswordDB: true
    staticPasswords:
      # bcrypt hash of a generated password, minted once for a single ROPC
      # token exchange - see lamp-hermes secrets.TOOLHIVE_BEARER_TOKEN.
      - email: hermes@toolhive.internal
        hash: "$2b$10$MUoCGGtqh/8dPxPY0g9u6.7voKfSGv79I/fAs.LCh4or1BiXoTF2O"
        username: hermes
        userID: hermes-static-user
    staticClients:
      - id: vmcp-mcp-tools
        name: "ToolHive vMCP"
        redirectURIs:
          - https://mcp.internal.from-the-lamp.work/oauth/callback
        secretEnv: VMCP_CLIENT_SECRET
      - id: hermes-toolhive
        name: "Hermes (headless ROPC)"
        secretEnv: HERMES_CLIENT_SECRET

  configSecret:
    create: false
    name: toolhive-dex-config

  nodeSelector:
    role: worker

  podAnnotations:
    reloader.stakater.com/auto: "true"

  envFrom:
    - secretRef:
        name: dex-sso-secrets
    - secretRef:
        name: toolhive-vmcp-client-secret
    - secretRef:
        name: toolhive-hermes-client-secret

  # volumes:
  #   - name: google-sa
  #     secret:
  #       secretName: toolhive-dex-gsa
  # volumeMounts:
  #   - name: google-sa
  #     mountPath: /etc/dex/google
  #     readOnly: true

redis:
  enabled: false
  # passwordSecret:
  #   key: example-secret
  #   property: redis-password
  architecture: standalone
  fullnameOverride: toolhive-redis
  image:
    tag: latest
  auth:
    enabled: true
    existingSecret: toolhive-redis-password
    existingSecretPasswordKey: password
  master:
    persistence:
      enabled: true
      size: 1Gi
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 100m
        memory: 128Mi
  replica:
    replicaCount: 0

oidcConfigs:
  - name: mcp-tools-oidc
    issuer: https://mcp.internal.from-the-lamp.work
  # Hermes runs in a different physical cluster (prod-0/product) and can't do
  # an interactive browser OAuth login (it's a headless gateway, no browser
  # to complete the loopback callback) or present a token from its own
  # cluster's k8s SA issuer (tried; that cluster's apiserver has anonymous
  # discovery/JWKS access disabled entirely - a control-plane flag, not
  # something fixable via RBAC). Instead it authenticates directly to this
  # Dex instance via the OAuth2 Resource Owner Password (ROPC) grant against
  # the static "hermes" user below - fully scriptable, no browser needed.
  # The resulting id token is minted once (long expiry, see dex.config.expiry
  # above) and stored as a static secret (hermes/toolhive_bearer_token in
  # Vault) that hermes picks up like any other credential.
  - name: mcp-tools-hermes-oidc
    issuer: https://mcp.internal.from-the-lamp.work/dex

authzConfigs:
  - name: mcp-tools-authz
    allowedGroups:
      - from-the-lamp

mcpGroups:
  - name: mcp-tools

virtualMcpServers:
  - name: mcp-tools
    groupRef: mcp-tools
    incomingAuth:
      type: oidc
      oidcConfigRef:
        name: mcp-tools-oidc
        audience: https://mcp.internal.from-the-lamp.work/mcp
        resourceUrl: https://mcp.internal.from-the-lamp.work/mcp
        scopes:
          - openid
          - offline_access
      authzConfigRef:
        name: mcp-tools-authz
    authServerConfig:
      issuer: https://mcp.internal.from-the-lamp.work
      baselineClientScopes:
        - openid
        - offline_access
      hmacSecretRefs:
        - name: toolhive-authserver-secrets
          key: hmac
      signingKeySecretRefs:
        - name: toolhive-authserver-secrets
          key: signing
      upstreamProviders:
        - name: gitlab
          type: oidc
          oidcConfig:
            issuerUrl: https://mcp.internal.from-the-lamp.work/dex
            clientId: vmcp-mcp-tools
            clientSecretRef:
              name: toolhive-vmcp-client-secret
              key: VMCP_CLIENT_SECRET
            redirectUri: https://mcp.internal.from-the-lamp.work/oauth/callback
            scopes:
              - openid
              - email
              - groups
    podTemplateSpec:
      metadata:
        annotations:
          reloader.stakater.com/auto: "true"
      spec:
        nodeSelector:
          role: worker
        containers:
          - name: vmcp
            resources:
              requests:
                cpu: 5m
                memory: 128Mi
              limits:
                cpu: 500m
                memory: 512Mi

  # Same aggregated tool group as mcp-tools, exposed only in-cluster (no
  # ingress/route) for hermes to reach using a Dex-issued ROPC token instead
  # of a human GitLab login. Audience matches the hermes-toolhive Dex client
  # id, since Dex sets a token's aud claim to the requesting client_id.
  # No authzConfigRef: any token that validates against mcp-tools-hermes-oidc
  # already proves it came from that client, so it gets the full mcp-tools
  # toolset.
  - name: mcp-tools-hermes
    groupRef: mcp-tools
    incomingAuth:
      type: oidc
      oidcConfigRef:
        name: mcp-tools-hermes-oidc
        audience: hermes-toolhive
    podTemplateSpec:
      metadata:
        annotations:
          reloader.stakater.com/auto: "true"
      spec:
        nodeSelector:
          role: worker
        containers:
          - name: vmcp
            resources:
              requests:
                cpu: 5m
                memory: 128Mi
              limits:
                cpu: 500m
                memory: 512Mi

tailscaleExpose:
  enabled: false
  hostname: mcp-tools
  tags:
    - tag:exit

# hermes runs in the prod-0 cluster, which can't reach this cluster's
# ClusterIP service DNS - expose mcp-tools-hermes on the shared tailnet
# instead. prod-0's own lamp-tailscale-services deployment (argo-apps
# prod-0/platform/tailscale-services) proxies an ExternalName service back
# to this tailnet hostname, so hermes reaches it via ordinary in-cluster DNS.
hermesTailscaleExpose:
  enabled: true
  hostname: mcp-tools-hermes
  tags:
    - tag:exit

externalSecrets:
  kind: ClusterSecretStore
  name: oracle
  refreshInterval: 1h
  creationPolicy: Orphan
