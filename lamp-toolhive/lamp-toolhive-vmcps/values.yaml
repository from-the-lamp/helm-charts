global:
  projectId: example-project

dex:
  enabled: true

  sso:
    google:
      enabled: false
      # redirectURI: https://toolhive-dex.example.com/dex/callback
      # hostedDomains:
      #   - example.com
      # domainToAdminEmail:
      #   example.com: admin@example.com
      # fetchTransitiveGroupMembership: true
      # serviceAccountKey:
      #   name: toolhive-dex-gsa
      # clientId:
      #   key: example-secret
      #   property: google-oauth-client-id
      # clientSecret:
      #   key: example-secret
      #   property: google-oauth-client-secret

    zitadel:
      enabled: false
      # issuer: https://example.zitadel.cloud
      # redirectURI: https://toolhive-dex.example.com/dex/callback
      # clientId:
      #   key: example-secret
      #   property: zitadel-client-id
      # clientSecret:
      #   key: example-secret
      #   property: zitadel-client-secret

    gitlab:
      enabled: true
      baseURL: https://gitlab.com
      redirectURI: https://mcp.internal.from-the-lamp.work/dex/callback
      groups:
        - from-the-lamp
      clientId:
        key: toolhive
        property: oauth-client-id
      clientSecret:
        key: toolhive
        property: oauth-client-secret

  config:
    issuer: https://mcp.internal.from-the-lamp.work/dex
    storage:
      type: kubernetes
      config:
        inCluster: true
    web:
      http: 0.0.0.0:5556
    oauth2:
      skipApprovalScreen: true
      # local/static-password ROPC login for hermes, which can't complete an
      # interactive browser OAuth flow (it's a headless gateway pod, not a
      # human with a browser) - see mcp-tools-hermes-oidc below.
      passwordConnector: local
      grantTypes:
        - authorization_code
        - refresh_token
        - password
        - client_credentials
    # id token lifetime long-lived to match the hermes-side "mint once, never
    # rotate" design already used for its (unreachable) k8s SA token attempt;
    # signingKeys must stay >= idTokens or token validation breaks once keys
    # rotate out from under a still-valid token. This also affects the human
    # GitLab-login id tokens issued by this same Dex, since expiry is global.
    expiry:
      idTokens: "87600h"
      signingKeys: "87600h"
    enablePasswordDB: true
    staticPasswords:
      # bcrypt hash of a generated password, minted once for a single ROPC
      # token exchange - see lamp-hermes secrets.TOOLHIVE_BEARER_TOKEN.
      - email: hermes@toolhive.internal
        hash: "$2b$10$MUoCGGtqh/8dPxPY0g9u6.7voKfSGv79I/fAs.LCh4or1BiXoTF2O"
        username: hermes
        userID: hermes-static-user
    staticClients:
      - id: vmcp-mcp-tools
        name: "ToolHive vMCP"
        redirectURIs:
          - https://mcp.internal.from-the-lamp.work/oauth/callback
        secretEnv: VMCP_CLIENT_SECRET
      - id: hermes-toolhive
        name: "Hermes (headless ROPC)"
        secretEnv: HERMES_CLIENT_SECRET

  # Was false, leaving an orphaned/stale Secret (not re-rendered by Helm at
  # all) that predated the current hermes password hash and never had a
  # windmill entry - fixed by letting the chart actually render this from
  # dex.config below.
  configSecret:
    create: true
    name: toolhive-dex-config

  podAnnotations:
    reloader.stakater.com/auto: "true"

  env:
    DEX_CLIENT_CREDENTIAL_GRANT_ENABLED_BY_DEFAULT: "true"

  envFrom:
    - secretRef:
        name: dex-sso-secrets
    - secretRef:
        name: toolhive-vmcp-client-secret
    - secretRef:
        name: toolhive-hermes-client-secret

  # volumes:
  #   - name: google-sa
  #     secret:
  #       secretName: toolhive-dex-gsa
  # volumeMounts:
  #   - name: google-sa
  #     mountPath: /etc/dex/google
  #     readOnly: true

# HMAC/signing secret for the vMCP's embedded OAuth auth server (spec.authServerConfig).
authServerSecret:
  # vault: pull hmac/signing from the ClusterSecretStore below (key "toolhive",
  #        properties authserver-hmac/authserver-signing) via ExternalSecret.
  # selfGenerated: generate random values on first install and preserve them across
  #        upgrades via `lookup` - no external secret store required.
  # Forced to selfGenerated: the vault-sourced signing key was corrupted ("invalid
  # CRT coefficient" on PKCS#8 parse), crash-looping the vmcp pod and taking down
  # the whole mcp-tools group (chicken-and-egg - no cluster/Vault access to fix the
  # vault secret while the only access path goes through the crashed vmcp itself).
  strategy: selfGenerated

redis:
  enabled: true
  passwordSecret:
    key: toolhive
    property: redis-password
  architecture: standalone
  fullnameOverride: toolhive-redis
  image:
    tag: latest
  auth:
    enabled: true
    existingSecret: toolhive-redis-password
    existingSecretPasswordKey: password
  master:
    persistence:
      enabled: true
      size: 1Gi
    resources:
      requests:
        cpu: 10m
        memory: 12Mi
      limits:
        cpu: 100m
        memory: 128Mi
  replica:
    replicaCount: 0

oidcConfigs:
  - name: mcp-tools-oidc
    issuer: https://mcp.internal.from-the-lamp.work
    jwksAllowPrivateIP: true
  # Hermes runs in a different physical cluster (prod-0/product) and can't do
  # an interactive browser OAuth login (it's a headless gateway, no browser
  # to complete the loopback callback) or present a token from its own
  # cluster's k8s SA issuer (tried; that cluster's apiserver has anonymous
  # discovery/JWKS access disabled entirely - a control-plane flag, not
  # something fixable via RBAC). Instead it authenticates directly to this
  # Dex instance via the OAuth2 Resource Owner Password (ROPC) grant against
  # the static "hermes" user below - fully scriptable, no browser needed.
  # The resulting id token is minted once (long expiry, see dex.config.expiry
  # above) and stored as a static secret (hermes/toolhive_bearer_token in
  # Vault) that hermes picks up like any other credential.
  - name: mcp-tools-hermes-oidc
    issuer: https://mcp.internal.from-the-lamp.work/dex
    jwksAllowPrivateIP: true

authzConfigs:
  - name: mcp-tools-authz
    allowedGroups:
      - from-the-lamp
    # windmill-delegate's only real consumer today is
    # f/context/collect_jira_context.flow's read-only Jira tool set (see
    # that flow's include_tools) - scoped to exactly that, not a blanket
    # permit over the whole mcp-tools group (which also contains
    # prod-admin Kubernetes, Oracle Cloud, and crypto-signing tools).
    # Add a prefix here only once a real flow actually calls it.
    allowedClientIds:
      - clientId: windmill-delegate
        allowedServers:
          - jira-xdata
          - jira-cas
          - jira-currency

mcpGroups:
  - name: mcp-tools

virtualMcpServers:
  - name: mcp-tools
    groupRef: mcp-tools
    incomingAuth:
      type: oidc
      oidcConfigRef:
        name: mcp-tools-oidc
        audience: https://mcp.internal.from-the-lamp.work/mcp
        resourceUrl: https://mcp.internal.from-the-lamp.work/mcp
        scopes:
          - openid
          - offline_access
      authzConfigRef:
        name: mcp-tools-authz
    authServerConfig:
      issuer: https://mcp.internal.from-the-lamp.work
      baselineClientScopes:
        - openid
        - offline_access
      hmacSecretRefs:
        - name: toolhive-authserver-secrets
          key: hmac
      signingKeySecretRefs:
        - name: toolhive-authserver-secrets
          key: signing
      trustedIssuers:
        - name: k8s-apiserver
          issuerUrl: https://91.98.221.117:6443
          jwksUrl: https://91.98.221.117:6443/openid/v1/jwks
          caBundleRef:
            configMapRef:
              name: kube-root-ca.crt
              key: ca.crt
      inboundGrants:
        tokenExchange:
          issuerPolicies:
            - issuerRef: k8s-apiserver
              expectedAudience: https://mcp.internal.from-the-lamp.work/mcp
              allowedDelegateClients:
                - windmill-delegate
              actorMatcher: 'claims.sub == "system:serviceaccount:windmill:windmill"'
          delegateClients:
            - clientId: windmill-delegate
              clientSecretRef:
                name: toolhive-windmill-delegate-secret
                key: WINDMILL_DELEGATE_CLIENT_SECRET
              audiences:
                - https://mcp.internal.from-the-lamp.work/mcp
              scopes:
                - openid
                - offline_access
      upstreamProviders:
        - name: gitlab
          type: oidc
          oidcConfig:
            issuerUrl: https://mcp.internal.from-the-lamp.work/dex
            allowPrivateIPs: true
            clientId: vmcp-mcp-tools
            clientSecretRef:
              name: toolhive-vmcp-client-secret
              key: VMCP_CLIENT_SECRET
            redirectUri: https://mcp.internal.from-the-lamp.work/oauth/callback
            scopes:
              - openid
              - email
              - groups
      # Persists the embedded auth server's own state (DCR client registry, auth
      # codes, etc.) in Redis instead of pod memory, so a vmcp restart (deploy, OOM,
      # node failure) no longer wipes already-registered OAuth clients and breaks
      # connected MCP clients. Distinct from spec.sessionStorage below, which is for
      # the vmcp proxy's own MCP-session continuity under horizontal scaling, not
      # the auth server - that field alone does not persist the DCR client registry.
      # No usernameSecretRef: our Redis has no custom ACL users, so this uses plain
      # legacy password-only AUTH against the same secret Redis itself is configured
      # to require.
      storage:
        type: redis
        redis:
          addr: toolhive-redis-master.toolhive.svc.cluster.local:6379
          aclUserConfig:
            passwordSecretRef:
              name: toolhive-redis-password
              key: password
    # TODO: re-enable once toolhive-operator 0.49.0's sessionStorage.passwordRef wiring
    # is confirmed working - it currently fails with "NOAUTH Authentication required"
    # even though the referenced secret's password matches Redis's own auth secret,
    # which took down the whole mcp-tools group twice. Redis itself (redis.enabled
    # above) is left running so this can be retried without re-fighting scheduling.
    # sessionStorage:
    #   provider: redis
    #   address: toolhive-redis-master.toolhive.svc.cluster.local:6379
    #   passwordRef:
    #     name: toolhive-redis-password
    #     key: password
    podTemplateSpec:
      metadata:
        annotations:
          reloader.stakater.com/auto: "true"
      spec:
        containers:
          - name: vmcp
            resources:
              requests:
                cpu: 5m
                memory: 128Mi
              limits:
                cpu: 500m
                memory: 512Mi

  # Same aggregated tool group as mcp-tools, exposed only in-cluster (no
  # ingress/route) for hermes to reach using a Dex-issued ROPC token instead
  # of a human GitLab login. Audience matches the hermes-toolhive Dex client
  # id, since Dex sets a token's aud claim to the requesting client_id.
  # No authzConfigRef: any token that validates against mcp-tools-hermes-oidc
  # already proves it came from that client, so it gets the full mcp-tools
  # toolset.
  - name: mcp-tools-hermes
    groupRef: mcp-tools
    incomingAuth:
      type: oidc
      oidcConfigRef:
        name: mcp-tools-hermes-oidc
        audience: hermes-toolhive
    # sessionStorage: see TODO on mcp-tools above - same passwordRef issue.
    podTemplateSpec:
      metadata:
        annotations:
          reloader.stakater.com/auto: "true"
      spec:
        containers:
          - name: vmcp
            resources:
              requests:
                cpu: 5m
                memory: 128Mi
              limits:
                cpu: 500m
                memory: 512Mi


tailscaleExpose:
  enabled: false
  hostname: mcp-tools
  tags:
    - tag:exit

# hermes runs in the prod-0 cluster, which can't reach this cluster's
# ClusterIP service DNS - was exposing mcp-tools-hermes on the shared
# tailnet for that. Disabled along with prod-0's consuming
# lamp-tailscale-services deployment: Tailscale rejects an OAuth-client
# authkey request unless the requested tags exactly match the client's
# whole configured tag set (not a subset), which no shared operator client
# can satisfy alongside its own tag - simplifying down to just the
# operators (plus the old infra cluster's exit-node) sidesteps that.
hermesTailscaleExpose:
  enabled: false
  hostname: mcp-tools-hermes
  tags:
    - tag:exit

externalSecrets:
  kind: ClusterSecretStore
  name: vault
  refreshInterval: 1h
  creationPolicy: Orphan
