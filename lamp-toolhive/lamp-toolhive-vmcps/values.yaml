global:
  projectId: example-project

dex:
  enabled: true

  sso:
    google:
      enabled: false
      # redirectURI: https://toolhive-dex.example.com/dex/callback
      # hostedDomains:
      #   - example.com
      # domainToAdminEmail:
      #   example.com: admin@example.com
      # fetchTransitiveGroupMembership: true
      # serviceAccountKey:
      #   name: toolhive-dex-gsa
      # clientId:
      #   key: example-secret
      #   property: google-oauth-client-id
      # clientSecret:
      #   key: example-secret
      #   property: google-oauth-client-secret

    zitadel:
      enabled: false
      # issuer: https://example.zitadel.cloud
      # redirectURI: https://toolhive-dex.example.com/dex/callback
      # clientId:
      #   key: example-secret
      #   property: zitadel-client-id
      # clientSecret:
      #   key: example-secret
      #   property: zitadel-client-secret

    gitlab:
      enabled: true
      baseURL: https://gitlab.com
      redirectURI: https://mcp.internal.from-the-lamp.work/dex/callback
      groups:
        - from-the-lamp
      clientId:
        key: toolhive
        property: oauth-client-id
      clientSecret:
        key: toolhive
        property: oauth-client-secret

  config:
    issuer: https://mcp.internal.from-the-lamp.work/dex
    storage:
      type: kubernetes
      config:
        inCluster: true
    web:
      http: 0.0.0.0:5556
    oauth2:
      skipApprovalScreen: true
      # local/static-password ROPC login for hermes, which can't complete an
      # interactive browser OAuth flow (it's a headless gateway pod, not a
      # human with a browser) - see mcp-tools-hermes-oidc below.
      passwordConnector: local
      grantTypes:
        - authorization_code
        - refresh_token
        - password
        - client_credentials
    # id token lifetime long-lived to match the hermes-side "mint once, never
    # rotate" design already used for its (unreachable) k8s SA token attempt;
    # signingKeys must stay >= idTokens or token validation breaks once keys
    # rotate out from under a still-valid token. This also affects the human
    # GitLab-login id tokens issued by this same Dex, since expiry is global.
    expiry:
      idTokens: "87600h"
      signingKeys: "87600h"
    enablePasswordDB: true
    staticPasswords:
      # bcrypt hash of a generated password, minted once for a single ROPC
      # token exchange - see lamp-hermes secrets.TOOLHIVE_BEARER_TOKEN.
      - email: hermes@toolhive.internal
        hash: "$2b$10$MUoCGGtqh/8dPxPY0g9u6.7voKfSGv79I/fAs.LCh4or1BiXoTF2O"
        username: hermes
        userID: hermes-static-user
    staticClients:
      - id: vmcp-mcp-tools
        name: "ToolHive vMCP"
        redirectURIs:
          - https://mcp.internal.from-the-lamp.work/oauth/callback
        secretEnv: VMCP_CLIENT_SECRET
      - id: hermes-toolhive
        name: "Hermes (headless ROPC)"
        secretEnv: HERMES_CLIENT_SECRET

  # templates/dex/configsecret.yaml (this wrapper chart's own template) is
  # the only renderer of this Secret now - it's the one that actually knows
  # how to build the connectors list (dex.sso.*.enabled above), which a
  # plain pass-through of dex.config here cannot express. The upstream dex
  # chart's own configSecret.create was briefly true to fix an unrelated,
  # earlier bug (a stale secret from before this wrapper template existed,
  # never re-rendered by Helm at all) - with the wrapper template now
  # handling the full render, letting upstream ALSO create a same-named
  # Secret just duplicates it (ArgoCD RepeatedResourceWarning) with a
  # version that's missing connectors entirely.
  configSecret:
    create: false
    name: toolhive-dex-config

  podAnnotations:
    reloader.stakater.com/auto: "true"

  env:
    DEX_CLIENT_CREDENTIAL_GRANT_ENABLED_BY_DEFAULT: "true"

  envFrom:
    - secretRef:
        name: dex-sso-secrets
    - secretRef:
        name: toolhive-vmcp-client-secret
    - secretRef:
        name: toolhive-hermes-client-secret

  # One ExternalSecret + env var per Dex static client that needs its secret
  # pulled from Vault (templates/dex/clientsecrets.yaml ranges over this) -
  # generalized from a single hardcoded "hermes" entry so a deployment can
  # give each headless ROPC bot its own static client/secret instead of
  # sharing one. Default below reproduces the original single-entry
  # behavior exactly; a consumer adding more bot identities overrides this
  # list (and dex.envFrom above, and dex.config.staticClients/staticPasswords)
  # with one block per identity.
  clientSecrets:
    - secretName: toolhive-hermes-client-secret
      envName: HERMES_CLIENT_SECRET
      vaultKey: toolhive
      vaultProperty: hermes-client-secret

  # volumes:
  #   - name: google-sa
  #     secret:
  #       secretName: toolhive-dex-gsa
  # volumeMounts:
  #   - name: google-sa
  #     mountPath: /etc/dex/google
  #     readOnly: true

# HMAC/signing secret for the vMCP's embedded OAuth auth server (spec.authServerConfig).
authServerSecret:
  # vault: pull hmac/signing from the ClusterSecretStore below (key "toolhive",
  #        properties authserver-hmac/authserver-signing) via ExternalSecret.
  # selfGenerated: generate random values on first install and preserve them across
  #        upgrades via `lookup` - no external secret store required.
  # Forced to selfGenerated: the vault-sourced signing key was corrupted ("invalid
  # CRT coefficient" on PKCS#8 parse), crash-looping the vmcp pod and taking down
  # the whole mcp-tools group (chicken-and-egg - no cluster/Vault access to fix the
  # vault secret while the only access path goes through the crashed vmcp itself).
  strategy: selfGenerated

redis:
  enabled: true
  passwordSecret:
    key: toolhive
    property: redis-password
  architecture: standalone
  fullnameOverride: toolhive-redis
  image:
    tag: latest
  auth:
    enabled: true
    existingSecret: toolhive-redis-password
    existingSecretPasswordKey: password
  master:
    persistence:
      enabled: true
      size: 1Gi
    resources:
      requests:
        cpu: 10m
        memory: 12Mi
      limits:
        cpu: 100m
        memory: 128Mi
  replica:
    replicaCount: 0

oidcConfigs:
  - name: mcp-tools-oidc
    issuer: https://mcp.internal.from-the-lamp.work
    jwksAllowPrivateIP: true
  # Hermes runs in a different physical cluster (prod-0/product) and can't do
  # an interactive browser OAuth login (it's a headless gateway, no browser
  # to complete the loopback callback) or present a token from its own
  # cluster's k8s SA issuer (tried; that cluster's apiserver has anonymous
  # discovery/JWKS access disabled entirely - a control-plane flag, not
  # something fixable via RBAC). Instead it authenticates directly to this
  # Dex instance via the OAuth2 Resource Owner Password (ROPC) grant against
  # the static "hermes" user below - fully scriptable, no browser needed.
  # The resulting id token is minted once (long expiry, see dex.config.expiry
  # above) and stored as a static secret (hermes/toolhive_bearer_token in
  # Vault) that hermes picks up like any other credential.
  - name: mcp-tools-hermes-oidc
    issuer: https://mcp.internal.from-the-lamp.work/dex
    jwksAllowPrivateIP: true

authzConfigs:
  - name: mcp-tools-authz
    allowedGroups:
      - from-the-lamp
    # windmill-delegate's real consumers are f/sources/collect_context's
    # read-only Jira tool set (see that flow's include_tools - exactly the 6
    # tool names below, per tenant) and, as of ADR-012,
    # f/tasks/transition_merged_cas_kcl_tickets's one write call
    # (jira_transition_issue). A plain "jira-<tenant>_*" server wildcard
    # would silently also grant every *other* Jira/Confluence write tool
    # (create/delete/update/...) under the same "read-only" label - these
    # rawPolicies replace that wildcard with an explicit allowlist instead,
    # so a new write call anywhere in this pipeline has to be a deliberate
    # policy change here, not something that already worked by accident.
    # Write permit now covers every tenant's jira_transition_issue, matching
    # f/tasks/transition_merged_kelos_tickets's generalization across all
    # SCM providers (GitLab/GitHub/Bitbucket) - see docs/adr/015.
    #
    # oracle-0/oracle-1 (raw kubectl against both prod
    # clusters - pods_exec/pods_delete/resources_delete included) are
    # explicitly forbidden too, mirroring mcp-tools-hermes-authz below - a
    # human who completes GitLab OAuth login through this group permit has
    # no legitimate reason to have MORE production access through this
    # gateway than the bot was deliberately restricted from. Cedar
    # evaluates forbid over permit regardless of policy order/position in
    # this list.
    rawPolicies:
      - 'forbid(principal, action, resource) when { resource.name like "mcp-oracle-0_*" || resource.name like "mcp-oracle-1_*" };'
      - |
        permit(
          principal,
          action,
          resource
        )
        when {
          principal has claim_client_id &&
          principal.claim_client_id == "windmill-delegate" &&
          (resource.name == "mcp-jira-xdata_jira_get_issue" ||
           resource.name == "mcp-jira-xdata_jira_search_issues" ||
           resource.name == "mcp-jira-xdata_jira_transition_issue" ||
           resource.name == "mcp-jira-xdata_jira_get_transitions" ||
           resource.name == "mcp-jira-xdata_jira_get_issue_link_types" ||
           resource.name == "mcp-jira-xdata_jira_get_project_issues" ||
           resource.name == "mcp-jira-xdata_jira_get_user_profile")
        };
      - |
        permit(
          principal,
          action,
          resource
        )
        when {
          principal has claim_client_id &&
          principal.claim_client_id == "windmill-delegate" &&
          (resource.name == "mcp-jira-cas_jira_get_issue" ||
           resource.name == "mcp-jira-cas_jira_search_issues" ||
           resource.name == "mcp-jira-cas_jira_get_transitions" ||
           resource.name == "mcp-jira-cas_jira_get_issue_link_types" ||
           resource.name == "mcp-jira-cas_jira_get_project_issues" ||
           resource.name == "mcp-jira-cas_jira_get_user_profile" ||
           resource.name == "mcp-jira-cas_jira_transition_issue")
        };
      - |
        permit(
          principal,
          action,
          resource
        )
        when {
          principal has claim_client_id &&
          principal.claim_client_id == "windmill-delegate" &&
          (resource.name == "mcp-jira-currency_jira_get_issue" ||
           resource.name == "mcp-jira-currency_jira_search_issues" ||
           resource.name == "mcp-jira-currency_jira_transition_issue" ||
           resource.name == "mcp-jira-currency_jira_get_transitions" ||
           resource.name == "mcp-jira-currency_jira_get_issue_link_types" ||
           resource.name == "mcp-jira-currency_jira_get_project_issues" ||
           resource.name == "mcp-jira-currency_jira_get_user_profile")
        };
      - |
        permit(
          principal,
          action,
          resource
        )
        when {
          principal has claim_client_id &&
          principal.claim_client_id == "windmill-delegate" &&
          (resource.name == "mcp-jira-from-the-lamp_jira_get_issue" ||
           resource.name == "mcp-jira-from-the-lamp_jira_search_issues" ||
           resource.name == "mcp-jira-from-the-lamp_jira_transition_issue" ||
           resource.name == "mcp-jira-from-the-lamp_jira_get_transitions" ||
           resource.name == "mcp-jira-from-the-lamp_jira_get_issue_link_types" ||
           resource.name == "mcp-jira-from-the-lamp_jira_get_project_issues" ||
           resource.name == "mcp-jira-from-the-lamp_jira_get_user_profile")
        };

  # mcp-tools-hermes's own entry point - every token that reaches it is
  # already proven to be Hermes by mcp-tools-hermes-oidc, so these policies
  # need no principal match, only a resource (tool-name) restriction. Full
  # access to everything else stays as-is; only the windmill_* backend (it
  # proxies Windmill's *native* MCP API - every script/flow in the
  # workspace, not just the intended intake flows) is cut down to an
  # explicit allow-list. rawPolicies is a passthrough for exact-match Cedar
  # policies the allowedServers/allowedGroups/allowedClientIds shapes above
  # can't express (they only generate "<prefix>_*" wildcard permits).
  #
  # oracle-0/oracle-1 (raw kubectl against both prod
  # clusters - pods_exec/pods_delete/resources_delete included) are
  # explicitly forbidden rather than left to the blanket permit above -
  # confirmed with the user this isn't something Hermes is actually used
  # for day to day, unlike Oracle/crypto-signing/Jira/Slack/etc, which
  # stay as-is. Cedar evaluates forbid over permit regardless of policy
  # order, so this wins even though it's listed after the broad allow.
  - name: mcp-tools-hermes-authz
    rawPolicies:
      - 'permit(principal, action, resource) when { !(resource.name like "mcp-proxy-windmill_*") };'
      - 'permit(principal, action, resource) when { resource.name == "mcp-proxy-windmill_f-f_tasks_poll__assigned__jira" || resource.name == "mcp-proxy-windmill_f-f_kelos_trigger__task" || resource.name == "mcp-proxy-windmill_s-f_tasks_list__my__assigned__jira__issues" };'
      - 'forbid(principal, action, resource) when { resource.name like "mcp-oracle-0_*" || resource.name like "mcp-oracle-1_*" };'

