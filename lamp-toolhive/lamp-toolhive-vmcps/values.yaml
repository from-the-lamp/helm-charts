tailscaleExpose:
  enabled: false
  hostname: mcp-tools
  tags:
    - tag:exit

# hermes runs in the prod-0 cluster, which can't reach this cluster's
# ClusterIP service DNS - was exposing mcp-tools-hermes on the shared
# tailnet for that. Disabled along with prod-0's consuming
# lamp-tailscale-services deployment: Tailscale rejects an OAuth-client
# authkey request unless the requested tags exactly match the client's
# whole configured tag set (not a subset), which no shared operator client
# can satisfy alongside its own tag - simplifying down to just the
# operators (plus the old infra cluster's exit-node) sidesteps that.
hermesTailscaleExpose:
  enabled: false
  hostname: mcp-tools-hermes
  tags:
    - tag:exit

externalSecrets:
  kind: ClusterSecretStore
  name: vault
  refreshInterval: 1h
  creationPolicy: Orphan
