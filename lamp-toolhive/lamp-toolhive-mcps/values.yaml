mcp:
  defaults:
    groupRef: mcp-tools
    permissionProfile: network

  grafana:
    enabled: false
    image: grafana/mcp-grafana:1.2.0
    mcps: []

  github:
    enabled: true
    image: ghcr.io/github/github-mcp-server:v1.11.0
    mcps:
      - name: github-xdata
        token:
          key: toolhive
          property: github_xdata_token

  gitlab:
    enabled: true
    image: zereight050/gitlab-mcp:2.1.51
    mcps:
      - name: gitlab
        apiUrl: https://gitlab.com/api/v4
        permissionMode: full
        token:
          key: toolhive
          property: gitlab_token_from_the_lamp
      - name: gitlab-cas-dev
        apiUrl: https://gitlab.v-soft.dev/api/v4
        permissionMode: full
        token:
          key: toolhive
          property: gitlab_token_cas_dev
      - name: gitlab-cas-gitops
        apiUrl: https://gitlab.v-gitops.cc/api/v4
        permissionMode: full
        token:
          key: toolhive
          property: gitlab_token_cas_gitops

  kubernetes:
    enabled: true
    image: quay.io/containers/kubernetes_mcp_server:v0.0.66
    mcps:
      - name: kubernetes
        serviceAccount: kubernetes-mcp
      - name: prod-1-admin
        kubeconfig:
          key: toolhive
          property: kubeconfig-prod-1
      - name: prod-0-admin
        kubeconfig:
          key: toolhive
          property: kubeconfig-prod-0

  slack:
    enabled: true
    image: ghcr.io/korotovsky/slack-mcp-server:v1.3.0
    mcps:
      - name: slack-cas
        token:
          key: toolhive
          property: slack_token_cas
      - name: slack-xdata
        token:
          key: toolhive
          property: slack_token_xdata
      - name: slack-currency
        token:
          key: toolhive
          property: slack_token_currency

  jira:
    enabled: false
    image: ghcr.io/sooperset/mcp-atlassian:0.23.1
    mcps: []

  atlassian:
    enabled: true
    image: xuanxdev/atlassian-mcp:latest
    mcps:
      - name: jira-cas
        domain: jirasolutions.atlassian.net
        email: artem.zverev@v-soft.dev
        token:
          key: toolhive
          property: atlassian_token_cas
      - name: jira-xdata
        domain: xdatagroup.atlassian.net
        email: artem.zverev@xdatagroup.io
        token:
          key: toolhive
          property: atlassian_token_xdata
      - name: jira-currency
        domain: cx-labs-io.atlassian.net
        email: a.zverev@cx-labs.io
        token:
          key: toolhive
          property: atlassian_token_currency

  bitbucket:
    enabled: true
    # Self-built from docker-images/lamp-bitbucket-mcp (ulikoenig/mcp-atlassian-with-bitbucket,
    # a sooperset/mcp-atlassian fork with Bitbucket Cloud support - ghcr.io/ibrahimogod/bitbucket-mcp
    # was tried first but its generic tools declare an untyped `body: serde_json::Value` field that
    # schemars renders as a typeless {} schema, which broke tools/list for the whole vMCP gateway).
    image: registry.gitlab.com/from-the-lamp/infra/docker-images/lamp-bitbucket-mcp:latest
    mcps:
      - name: bitbucket
        username: a.zverev@cx-labs.io
        workspace: currencycom
        token:
          key: toolhive
          property: atlassian_token_currency

  victoriametrics:
    enabled: false
    image: ghcr.io/victoriametrics/mcp-victoriametrics:v1.20.2
    mcps: []

  clickhouse:
    enabled: false
    image: us-central1-docker.pkg.dev/database-toolbox/toolbox/toolbox:1.9.0
    mcps: []

  postgres:
    enabled: false
    image: us-central1-docker.pkg.dev/database-toolbox/toolbox/toolbox:1.9.0
    mcps: []

  redis:
    enabled: false
    image: us-central1-docker.pkg.dev/database-toolbox/toolbox/toolbox:1.9.0
    mcps: []

  kafka:
    enabled: false
    image: ghcr.io/tuannvm/kafka-mcp-server:2.0.2
    mcps: []

  argocd:
    enabled: false
    # No official container image for the argocd-mcp package (it's npx-only:
    # `npx argocd-mcp@latest stdio`) — build/point at your own image before enabling.
    image: ""
    mcps: []

  sheets:
    enabled: true
    # Self-built from docker-images/lamp-google-sheets (xing5/mcp-google-sheets from PyPI).
    image: registry.gitlab.com/from-the-lamp/infra/docker-images/lamp-google-sheets:latest
    mcps:
      - name: sheets
        credentials:
          key: toolhive
          property: sheets-mcp

  oracle:
    enabled: true
    # Self-built from docker-images/lamp-oracle-mcp (generic OCI SDK wrapper).
    image: registry.gitlab.com/from-the-lamp/infra/docker-images/lamp-oracle-mcp:latest
    mcps:
      - name: oracle-prod-0
        profile: lamp-prod-0
        config:
          key: toolhive
          property: oracle_config
        keyFiles:
          - name: lamp-prod-0.pem
            property: oracle_key_lamp_prod_0
          - name: lamp-prod-1.pem
            property: oracle_key_lamp_prod_1
      - name: oracle-prod-1
        profile: lamp-prod-1
        config:
          key: toolhive
          property: oracle_config
        keyFiles:
          - name: lamp-prod-0.pem
            property: oracle_key_lamp_prod_0
          - name: lamp-prod-1.pem
            property: oracle_key_lamp_prod_1

  etherscan:
    enabled: true
    # Self-built from docker-images/lamp-etherscan-mcp (npm package mcp-etherscan-server, no official image).
    image: registry.gitlab.com/from-the-lamp/infra/docker-images/lamp-etherscan-mcp:latest
    mcps:
      - name: etherscan
        token:
          key: toolhive
          property: etherscan_api_key

  alchemy:
    enabled: true
    # Self-built from docker-images/lamp-alchemy-mcp (official npm package @alchemy/mcp-server, no official image).
    image: registry.gitlab.com/from-the-lamp/infra/docker-images/lamp-alchemy-mcp:latest
    mcps:
      - name: alchemy
        token:
          key: toolhive
          property: alchemy_api_key

  coingecko:
    enabled: true
    # Self-built from docker-images/lamp-coingecko-mcp (official npm package @coingecko/coingecko-mcp).
    image: registry.gitlab.com/from-the-lamp/infra/docker-images/lamp-coingecko-mcp:1.0.0
    mcps:
      - name: coingecko
        token:
          key: toolhive
          property: coingecko_demo_api_key

  alphavantage:
    enabled: true
    # Self-built from docker-images/lamp-alphavantage-mcp (official pip package marketdata-mcp-server).
    image: registry.gitlab.com/from-the-lamp/infra/docker-images/lamp-alphavantage-mcp:1.0.2
    mcps:
      - name: alphavantage
        token:
          key: toolhive
          property: alphavantage_api_key

  googlemaps:
    enabled: true
    # No self-built image: Google only offers Maps Grounding Lite as a
    # managed remote MCP endpoint (no open-source server to self-host),
    # proxied via toolhive's MCPRemoteProxy instead of MCPServer.
    remoteUrl: https://mapstools.googleapis.com/mcp
    mcps:
      - name: googlemaps-grounding
        token:
          key: toolhive
          property: googlemaps_grounding_lite_api_key

  thegraph:
    enabled: true
    # Self-built from docker-images/lamp-thegraph-mcp (vendored from kukapay/thegraph-mcp, no packaged release).
    image: registry.gitlab.com/from-the-lamp/infra/docker-images/lamp-thegraph-mcp:latest
    mcps:
      - name: thegraph
        token:
          key: toolhive
          property: thegraph_api_key

  letsfg:
    enabled: true
    # Self-built from docker-images/lamp-letsfg-mcp (npm package letsfg-mcp, no official image).
    # letsfg-mcp only accepts a static LETSFG_BEARER_TOKEN env var (no refresh logic of its
    # own, no config file it writes to), and the OAuth refresh_token rotates on every use.
    # supervisor.py authenticates to HashiCorp Vault via its own ServiceAccount (Kubernetes
    # auth role "letsfg", see terraform/the vault-root setup), reads
    # letsfg_refresh_token/letsfg_client_id from platform/toolhive, exchanges the refresh
    # token for a fresh access token once at container start, writes the rotated
    # refresh_token back, then execs letsfg-mcp. It deliberately does NOT refresh on a timer
    # - letsfg's fraud detection revokes token pairs refreshed continuously without real
    # usage. Instead, healthcheck.py runs as a livenessProbe: it makes one real, cheap search
    # every 10 minutes (locations lookups aren't auth-gated and prove nothing) and only fails
    # the probe on a genuine 401/403, so Kubernetes restarts the pod - and supervisor.py
    # re-refreshes - exactly when the token has actually stopped working, not on a blind
    # schedule.
    image: registry.gitlab.com/from-the-lamp/infra/docker-images/lamp-letsfg-mcp:1.0.0
    mcps:
      - name: letsfg

externalSecrets:
  kind: ClusterSecretStore
  name: vault
  refreshInterval: 1h
  creationPolicy: Orphan
