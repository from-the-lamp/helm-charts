mcp:
  defaults:
    groupRef: mcp-tools
    permissionProfile: network

  grafana:
    enabled: false
    image: grafana/mcp-grafana:1.2.0
    mcps: []

  github:
    enabled: true
    image: ghcr.io/github/github-mcp-server:v1.11.0
    mcps:
      - name: github-xdata
        token:
          key: github-mcp-xdata
          property: personal-access-token

  gitlab:
    enabled: true
    image: zereight050/gitlab-mcp:2.1.51
    mcps:
      - name: gitlab
        apiUrl: https://gitlab.com/api/v4
        permissionMode: full
        token:
          key: gitlab-mcp
          property: personal-access-token
      - name: gitlab-cas-dev
        apiUrl: https://gitlab.v-soft.dev/api/v4
        permissionMode: full
        token:
          key: gitlab-mcp-cas-dev
          property: personal-access-token
      - name: gitlab-cas-gitops
        apiUrl: https://gitlab.v-gitops.cc/api/v4
        permissionMode: full
        token:
          key: gitlab-mcp-cas-gitops
          property: personal-access-token

  kubernetes:
    enabled: true
    image: quay.io/containers/kubernetes_mcp_server:v0.0.66
    mcps:
      - name: kubernetes
        serviceAccount: kubernetes-mcp
      - name: infra-admin
        kubeconfig:
          key: toolhive
          property: kubeconfig-infra
      - name: prod-0-admin
        kubeconfig:
          key: toolhive
          property: kubeconfig-prod-0

  slack:
    enabled: true
    image: ghcr.io/korotovsky/slack-mcp-server:v1.3.0
    mcps:
      - name: slack-cas
        token:
          key: slack-mcp-cas
          property: xoxp-token
      - name: slack-xdata
        token:
          key: slack-mcp-xdata
          property: xoxp-token

  jira:
    enabled: false
    image: ghcr.io/sooperset/mcp-atlassian:0.23.1
    mcps: []

  atlassian:
    enabled: true
    image: xuanxdev/atlassian-mcp:latest
    mcps:
      - name: jira-cas
        domain: jirasolutions.atlassian.net
        email: artem.zverev@v-soft.dev
        token:
          key: toolhive
          property: atlassian_token_cas
      - name: jira-xdata
        domain: xdatagroup.atlassian.net
        email: artem.zverev@xdatagroup.io
        token:
          key: toolhive
          property: atlassian_token_xdata
      - name: jira-currency
        domain: cx-labs-io.atlassian.net
        email: a.zverev@cx-labs.io
        token:
          key: toolhive
          property: atlassian_token_currency

  bitbucket:
    enabled: true
    # Self-built from docker-images/lamp-bitbucket-mcp (ulikoenig/mcp-atlassian-with-bitbucket,
    # a sooperset/mcp-atlassian fork with Bitbucket Cloud support - ghcr.io/ibrahimogod/bitbucket-mcp
    # was tried first but its generic tools declare an untyped `body: serde_json::Value` field that
    # schemars renders as a typeless {} schema, which broke tools/list for the whole vMCP gateway).
    image: registry.gitlab.com/from-the-lamp/infra/docker-images/lamp-bitbucket-mcp:latest
    mcps:
      - name: bitbucket
        username: a.zverev@cx-labs.io
        workspace: currencycom
        token:
          key: toolhive
          property: atlassian_token_currency

  victoriametrics:
    enabled: false
    image: ghcr.io/victoriametrics/mcp-victoriametrics:v1.20.2
    mcps: []

  clickhouse:
    enabled: false
    image: us-central1-docker.pkg.dev/database-toolbox/toolbox/toolbox:1.9.0
    mcps: []

  postgres:
    enabled: false
    image: us-central1-docker.pkg.dev/database-toolbox/toolbox/toolbox:1.9.0
    mcps: []

  redis:
    enabled: false
    image: us-central1-docker.pkg.dev/database-toolbox/toolbox/toolbox:1.9.0
    mcps: []

  kafka:
    enabled: false
    image: ghcr.io/tuannvm/kafka-mcp-server:2.0.2
    mcps: []

  argocd:
    enabled: false
    # No official container image for the argocd-mcp package (it's npx-only:
    # `npx argocd-mcp@latest stdio`) — build/point at your own image before enabling.
    image: ""
    mcps: []

  sheets:
    enabled: true
    # Self-built from docker-images/lamp-google-sheets (xing5/mcp-google-sheets from PyPI).
    image: registry.gitlab.com/from-the-lamp/infra/docker-images/lamp-google-sheets:latest
    mcps:
      - name: sheets
        credentials:
          key: sheets-mcp
          property: service-account-json

  oracle:
    enabled: true
    # Self-built from docker-images/lamp-oracle-mcp (generic OCI SDK wrapper).
    image: registry.gitlab.com/from-the-lamp/infra/docker-images/lamp-oracle-mcp:latest
    mcps:
      - name: oracle-infra
        profile: lamp-infra
        config:
          key: oracle-mcp
          property: config
        keyFiles:
          - name: lamp-infra.pem
            property: lamp-infra-pem
          - name: lamp-prod-0.pem
            property: lamp-prod-0-pem
          - name: lamp-prod-1.pem
            property: lamp-prod-1-pem
      - name: oracle-prod-0
        profile: lamp-prod-0
        config:
          key: oracle-mcp
          property: config
        keyFiles:
          - name: lamp-infra.pem
            property: lamp-infra-pem
          - name: lamp-prod-0.pem
            property: lamp-prod-0-pem
          - name: lamp-prod-1.pem
            property: lamp-prod-1-pem
      - name: oracle-prod-1
        profile: lamp-prod-1
        config:
          key: oracle-mcp
          property: config
        keyFiles:
          - name: lamp-infra.pem
            property: lamp-infra-pem
          - name: lamp-prod-0.pem
            property: lamp-prod-0-pem
          - name: lamp-prod-1.pem
            property: lamp-prod-1-pem

  etherscan:
    enabled: true
    # Self-built from docker-images/lamp-etherscan-mcp (npm package mcp-etherscan-server, no official image).
    image: registry.gitlab.com/from-the-lamp/infra/docker-images/lamp-etherscan-mcp:latest
    mcps:
      - name: etherscan
        token:
          key: etherscan-mcp
          property: api-key

  alchemy:
    enabled: true
    # Self-built from docker-images/lamp-alchemy-mcp (official npm package @alchemy/mcp-server, no official image).
    image: registry.gitlab.com/from-the-lamp/infra/docker-images/lamp-alchemy-mcp:latest
    mcps:
      - name: alchemy
        token:
          key: alchemy-mcp
          property: api-key

  thegraph:
    enabled: true
    # Self-built from docker-images/lamp-thegraph-mcp (vendored from kukapay/thegraph-mcp, no packaged release).
    image: registry.gitlab.com/from-the-lamp/infra/docker-images/lamp-thegraph-mcp:latest
    mcps:
      - name: thegraph
        token:
          key: thegraph-mcp
          property: api-key

  letsfg:
    enabled: true
    # Self-built from docker-images/lamp-letsfg-mcp (npm package letsfg-mcp, no official image).
    # letsfg-mcp only accepts a static LETSFG_BEARER_TOKEN env var (no refresh logic of its
    # own, no config file it writes to), and the OAuth refresh_token rotates on every use.
    # supervisor.py reads the current refresh_token from Vault (via the mounted lamp-infra
    # OCI profile, reusing the oracle-infra MCP's secret), exchanges it for a fresh access
    # token once at container start, writes the rotated refresh_token back, then execs
    # letsfg-mcp. It deliberately does NOT refresh on a timer - letsfg's fraud detection
    # revokes token pairs refreshed continuously without real usage. Instead, healthcheck.py
    # runs as a livenessProbe: it makes one real, cheap search every 10 minutes (locations
    # lookups aren't auth-gated and prove nothing) and only fails the probe on a genuine
    # 401/403, so Kubernetes restarts the pod - and supervisor.py re-refreshes - exactly
    # when the token has actually stopped working, not on a blind schedule.
    image: registry.gitlab.com/from-the-lamp/infra/docker-images/lamp-letsfg-mcp:latest
    mcps:
      - name: letsfg
        ociProfile: lamp-infra
        ociSecretName: oracle-infra-mcp-secret
        vaultSecretId: ocid1.vaultsecret.oc1.eu-frankfurt-1.amaaaaaap56pctia3kx6u2sw3qqt5gkav6rp4pst77gu2lu54qmeram4jcfa

externalSecrets:
  kind: ClusterSecretStore
  name: oracle
  refreshInterval: 1h
  creationPolicy: Orphan
