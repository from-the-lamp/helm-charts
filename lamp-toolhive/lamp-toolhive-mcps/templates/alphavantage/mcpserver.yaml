{{- if .Values.mcp.alphavantage.enabled }}
{{- range $item := .Values.mcp.alphavantage.mcps }}
---
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPServer
metadata:
  name: {{ $item.name }}
spec:
  image: {{ $.Values.mcp.alphavantage.image }}
  transport: stdio
  groupRef:
    name: {{ $item.groupRef | default $.Values.mcp.defaults.groupRef }}
  permissionProfile:
    type: builtin
    name: {{ $.Values.mcp.defaults.permissionProfile }}
  audit:
    enabled: true
  secrets:
    - name: {{ $item.name }}-mcp-secret
      key: api-key
      targetEnvName: ALPHAVANTAGE_API_KEY
  env:
    - name: HOME
      value: /tmp
  podTemplateSpec:
    spec:
      containers:
        - name: mcp
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
{{- end }}
{{- end }}
