{{- if .Values.mcp.vault.enabled }}
{{- range $item := .Values.mcp.vault.mcps }}
---
# No RBAC attached on purpose: Vault's kubernetes auth method validates this
# ServiceAccount's token through the API server's TokenReview, so the identity
# is all that is needed here. What it may read is decided by the Vault policy
# bound to the role in the Vault CR, not by anything in this cluster.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $item.name }}
{{- end }}
{{- end }}
