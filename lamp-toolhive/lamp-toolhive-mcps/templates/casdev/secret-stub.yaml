{{- if .Values.mcp.casDev.enabled }}
# Deliberately has no data/stringData - populated by the CronJob below via
# kubectl patch, same idiom as windmill/secret-stub.yaml. RBAC is scoped to
# "patch" this one resourceName instead of a broad "create secrets" grant.
apiVersion: v1
kind: Secret
metadata:
  name: cas-dev-mcp-auth-header
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
{{- end }}
