{{- if .Values.mcp.casDev.enabled }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cas-dev-proxy-credentials
spec:
  refreshInterval: {{ $.Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    kind: {{ $.Values.externalSecrets.kind }}
    name: {{ $.Values.externalSecrets.name }}
  target:
    name: cas-dev-proxy-credentials
    creationPolicy: {{ $.Values.externalSecrets.creationPolicy }}
  data:
    - secretKey: password
      remoteRef:
        key: {{ .Values.mcp.casDev.tokenRefresher.credentials.key }}
        property: {{ .Values.mcp.casDev.tokenRefresher.credentials.passwordProperty }}
    - secretKey: delegateSecret
      remoteRef:
        key: {{ .Values.mcp.casDev.tokenRefresher.credentials.key }}
        property: {{ .Values.mcp.casDev.tokenRefresher.credentials.delegateSecretProperty }}
{{- end }}
