{{- if .Values.mcp.casDev.enabled }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cas-dev-zitadel-client
spec:
  refreshInterval: {{ $.Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    kind: {{ $.Values.externalSecrets.kind }}
    name: {{ $.Values.externalSecrets.name }}
  target:
    name: cas-dev-zitadel-client
    creationPolicy: {{ $.Values.externalSecrets.creationPolicy }}
  data:
    - secretKey: clientId
      remoteRef:
        key: {{ .Values.mcp.casDev.tokenRefresher.clientCredentials.key }}
        property: {{ .Values.mcp.casDev.tokenRefresher.clientCredentials.clientIdProperty }}
    - secretKey: clientSecret
      remoteRef:
        key: {{ .Values.mcp.casDev.tokenRefresher.clientCredentials.key }}
        property: {{ .Values.mcp.casDev.tokenRefresher.clientCredentials.clientSecretProperty }}
{{- end }}
