{{- if .Values.mcp.linkedin.enabled }}
{{- range $item := .Values.mcp.linkedin.mcps }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $item.name }}-mcp-session
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ $item.sessionClaimSize }}
---
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPServer
metadata:
  name: {{ $item.name }}
spec:
  image: {{ $.Values.mcp.linkedin.image }}
  transport: stdio
  groupRef:
    name: {{ $item.groupRef | default $.Values.mcp.defaults.groupRef }}
  permissionProfile:
    type: builtin
    name: {{ $.Values.mcp.defaults.permissionProfile }}
  audit:
    enabled: true
  podTemplateSpec:
    spec:
      containers:
        - name: mcp
          volumeMounts:
            - name: session
              mountPath: /home/pwuser/.linkedin-mcp
      volumes:
        - name: session
          persistentVolumeClaim:
            claimName: {{ $item.name }}-mcp-session
  {{- with $item.env }}
  env:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
{{- end }}
