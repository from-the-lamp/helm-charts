{{- if .Values.mcp.linkedin.enabled }}
{{- range $item := .Values.mcp.linkedin.mcps }}
---
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPServer
metadata:
  name: {{ $item.name }}
spec:
  image: {{ $.Values.mcp.linkedin.image }}
  transport: stdio
  groupRef:
    name: {{ $item.groupRef | default $.Values.mcp.defaults.groupRef }}
  permissionProfile:
    type: builtin
    name: {{ $.Values.mcp.defaults.permissionProfile }}
  audit:
    enabled: true
  volumes:
    - name: session
      hostPath: {{ $item.sessionHostPath }}
      mountPath: /home/pwuser/.linkedin-mcp
  {{- with $item.env }}
  env:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
{{- end }}
