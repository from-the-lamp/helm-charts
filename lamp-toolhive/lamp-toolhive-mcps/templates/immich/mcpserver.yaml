{{- if .Values.mcp.immich.enabled }}
{{- range $item := .Values.mcp.immich.mcps }}
---
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPServer
metadata:
  name: mcp-{{ $item.name }}
spec:
  image: {{ $.Values.mcp.immich.image }}
  transport: streamable-http
  mcpPort: {{ $.Values.mcp.immich.mcpPort }}
  proxyPort: 8080
  groupRef:
    name: {{ $item.groupRef | default $.Values.mcp.defaults.groupRef }}
  permissionProfile:
    type: builtin
    name: {{ $.Values.mcp.defaults.permissionProfile }}
  audit:
    enabled: true
  {{- with $item.toolConfig }}
  toolConfigRef:
    name: {{ $item.name }}-tool-config
  {{- end }}
  secrets:
    - name: {{ $item.name }}-mcp-secret
      key: api-key
      targetEnvName: IMMICH_API_KEY
  env:
    - name: IMMICH_BASE_URL
      value: {{ $item.baseUrl | default $.Values.mcp.immich.baseUrl }}
    - name: MCP_ALLOWED_HOSTS
      value: mcp-mcp-{{ $item.name }}
    {{- with $item.env }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with $item.toolConfig }}
  ---
  apiVersion: toolhive.stacklok.dev/v1beta1
  kind: MCPToolConfig
  metadata:
    name: {{ $item.name }}-tool-config
  spec:
    {{- with .toolsFilter }}
    toolsFilter:
      {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- with .toolsOverride }}
    toolsOverride:
      {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- end }}
{{- end }}
{{- end }}
