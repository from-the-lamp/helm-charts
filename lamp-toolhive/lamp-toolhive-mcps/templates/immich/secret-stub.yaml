{{- if .Values.mcp.immich.enabled }}
# Deliberately has no data/stringData - exists only so the bootstrap Job's
# RBAC can be scoped to "patch" an already-existing resourceName instead of
# a broad "create secrets" grant, same pattern as windmill's own
# windmill-mcp-auth-header stub (see templates/windmill/secret-stub.yaml).
# The Job adds the real api-key itself; since this manifest never declares
# that key, ArgoCD's sync never touches or reverts it.
apiVersion: v1
kind: Secret
metadata:
  name: immich-mcp-secret
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
{{- end }}
