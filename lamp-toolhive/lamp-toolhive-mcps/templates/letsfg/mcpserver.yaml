{{- if .Values.mcp.letsfg.enabled }}
{{- range $item := .Values.mcp.letsfg.mcps }}
---
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPServer
metadata:
  name: {{ $item.name }}
spec:
  image: {{ $.Values.mcp.letsfg.image }}
  transport: stdio
  groupRef:
    name: {{ $item.groupRef | default $.Values.mcp.defaults.groupRef }}
  permissionProfile:
    type: builtin
    name: {{ $.Values.mcp.defaults.permissionProfile }}
  audit:
    enabled: true
  env:
    - name: VAULT_ADDR
      value: {{ $item.vaultAddr | default "http://vault.vault:8200" }}
    - name: VAULT_K8S_ROLE
      value: {{ $item.vaultK8sRole | default "letsfg" }}
  podTemplateSpec:
    spec:
      containers:
        - name: mcp
          livenessProbe:
            exec:
              command: ["python3", "/app/healthcheck.py"]
            initialDelaySeconds: 30
            periodSeconds: 600
            timeoutSeconds: 15
            failureThreshold: 1
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
{{- end }}
{{- end }}
