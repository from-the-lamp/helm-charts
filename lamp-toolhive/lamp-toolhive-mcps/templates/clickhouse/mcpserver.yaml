{{- if .Values.mcp.clickhouse.enabled }}
{{- range $item := .Values.mcp.clickhouse.mcps }}
---
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPServer
metadata:
  name: {{ $item.name }}
spec:
  image: {{ $.Values.mcp.clickhouse.image }}
  transport: stdio
  args:
    - --stdio
    - --tools-file
    - /etc/toolhive/toolbox/tools.yaml
  groupRef:
    name: {{ $item.groupRef | default $.Values.mcp.defaults.groupRef }}
  permissionProfile:
    type: builtin
    name: {{ $.Values.mcp.defaults.permissionProfile }}
  audit:
    enabled: true
  {{- with $item.toolConfig }}
  toolConfigRef:
    name: {{ $item.name }}-tool-config
  {{- end }}
  podTemplateSpec:
    spec:
      containers:
        - name: mcp
          env:
            {{- range $e := $item.envs }}
            - name: {{ $e.env | upper }}_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $item.name }}-mcp-secret
                  key: {{ $e.env }}_password
            {{- end }}
          volumeMounts:
            - name: tools-config
              mountPath: /etc/toolhive/toolbox
              readOnly: true
      volumes:
        - name: tools-config
          configMap:
            name: {{ $item.name }}-tools
  {{- with $item.env }}
  env:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with $item.toolConfig }}
---
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPToolConfig
metadata:
  name: {{ $item.name }}-tool-config
spec:
  {{- with .toolsFilter }}
  toolsFilter:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .toolsOverride }}
  toolsOverride:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- end }}
{{- end }}
{{- end }}
