{{- if .Values.mcp.grafana.enabled }}
{{- $namespaces := list }}
{{- range $item := .Values.mcp.grafana.mcps }}
{{- if $item.instanceName }}
{{- $namespaces = append $namespaces $item.instanceNamespace }}
{{- end }}
{{- end }}
{{- range $ns := uniq $namespaces }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: grafana-secret-reader-{{ $ns }}
  namespace: {{ $.Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: grafana-secret-reader
  namespace: {{ $ns }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames:
      {{- range $item := $.Values.mcp.grafana.mcps }}
      {{- if and $item.instanceName (eq $item.instanceNamespace $ns) }}
      - {{ $item.name }}-mcp-secret
      {{- end }}
      {{- end }}
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: grafana-secret-reader
  namespace: {{ $ns }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: grafana-secret-reader
subjects:
  - kind: ServiceAccount
    name: grafana-secret-reader-{{ $ns }}
    namespace: {{ $.Release.Namespace }}
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: grafana-mirror-{{ $ns }}
  namespace: {{ $.Release.Namespace }}
spec:
  provider:
    kubernetes:
      remoteNamespace: {{ $ns }}
      server:
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
      auth:
        serviceAccount:
          name: grafana-secret-reader-{{ $ns }}
{{- end }}
{{- end }}
