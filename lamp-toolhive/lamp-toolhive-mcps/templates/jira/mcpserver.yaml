{{- if .Values.mcp.jira.enabled }}
{{- range $item := .Values.mcp.jira.mcps }}
---
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPServer
metadata:
  name: {{ $item.name }}
spec:
  image: {{ $.Values.mcp.jira.image }}
  transport: stdio
  args:
    - --transport
    - stdio
  groupRef:
    name: {{ $item.groupRef | default $.Values.mcp.defaults.groupRef }}
  permissionProfile:
    type: builtin
    name: {{ $.Values.mcp.defaults.permissionProfile }}
  audit:
    enabled: true
  {{- with $item.toolConfig }}
  toolConfigRef:
    name: {{ $item.name }}-tool-config
  {{- end }}
  env:
    - name: JIRA_URL
      value: {{ $item.url }}
    - name: JIRA_USERNAME
      value: {{ $item.username }}
    {{- with $item.env }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  secrets:
    - name: {{ $item.name }}-mcp-secret
      key: api-token
      targetEnvName: JIRA_API_TOKEN
  {{- with $item.toolConfig }}
---
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPToolConfig
metadata:
  name: {{ $item.name }}-tool-config
spec:
  {{- with .toolsFilter }}
  toolsFilter:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .toolsOverride }}
  toolsOverride:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- end }}
{{- end }}
{{- end }}
