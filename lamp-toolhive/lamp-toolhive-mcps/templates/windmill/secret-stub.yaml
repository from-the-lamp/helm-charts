{{- if .Values.mcp.windmill.enabled }}
# Deliberately has no data/stringData - exists only so the bootstrap Job's
# RBAC can be scoped to "patch" an already-existing resourceName instead of
# a broad "create secrets" grant. The Job adds the real authHeader key
# itself; since this manifest never declares that key, ArgoCD's sync never
# touches or reverts it.
apiVersion: v1
kind: Secret
metadata:
  name: windmill-mcp-auth-header
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
{{- end }}
