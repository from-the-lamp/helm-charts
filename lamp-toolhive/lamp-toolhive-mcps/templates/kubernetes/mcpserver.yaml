{{- if .Values.mcp.kubernetes.enabled }}
{{- range $item := .Values.mcp.kubernetes.mcps }}
{{- if or $item.kubeconfig $item.connectGateway }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $item.name }}-mcp-config
data:
  config.toml: |
    kubeconfig = "/etc/toolhive/kubeconfig/config"
    cluster_provider_strategy = "kubeconfig"
{{- end }}
---
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPServer
metadata:
  name: mcp-{{ $item.name }}
spec:
  image: {{ $.Values.mcp.kubernetes.image }}
  transport: streamable-http
  mcpPort: {{ $.Values.mcp.kubernetes.mcpPort }}
  proxyPort: 8080
  groupRef:
    name: {{ $item.groupRef | default $.Values.mcp.defaults.groupRef }}
  permissionProfile:
    type: builtin
    name: {{ $.Values.mcp.defaults.permissionProfile }}
  audit:
    enabled: true
  {{- with $item.toolConfig }}
  toolConfigRef:
    name: {{ $item.name }}-tool-config
  {{- end }}
  {{- if $item.kubeconfig }}
  args:
    - --config
    - /etc/toolhive/mcp-config/config.toml
  podTemplateSpec:
    spec:
      containers:
        - name: mcp
          volumeMounts:
            - name: kubeconfig
              mountPath: /etc/toolhive/kubeconfig
              readOnly: true
            - name: mcp-config
              mountPath: /etc/toolhive/mcp-config
              readOnly: true
      volumes:
        - name: kubeconfig
          secret:
            secretName: {{ $item.name }}-mcp-secret
            items:
              - key: kubeconfig
                path: config
        - name: mcp-config
          configMap:
            name: {{ $item.name }}-mcp-config
  {{- else if $item.connectGateway }}
  args:
    - --config
    - /etc/toolhive/mcp-config/config.toml
  serviceAccount: {{ $item.connectGateway.serviceAccount }}
  podTemplateSpec:
    spec:
      nodeSelector:
        iam.gke.io/gke-metadata-server-enabled: "true"
      containers:
        - name: mcp
          volumeMounts:
            - name: kubeconfig
              mountPath: /etc/toolhive/kubeconfig
              readOnly: true
            - name: mcp-config
              mountPath: /etc/toolhive/mcp-config
              readOnly: true
      volumes:
        - name: kubeconfig
          configMap:
            name: {{ $item.name }}-kubeconfig
            defaultMode: 0755
        - name: mcp-config
          configMap:
            name: {{ $item.name }}-mcp-config
  {{- else }}
  serviceAccount: {{ $item.serviceAccount }}
  {{- end }}
  {{- with $item.env }}
  env:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with $item.toolConfig }}
---
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPToolConfig
metadata:
  name: {{ $item.name }}-tool-config
spec:
  {{- with .toolsFilter }}
  toolsFilter:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .toolsOverride }}
  toolsOverride:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- end }}
{{- end }}
{{- end }}
