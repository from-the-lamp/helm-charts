{{- if .Values.mcp.kubernetes.enabled }}
{{- $serviceAccounts := dict }}
{{- range $item := .Values.mcp.kubernetes.mcps }}
{{- if and $item.serviceAccount (not $item.kubeconfig) (not $item.connectGateway) }}
{{- $_ := set $serviceAccounts $item.serviceAccount ($item.clusterRole | default "view") }}
{{- end }}
{{- end }}
{{- range $sa, $clusterRole := $serviceAccounts }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $sa }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $sa }}-{{ $clusterRole }}
subjects:
  - kind: ServiceAccount
    name: {{ $sa }}
    namespace: {{ $.Release.Namespace }}
roleRef:
  kind: ClusterRole
  name: {{ $clusterRole }}
  apiGroup: rbac.authorization.k8s.io
{{- end }}
{{- end }}
