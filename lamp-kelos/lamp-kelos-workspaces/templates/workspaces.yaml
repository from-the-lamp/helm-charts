{{- range .Values.kelosWorkspaces }}
---
apiVersion: kelos.dev/v1alpha2
kind: Workspace
metadata:
  name: {{ .name }}
  namespace: {{ $.Values.namespace }}
spec:
  repo: {{ .repo }}
  ref: main
  secretRef:
    name: {{ .secretRef }}
  setupCommand:
    - sh
    - -c
    - |
      {{- include "lamp-kelos-workspaces.setupScript" .gitIdentity | nindent 6 }}
{{- end }}
