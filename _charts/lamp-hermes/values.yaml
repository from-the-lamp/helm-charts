image:
  name: docker.io/nousresearch/hermes-agent
  tag: v2026.7.20
  pullPolicy: IfNotPresent
imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

replicaCount: 1
args:
  - gateway
  - run

seedDotenv:
  enabled: true
  uid: 10000
  gid: 10000

serviceAccount:
  create: true
  annotations: {}
  name: ""
podAnnotations: {}
podSecurityContext: {}
securityContext: {}
config:
  data:
    model:
      default: "gpt-5.5"
      provider: "openai-codex"
      max_tokens: 8192
    terminal:
      backend: "local"
      cwd: "."
      timeout: 180
      lifetime_seconds: 300
    browser:
      inactivity_timeout: 120
    compression:
      enabled: true
      threshold: 0.50
      target_ratio: 0.20
      protect_last_n: 20
      protect_first_n: 3
    memory:
      memory_enabled: true
      user_profile_enabled: true
      memory_char_limit: 2200
      user_char_limit: 1375
      nudge_interval: 10
      flush_min_turns: 6
    session_reset:
      mode: both
      idle_minutes: 1440
      at_hour: 4
    agent:
      max_turns: 60
      verbose: false
      reasoning_effort: "medium"
    skills:
      creation_nudge_interval: 15
    display:
      compact: false
      tool_progress: all
      skin: default
    stt:
      enabled: true
      local:
        model: "base"

persistence:
  enabled: true
  storageClass: local-path
  size: 20Gi
  accessMode: ReadWriteOnce
  annotations: {}
  selector: {}
service:
  enabled: false
  type: ClusterIP
  port: 9119
  targetPort: 9119
  portName: dashboard
  annotations: {}

resources:
  limits: {}
  requests:
    memory: 10Mi
    cpu: 10m

nodeSelector: {}
tolerations: []
affinity: {}

lifecycle:
  preStop:
    exec:
      command:
        - sh
        - -c
        - rm -f /opt/data/gateway.*.lock; sleep 10

livenessProbe:
  enabled: false
  tcpSocket:
    port: 9119
  initialDelaySeconds: 60
  periodSeconds: 60
  timeoutSeconds: 10
  failureThreshold: 3
readinessProbe:
  enabled: false
  tcpSocket:
    port: 9119
  initialDelaySeconds: 10
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 3
startupProbe:
  enabled: false
  tcpSocket:
    port: 9119
  initialDelaySeconds: 10
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 30

authJson:
  enabled: true
  remoteKey: hermes-auth-json

remoteSecretKeys:
  openrouterApiKey: openrouter-api-key
  anthropicApiKey: claude-api-key
  telegramBotToken: telegram-bot-hermes-djinn
  gitlabToken: gitlab-token-jorik

extraEnv:
  TELEGRAM_ALLOWED_USERS: "306361331"
  GATEWAY_ALLOW_ALL_USERS: "false"
  TELEGRAM_HOME_CHANNEL: "306361331"
  TELEGRAM_HOME_CHANNEL_NAME: "DM"

externalSecrets:
  kind: ClusterSecretStore
  name: oracle
  refreshInterval: 1h
  creationPolicy: Orphan
