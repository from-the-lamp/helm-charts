apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "hermes.fullname" . }}
  labels:
    {{- include "hermes.labels" . | nindent 4 }}
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  serviceName: {{ include "hermes.fullname" . }}
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "hermes.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "hermes.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "hermes.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- if .Values.seedDotenv.enabled }}
      initContainers:
        - name: seed-dotenv
          image: "{{ .Values.image.name }}{{ if hasPrefix "sha256:" .Values.image.tag }}@{{ else }}:{{ end }}{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - sh
            - -c
            - |
              set -eu
              env_file=/opt/data/.env
              tmp="$env_file.seed.tmp"
              touch "$env_file"
              for f in /run/hermes-env/*; do
                [ -f "$f" ] || continue
                key=$(basename "$f")
                case "$key" in
                  *_KEY|*_TOKEN) : ;;
                  *) continue ;;
                esac
                val=$(cat "$f")
                [ -n "$val" ] || continue
                grep -v "^$key=" "$env_file" > "$tmp" 2>/dev/null || true
                printf '%s=%s\n' "$key" "$val" >> "$tmp"
                mv "$tmp" "$env_file"
              done
              chown {{ .Values.seedDotenv.uid }}:{{ .Values.seedDotenv.gid }} "$env_file" || true
              chmod 600 "$env_file"
          volumeMounts:
            - name: data
              mountPath: /opt/data
              subPath: hermes-state
            - name: env-secret
              mountPath: /run/hermes-env
              readOnly: true
      {{- end }}
      containers:
        - name: hermes
          image: "{{ .Values.image.name }}{{ if hasPrefix "sha256:" .Values.image.tag }}@{{ else }}:{{ end }}{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            {{- toYaml .Values.args | nindent 12 }}
          envFrom:
            - secretRef:
                name: {{ .Release.Name }}-env
          volumeMounts:
            - name: config
              subPath: config.yaml
              mountPath: /opt/data/config.yaml
            - name: data
              mountPath: /opt/data
              subPath: hermes-state
          {{- if .Values.livenessProbe.enabled }}
          livenessProbe:
            {{- omit .Values.livenessProbe "enabled" | toYaml | nindent 12 }}
          {{- end }}
          {{- if .Values.readinessProbe.enabled }}
          readinessProbe:
            {{- omit .Values.readinessProbe "enabled" | toYaml | nindent 12 }}
          {{- end }}
          {{- if .Values.startupProbe.enabled }}
          startupProbe:
            {{- omit .Values.startupProbe "enabled" | toYaml | nindent 12 }}
          {{- end }}
          {{- with .Values.lifecycle }}
          lifecycle:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
      volumes:
        - name: config
          configMap:
            name: {{ .Release.Name }}-config
        {{- if .Values.seedDotenv.enabled }}
        - name: env-secret
          secret:
            secretName: {{ .Release.Name }}-env
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  {{- if .Values.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: data
        {{- with .Values.persistence.annotations }}
        annotations:
          {{- toYaml . | nindent 10 }}
        {{- end }}
      spec:
        accessModes:
          - {{ .Values.persistence.accessMode }}
        {{- if .Values.persistence.storageClass }}
        storageClassName: {{ .Values.persistence.storageClass }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.persistence.size }}
        {{- with .Values.persistence.selector }}
        selector:
          {{- toYaml . | nindent 10 }}
        {{- end }}
  {{- end }}
