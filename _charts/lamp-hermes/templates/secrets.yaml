apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Release.Name }}-env
spec:
  refreshInterval: "{{ .Values.externalSecrets.refreshInterval }}"
  secretStoreRef:
    kind: "{{ .Values.externalSecrets.kind }}"
    name: "{{ .Values.externalSecrets.name }}"
  target:
    name: {{ .Release.Name }}-env
    creationPolicy: "{{ .Values.externalSecrets.creationPolicy }}"
    template:
      data:
        # Hermes runtime — entrypoint reads these as process env (overriding ~/.hermes/.env).
        HERMES_HOME: /opt/data
        HERMES_UID: "10000"
        HERMES_GID: "10000"
        {{- if .Values.authJson.enabled }}
        HERMES_AUTH_JSON_BOOTSTRAP: "0"
        {{- end }}
        {{- range $k, $v := .Values.extraEnv }}
        {{ $k }}: {{ $v | quote }}
        {{- end }}
        {{- if .Values.remoteSecretKeys.openrouterApiKey }}
        OPENROUTER_API_KEY: "{{`{{ .openrouter_api_key }}`}}"
        {{- end }}
        {{- if .Values.remoteSecretKeys.anthropicApiKey }}
        ANTHROPIC_API_KEY: "{{`{{ .anthropic_api_key }}`}}"
        {{- end }}
        {{- if .Values.remoteSecretKeys.openaiApiKey }}
        OPENAI_API_KEY: "{{`{{ .openai_api_key }}`}}"
        {{- end }}
        {{- if .Values.remoteSecretKeys.googleApiKey }}
        GOOGLE_API_KEY: "{{`{{ .google_api_key }}`}}"
        {{- end }}
        {{- if .Values.remoteSecretKeys.telegramBotToken }}
        TELEGRAM_BOT_TOKEN: "{{`{{ .telegram_bot_token }}`}}"
        {{- end }}
        {{- if .Values.remoteSecretKeys.slackBotToken }}
        SLACK_BOT_TOKEN: "{{`{{ .slack_bot_token }}`}}"
        {{- end }}
        {{- if .Values.remoteSecretKeys.slackAppToken }}
        SLACK_APP_TOKEN: "{{`{{ .slack_app_token }}`}}"
        {{- end }}
        {{- if .Values.remoteSecretKeys.discordBotToken }}
        DISCORD_BOT_TOKEN: "{{`{{ .discord_bot_token }}`}}"
        {{- end }}
        {{- if .Values.remoteSecretKeys.apiServerKey }}
        API_SERVER_KEY: "{{`{{ .api_server_key }}`}}"
        {{- end }}
        {{- if .Values.remoteSecretKeys.browserbaseApiKey }}
        BROWSERBASE_API_KEY: "{{`{{ .browserbase_api_key }}`}}"
        {{- end }}
        {{- if .Values.remoteSecretKeys.browserbaseProjectId }}
        BROWSERBASE_PROJECT_ID: "{{`{{ .browserbase_project_id }}`}}"
        {{- end }}
        {{- if .Values.remoteSecretKeys.falKey }}
        FAL_KEY: "{{`{{ .fal_key }}`}}"
        {{- end }}
        {{- if .Values.remoteSecretKeys.exaApiKey }}
        EXA_API_KEY: "{{`{{ .exa_api_key }}`}}"
        {{- end }}
        {{- if .Values.remoteSecretKeys.firecrawlApiKey }}
        FIRECRAWL_API_KEY: "{{`{{ .firecrawl_api_key }}`}}"
        {{- end }}
        {{- if .Values.remoteSecretKeys.githubToken }}
        GITHUB_TOKEN: "{{`{{ .github_token }}`}}"
        {{- end }}
  data:
  {{- if .Values.remoteSecretKeys.openrouterApiKey }}
  - secretKey: openrouter_api_key
    remoteRef:
      key: {{ .Values.remoteSecretKeys.openrouterApiKey }}
  {{- end }}
  {{- if .Values.remoteSecretKeys.anthropicApiKey }}
  - secretKey: anthropic_api_key
    remoteRef:
      key: {{ .Values.remoteSecretKeys.anthropicApiKey }}
  {{- end }}
  {{- if .Values.remoteSecretKeys.openaiApiKey }}
  - secretKey: openai_api_key
    remoteRef:
      key: {{ .Values.remoteSecretKeys.openaiApiKey }}
  {{- end }}
  {{- if .Values.remoteSecretKeys.googleApiKey }}
  - secretKey: google_api_key
    remoteRef:
      key: {{ .Values.remoteSecretKeys.googleApiKey }}
  {{- end }}
  {{- if .Values.remoteSecretKeys.telegramBotToken }}
  - secretKey: telegram_bot_token
    remoteRef:
      key: {{ .Values.remoteSecretKeys.telegramBotToken }}
  {{- end }}
  {{- if .Values.remoteSecretKeys.slackBotToken }}
  - secretKey: slack_bot_token
    remoteRef:
      key: {{ .Values.remoteSecretKeys.slackBotToken }}
  {{- end }}
  {{- if .Values.remoteSecretKeys.slackAppToken }}
  - secretKey: slack_app_token
    remoteRef:
      key: {{ .Values.remoteSecretKeys.slackAppToken }}
  {{- end }}
  {{- if .Values.remoteSecretKeys.discordBotToken }}
  - secretKey: discord_bot_token
    remoteRef:
      key: {{ .Values.remoteSecretKeys.discordBotToken }}
  {{- end }}
  {{- if .Values.remoteSecretKeys.apiServerKey }}
  - secretKey: api_server_key
    remoteRef:
      key: {{ .Values.remoteSecretKeys.apiServerKey }}
  {{- end }}
  {{- if .Values.remoteSecretKeys.browserbaseApiKey }}
  - secretKey: browserbase_api_key
    remoteRef:
      key: {{ .Values.remoteSecretKeys.browserbaseApiKey }}
  {{- end }}
  {{- if .Values.remoteSecretKeys.browserbaseProjectId }}
  - secretKey: browserbase_project_id
    remoteRef:
      key: {{ .Values.remoteSecretKeys.browserbaseProjectId }}
  {{- end }}
  {{- if .Values.remoteSecretKeys.falKey }}
  - secretKey: fal_key
    remoteRef:
      key: {{ .Values.remoteSecretKeys.falKey }}
  {{- end }}
  {{- if .Values.remoteSecretKeys.exaApiKey }}
  - secretKey: exa_api_key
    remoteRef:
      key: {{ .Values.remoteSecretKeys.exaApiKey }}
  {{- end }}
  {{- if .Values.remoteSecretKeys.firecrawlApiKey }}
  - secretKey: firecrawl_api_key
    remoteRef:
      key: {{ .Values.remoteSecretKeys.firecrawlApiKey }}
  {{- end }}
  {{- if .Values.remoteSecretKeys.githubToken }}
  - secretKey: github_token
    remoteRef:
      key: {{ .Values.remoteSecretKeys.githubToken }}
  {{- end }}
{{- if .Values.authJson.enabled }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Release.Name }}-auth-json
spec:
  refreshInterval: "{{ .Values.externalSecrets.refreshInterval }}"
  secretStoreRef:
    kind: "{{ .Values.externalSecrets.kind }}"
    name: "{{ .Values.externalSecrets.name }}"
  target:
    name: {{ .Release.Name }}-auth-json
    creationPolicy: "{{ .Values.externalSecrets.creationPolicy }}"
    template:
      data:
        auth.json: |
          {{`{{ .auth_json }}`}}
  data:
  - secretKey: auth_json
    remoteRef:
      key: {{ .Values.authJson.remoteKey }}
{{- end }}
