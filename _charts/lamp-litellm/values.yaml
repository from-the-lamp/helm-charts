externalSecrets:
  kind: ClusterSecretStore
  name: oracle
  refreshInterval: 1h
  creationPolicy: Orphan

# All litellm secrets live as properties of a single Oracle Vault secret
# (remoteRef.key below) - one JSON object with a field per property.
masterKey:
  secretName: litellm-masterkey
  remoteRef:
    key: litellm
    property: master_key

authJson:
  secretName: litellm-codex-auth
  remoteRef:
    key: litellm
    property: auth_json

# Unrelated to the "litellm" vault secret above - shared GitLab registry
# token reused by many charts, stays its own Vault entry.
imagePullSecret:
  secretName: litellm-image-pull
  registry: registry.gitlab.com/from-the-lamp
  username: token
  remoteKey: gitlab-token

# Models served through the ChatGPT/Codex OAuth handler. Shared by the main
# proxy config and every account worker's config.
codexModels:
  - gpt-5.6-sol
  - gpt-5.6-terra
  - gpt-5.6-luna

# Additional ChatGPT accounts. The account already wired into the main proxy
# (authJson above) always stays; each entry here spins up its own isolated
# worker deployment + secret and is added to the main proxy's model_list as
# an extra load-balanced/failover deployment. To add an account: add its
# auth.json under a new property in the "litellm" Vault secret, then add one
# entry here.
codexAccounts: []

# Cheap delegation/worker models served directly off the DeepSeek API. To
# enable: point deepseekApiKey.remoteRef at wherever the key lives in Vault
# and list the model ids here - each becomes `deepseek/<model>` in litellm's
# model_list.
deepseekApiKey:
  secretName: litellm-deepseek
  remoteRef:
    key: litellm
    property: deepseek_api_key
deepseekModels:
  - deepseek-v4-flash

proxyConfigMap:
  name: litellm-proxy-config
  key: config.yaml

litellm-helm:
  environmentSecrets:
    - litellm-deepseek

  image:
    repository: registry.gitlab.com/from-the-lamp/infra/docker-images/lamp-litellm
    tag: latest
    pullPolicy: Always

  imagePullSecrets:
    - name: litellm-image-pull

  replicaCount: 1

  deploymentAnnotations:
    reloader.stakater.com/auto: "true"

  masterkeySecretName: litellm-masterkey
  masterkeySecretKey: masterkey

  db:
    deployStandalone: false
    useExisting: false

  migrationJob:
    enabled: false

  service:
    type: ClusterIP
    port: 4000

  envVars:
    CODEX_AUTH_FILE: /etc/litellm/auth.json
    OPENAI_API_KEY: sk-litellm-codex-placeholder

  volumes:
    - name: codex-auth
      secret:
        secretName: litellm-codex-auth
  volumeMounts:
    - name: codex-auth
      mountPath: /etc/litellm/auth.json
      subPath: auth.json
      readOnly: true

  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      memory: 3Gi

  proxyConfigMap:
    create: false
    name: litellm-proxy-config
    key: config.yaml
