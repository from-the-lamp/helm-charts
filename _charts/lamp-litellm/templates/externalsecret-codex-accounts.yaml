{{- range .Values.codexAccounts }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: litellm-codex-auth-{{ .name }}
spec:
  refreshInterval: "{{ $.Values.externalSecrets.refreshInterval }}"
  secretStoreRef:
    kind: "{{ $.Values.externalSecrets.kind }}"
    name: "{{ $.Values.externalSecrets.name }}"
  target:
    name: litellm-codex-auth-{{ .name }}
    creationPolicy: "{{ $.Values.externalSecrets.creationPolicy }}"
    template:
      data:
        auth.json: |
          {{`{{ .auth_json }}`}}
  data:
  - secretKey: auth_json
    remoteRef:
      {{- include "lamp-litellm.remoteRef" (merge (dict "name" (printf "codexAccounts.%s" .name)) .remoteRef) | nindent 6 }}
{{- end }}
