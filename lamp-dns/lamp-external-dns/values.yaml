cloudflare:
  remoteSecretKey: cert-manager
  remoteSecretProperty: cloudflare-dns-solver-token

external-dns:
  # domainFilters:
  #   - from-the-lamp.work
  extraArgs:
    - --cloudflare-proxied
  # istio-gateway-public's Service already carries explicit
  # external-dns.alpha.kubernetes.io/hostname+target annotations (a single
  # wildcard record covering every public subdomain) - "service" alone picks
  # that up. Deliberately NOT adding "gateway-httproute": it would also match
  # HTTPRoutes on the internal gateway (ClusterIP, no target annotation),
  # leaking *.internal.from-the-lamp.work hostnames into public DNS with a
  # target that can never resolve.
  sources:
    - service
  policy: sync
  logLevel: debug
  provider:
    name: cloudflare
  env:
    - name: CF_API_TOKEN
      valueFrom:
        secretKeyRef:
          name: cloudflare
          key: token

externalSecrets:
  kind: ClusterSecretStore
  name: vault
  refreshInterval: 1h
  creationPolicy: Orphan
