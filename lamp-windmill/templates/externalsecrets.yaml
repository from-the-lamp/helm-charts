{{- $db := .Values.database }}
{{- $dbUrl := printf "postgres://%s:{{ .password }}@%s:%v/%s?sslmode=%s" $db.user $db.host $db.port $db.name $db.sslmode }}
{{- $dbSecret := .Values.windmill.windmill }}
{{ include "lamp-windmill.externalSecret" (dict "root" . "name" $dbSecret.databaseUrlSecretName "template" (dict $dbSecret.databaseUrlSecretKey $dbUrl) "data" (dict "password" $db.passwordRef)) }}
---
{{ include "lamp-windmill.externalSecret" (dict "root" . "name" "windmill-superadmin-secret" "data" (dict "secret" .Values.superadminSecretRef)) }}
{{- with .Values.oauth.gitlab.secretRef }}
---
{{ include "lamp-windmill.externalSecret" (dict "root" $ "name" "windmill-oauth-gitlab" "data" (dict "secret" .)) }}
{{- end }}
