image:
  name: registry.gitlab.com/from-the-lamp/infra/docker-images/lamp-hermes
  tag: latest
  pullPolicy: Always
imagePullSecrets:
  - name: hermes-image-pull
imagePullSecret:
  secretName: hermes-image-pull
  registry: registry.gitlab.com/from-the-lamp
  username: token
  remoteKey: gitlab-token
nameOverride: ""
fullnameOverride: ""

replicaCount: 1
args:
  - gateway
  - run

hermes:
  home: /opt/data
  uid: 10000
  gid: 10000

seedDotenv:
  enabled: true

# Syncs the djinn-home/skills marketplace (full copy of xdatagroup/claude-marketplace,
# rebranded xdatagroup -> djinn) onto the persistent skills/ dir on every pod start.
# Hermes discovers skills via a recursive SKILL.md scan (rglob), so the marketplace's
# nested plugins/<plugin>/skills/<skill>/SKILL.md layout works as-is - no flattening
# needed.
skillsSync:
  enabled: true
  repo: https://gitlab.com/djinn-home/skills.git
  ref: main
  subdir: djinn-marketplace
  tokenSecretFile: gitlab-from-the-lamp.env

serviceAccount:
  create: true
  annotations: {}
  name: ""
podAnnotations: {}
podSecurityContext: {}
securityContext: {}
config:
  data:
    timezone: Europe/Bucharest
    model:
      default: gpt-5.6-terra
      provider: litellm
      max_tokens: 8192
    delegation:
      provider: litellm
      model: deepseek-v4-flash
    providers:
      litellm:
        name: LiteLLM Gateway
        base_url: http://litellm.product.svc.cluster.local:4000/v1
        key_env: OPENAI_API_KEY
        transport: openai_chat
    cron:
      wrap_response: false
      mirror_delivery: true
    mcp_servers:
      # Single entry point: everything else (gitlab, jira/atlassian, slack,
      # grafana, github, sheets, k8s, alchemy/etherscan/thegraph, oracle)
      # comes from the toolhive vMCP aggregator, not from per-service
      # subprocesses configured here. TOOLHIVE_BEARER_TOKEN is a long-lived
      # Kubernetes ServiceAccount token (TokenRequest, minted once for the
      # hermes-client SA in the infra cluster's toolhive namespace - see
      # lamp-toolhive-vmcps values.yaml mcp-tools-hermes-oidc/mcp-tools-hermes)
      # rather than a human GitLab login, since hermes and toolhive run in
      # different physical clusters and can't share a live SA-token issuer.
      toolhive:
        # Reaches the infra cluster's vMCP over the shared tailnet: this
        # in-cluster name resolves to an ExternalName service (argo-apps
        # prod-0/platform/tailscale-services) that tailscale-operator proxies
        # to the mcp-tools-hermes.<tailnet> Tailscale LoadBalancer Service
        # (lamp-toolhive-vmcps hermesTailscaleExpose). Plain HTTP - Tailscale
        # Ingress (L7, HTTPS-only) always terminates TLS with a cert bound to
        # the full MagicDNS name and rejects any other SNI, which this local
        # DNS name can never match; the L3 Service passes traffic through as
        # plain TCP, already encrypted end-to-end by the tailnet's own
        # WireGuard transport, so no TLS layer is needed on top.
        url: "http://mcp-tools-hermes.tailscale-services.svc.cluster.local:4483/mcp"
        headers:
          Authorization: "Bearer ${env:TOOLHIVE_BEARER_TOKEN}"
    terminal:
      backend: "local"
      cwd: "."
      timeout: 180
      lifetime_seconds: 300
    browser:
      inactivity_timeout: 120
    compression:
      enabled: true
      threshold: 0.50
      target_ratio: 0.20
      protect_last_n: 20
      protect_first_n: 3
    memory:
      memory_enabled: true
      user_profile_enabled: true
      memory_char_limit: 2200
      user_char_limit: 1375
      nudge_interval: 10
      flush_min_turns: 6
    session_reset:
      mode: both
      idle_minutes: 1440
      at_hour: 4
    agent:
      max_turns: 60
      verbose: false
      reasoning_effort: "medium"
    skills:
      creation_nudge_interval: 15
    display:
      compact: false
      tool_progress: all
      skin: default
      platforms:
          telegram:
            tool_progress: off
    stt:
      enabled: true
      local:
        model: "base"

persistence:
  enabled: true
  storageClass: local-path
  subPath: hermes-state
  size: 20Gi
  accessMode: ReadWriteOnce
  annotations: {}
  selector: {}
service:
  enabled: false
  type: ClusterIP
  port: 9119
  targetPort: 9119
  portName: dashboard
  annotations: {}

resources:
  limits:
    cpu: 1000m
    memory: 2560Mi
  requests:
    memory: 1280Mi
    cpu: 200m

priorityClassName: hermes-critical

nodeSelector: {}
tolerations: []
affinity: {}

lifecycle:
  preStop:
    exec:
      command:
        - sh
        - -c
        - rm -f /opt/data/gateway.*.lock; sleep 10

livenessProbe:
  enabled: false
  tcpSocket:
    port: 9119
  initialDelaySeconds: 60
  periodSeconds: 60
  timeoutSeconds: 10
  failureThreshold: 3
readinessProbe:
  enabled: false
  tcpSocket:
    port: 9119
  initialDelaySeconds: 10
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 3
startupProbe:
  enabled: false
  tcpSocket:
    port: 9119
  initialDelaySeconds: 10
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 30

secrets:
  # OAuth bootstrap: entrypoint writes this JSON to /opt/data/auth.json on
  # first boot only ([ ! -f ... ] guard). After that, Hermes rotates the
  # refresh token in-place on the persistent volume, so this env var is
  # consumed exactly once.
  HERMES_AUTH_JSON_BOOTSTRAP:
    key: hermes
    property: auth_json
  OPENROUTER_API_KEY:
    key: hermes
    property: openrouter_api_key
  ANTHROPIC_API_KEY:
    key: hermes
    property: anthropic_api_key
  OPENAI_API_KEY:
    key: hermes
    property: litellm_master_key
  TELEGRAM_BOT_TOKEN:
    key: hermes
    property: telegram_bot_openclaw
  GITLAB_TOKEN:
    key: hermes
    property: gitlab_token
  SERPAPI_API_KEY:
    key: hermes
    property: serpapi_api_key
  TRAVELPAYOUTS_TOKEN:
    key: hermes
    property: travelpayouts_token
  # Long-lived Kubernetes bound ServiceAccount token for the toolhive vMCP
  # (see mcp_servers.toolhive below) - minted once via TokenRequest against
  # the infra cluster, not rotated by any in-cluster automation.
  TOOLHIVE_BEARER_TOKEN:
    key: hermes
    property: toolhive_bearer_token
  # defi plugin (djinn-home/skills marketplace) on-chain scripts read these
  # as plain process env vars - not MCP servers, so no secretFiles wrapper.
  ETHERSCAN_API_KEY:
    key: hermes
    property: etherscan_api_key
  ALCHEMY_API_KEY:
    key: hermes
    property: alchemy_api_key
  THEGRAPH_API_KEY:
    key: hermes
    property: thegraph_api_key
  ALCHEMY_RPC_ARB:
    key: hermes
    property: alchemy_rpc_arb
  ALCHEMY_RPC_BASE:
    key: hermes
    property: alchemy_rpc_base
  ALCHEMY_RPC_ETH:
    key: hermes
    property: alchemy_rpc_eth
  ALCHEMY_NFT_BASE:
    key: hermes
    property: alchemy_nft_base
  ALCHEMY_NFT_ETH:
    key: hermes
    property: alchemy_nft_eth
  DEFI_WALLET:
    key: hermes
    property: defi_wallet

secretFiles:
  google-sa.json:
    key: hermes
    property: google_sa_json
    mountPath: /etc/hermes/google-sa.json

  # OCI CLI access for all 3 accounts (infra vault owner + prod-0 + prod-1
  # clusters), same credentials/permissions as the human operator's - so
  # the agent can inspect/manage infra with `oci --profile <name> ...`.
  oci-config:
    key: hermes
    property: oci_config
    mountPath: /etc/hermes/.oci/config
  oci-key-lamp-infra.pem:
    key: hermes
    property: oci_key_lamp_infra
    mountPath: /etc/hermes/.oci/lamp-infra.pem
  oci-key-lamp-prod-0.pem:
    key: hermes
    property: oci_key_lamp_prod_0
    mountPath: /etc/hermes/.oci/lamp-prod-0.pem
  oci-key-lamp-prod-1.pem:
    key: hermes
    property: oci_key_lamp_prod_1
    mountPath: /etc/hermes/.oci/lamp-prod-1.pem

  # gitlab-from-the-lamp.env is not an MCP credential - the sync-skills init
  # container uses it as a git credential helper for the djinn-home/skills
  # marketplace clone (see skillsSync above).
  gitlab-from-the-lamp.env:
    key: hermes
    property: gitlab_from_the_lamp_env
    mountPath: /etc/hermes/creds/gitlab/from-the-lamp.env

extraEnv:
  TELEGRAM_ALLOWED_USERS: "306361331"
  GATEWAY_ALLOW_ALL_USERS: "false"
  TELEGRAM_HOME_CHANNEL: "306361331"
  TELEGRAM_HOME_CHANNEL_NAME: "DM"
  # lets `oci` (once installed) find the mounted config without --config-file
  OCI_CLI_CONFIG_FILE: /etc/hermes/.oci/config
  # defi plugin's DEFI_SA_KEY alias contract wants a file path, not raw JSON -
  # point it at the same Google SA already mounted for the sheets MCP server.
  DEFI_SA_KEY: /etc/hermes/google-sa.json

externalSecrets:
  kind: ClusterSecretStore
  name: oracle
  refreshInterval: 1h
  creationPolicy: Orphan
