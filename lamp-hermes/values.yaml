image:
  name: registry.gitlab.com/from-the-lamp/infra/docker-images/lamp-hermes
  tag: latest
  pullPolicy: Always
imagePullSecrets:
  - name: hermes-image-pull
imagePullSecret:
  secretName: hermes-image-pull
  registry: registry.gitlab.com/from-the-lamp
  username: token
  remoteKey: gitlab-token
nameOverride: ""
fullnameOverride: ""

replicaCount: 1
args:
  - gateway
  - run

hermes:
  home: /opt/data
  uid: 10000
  gid: 10000

seedDotenv:
  enabled: true

# Syncs the djinn-home/skills marketplace (full copy of xdatagroup/claude-marketplace,
# rebranded xdatagroup -> djinn) onto the persistent skills/ dir on every pod start.
# Hermes discovers skills via a recursive SKILL.md scan (rglob), so the marketplace's
# nested plugins/<plugin>/skills/<skill>/SKILL.md layout works as-is - no flattening
# needed. Re-uses the gitlab-from-the-lamp secretFile token, already mounted for the
# gitlab-from-the-lamp MCP server, instead of a separate Vault property.
skillsSync:
  enabled: true
  repo: https://gitlab.com/djinn-home/skills.git
  ref: main
  subdir: djinn-marketplace
  tokenSecretFile: gitlab-from-the-lamp.env

serviceAccount:
  create: true
  annotations: {}
  name: ""
podAnnotations: {}
podSecurityContext: {}
securityContext: {}
config:
  data:
    timezone: Europe/Bucharest
    model:
      default: gpt-5.6-terra
      provider: litellm
      max_tokens: 8192
    delegation:
      provider: litellm
      model: deepseek-v4-flash
    providers:
      litellm:
        name: LiteLLM Gateway
        base_url: http://litellm.product.svc.cluster.local:4000/v1
        key_env: OPENAI_API_KEY
        transport: openai_chat
    cron:
      wrap_response: false
      mirror_delivery: true
    mcp_servers:
      google-sheets:
        command: mcp-google-sheets
        env:
          SERVICE_ACCOUNT_PATH: /etc/hermes/google-sa.json
      atlassian-cas:
        command: bash
        args:
          - "-c"
          - "set -a && export READ_ONLY_MODE=\"${READ_ONLY_MODE:-true}\" && . /etc/hermes/creds/atlassian/cas.env && exec mcp-atlassian"
      atlassian-xdata:
        command: bash
        args:
          - "-c"
          - "set -a && export READ_ONLY_MODE=\"${READ_ONLY_MODE:-true}\" && . /etc/hermes/creds/atlassian/xdata.env && exec mcp-atlassian"
      gitlab-cas-dev:
        command: bash
        args:
          - "-c"
          - "set -a && export GITLAB_READ_ONLY_MODE=\"${GITLAB_READ_ONLY_MODE:-true}\" && . /etc/hermes/creds/gitlab/cas-dev.env && exec mcp-gitlab"
      gitlab-cas-gitops:
        command: bash
        args:
          - "-c"
          - "set -a && export GITLAB_READ_ONLY_MODE=\"${GITLAB_READ_ONLY_MODE:-true}\" && . /etc/hermes/creds/gitlab/cas-gitops.env && exec mcp-gitlab"
      gitlab-from-the-lamp:
        command: bash
        args:
          - "-c"
          - "set -a && export GITLAB_READ_ONLY_MODE=\"${GITLAB_READ_ONLY_MODE:-true}\" && . /etc/hermes/creds/gitlab/from-the-lamp.env && exec mcp-gitlab"
      github-xdata:
        command: bash
        args:
          - "-c"
          - "set -a && . /etc/hermes/creds/github/xdata.env && export GITHUB_PERSONAL_ACCESS_TOKEN=\"${GITHUB_PERSONAL_ACCESS_TOKEN:-$GH_TOKEN}\" && export GITHUB_TOOLSETS=\"${GITHUB_TOOLSETS:-all}\" && export GITHUB_READ_ONLY=\"${GITHUB_READ_ONLY:-1}\" && exec github-mcp-server stdio"
      grafana-cas-dev:
        command: bash
        args:
          - "-c"
          - "set -a && export GRAFANA_DISABLE_WRITE=\"${GRAFANA_DISABLE_WRITE:-true}\" && . /etc/hermes/creds/grafana/cas-dev.env && exec mcp-grafana -t stdio -tls-skip-verify"
      grafana-cas-gke-infra:
        command: bash
        args:
          - "-c"
          - "set -a && export GRAFANA_DISABLE_WRITE=\"${GRAFANA_DISABLE_WRITE:-true}\" && . /etc/hermes/creds/grafana/cas-gke-infra.env && exec mcp-grafana -t stdio -tls-skip-verify"
      grafana-cas-sg:
        command: bash
        args:
          - "-c"
          - "set -a && export GRAFANA_DISABLE_WRITE=\"${GRAFANA_DISABLE_WRITE:-true}\" && . /etc/hermes/creds/grafana/cas-sg.env && exec mcp-grafana -t stdio -tls-skip-verify"
      grafana-xdata-common:
        command: bash
        args:
          - "-c"
          - "set -a && export GRAFANA_DISABLE_WRITE=\"${GRAFANA_DISABLE_WRITE:-true}\" && . /etc/hermes/creds/grafana/xdata-common.env && exec mcp-grafana -t stdio -tls-skip-verify"
      grafana-xdata-complycontrol:
        command: bash
        args:
          - "-c"
          - "set -a && export GRAFANA_DISABLE_WRITE=\"${GRAFANA_DISABLE_WRITE:-true}\" && . /etc/hermes/creds/grafana/xdata-complycontrol.env && exec mcp-grafana -t stdio -tls-skip-verify"
      slack-cas:
        command: bash
        args:
          - "-c"
          - "set -a && export SLACK_MCP_USERS_CACHE=\"${SLACK_MCP_USERS_CACHE:-/opt/data/slack-cas-users.json}\" SLACK_MCP_CHANNELS_CACHE=\"${SLACK_MCP_CHANNELS_CACHE:-/opt/data/slack-cas-channels.json}\" && . /etc/hermes/creds/slack/cas.env && exec slack-mcp-server --transport stdio"
      slack-xdata:
        command: bash
        args:
          - "-c"
          - "set -a && export SLACK_MCP_USERS_CACHE=\"${SLACK_MCP_USERS_CACHE:-/opt/data/slack-xdata-users.json}\" SLACK_MCP_CHANNELS_CACHE=\"${SLACK_MCP_CHANNELS_CACHE:-/opt/data/slack-xdata-channels.json}\" && . /etc/hermes/creds/slack/xdata.env && exec slack-mcp-server --transport stdio"
      # ai-agent-viewer-xdata SA: viewer on GCP resources + K8s viewer RBAC on
      # common-dev/common-infra. Static service-account auth, mirrors the same
      # wrapper cbox's mcp-config generator uses, instead of an interactive
      # human gcloud session.
      gcloud:
        command: bash
        args:
          - "-c"
          - "export GOOGLE_APPLICATION_CREDENTIALS=/etc/hermes/gcp/ai-agent-viewer-xdata.json && gcloud auth activate-service-account --key-file=\"$GOOGLE_APPLICATION_CREDENTIALS\" --quiet >/dev/null 2>&1; exec gcloud-mcp"
      # Static kubeconfigs (secretFiles below) with public GKE control-plane
      # endpoints - exec.env already pins GOOGLE_APPLICATION_CREDENTIALS to
      # the mounted SA key, so this is self-contained regardless of this
      # subprocess's own env. No live `gcloud get-credentials` at pod start.
      kubernetes:
        command: bash
        args:
          - "-c"
          - "export KUBECONFIG=/etc/hermes/kube/common-dev.yaml:/etc/hermes/kube/common-infra.yaml && exec kubernetes-mcp-server --read-only --list-output table"
    terminal:
      backend: "local"
      cwd: "."
      timeout: 180
      lifetime_seconds: 300
    browser:
      inactivity_timeout: 120
    compression:
      enabled: true
      threshold: 0.50
      target_ratio: 0.20
      protect_last_n: 20
      protect_first_n: 3
    memory:
      memory_enabled: true
      user_profile_enabled: true
      memory_char_limit: 2200
      user_char_limit: 1375
      nudge_interval: 10
      flush_min_turns: 6
    session_reset:
      mode: both
      idle_minutes: 1440
      at_hour: 4
    agent:
      max_turns: 60
      verbose: false
      reasoning_effort: "medium"
    skills:
      creation_nudge_interval: 15
    display:
      compact: false
      tool_progress: all
      skin: default
      platforms:
          telegram:
            tool_progress: off
    stt:
      enabled: true
      local:
        model: "base"

persistence:
  enabled: true
  storageClass: local-path
  subPath: hermes-state
  size: 20Gi
  accessMode: ReadWriteOnce
  annotations: {}
  selector: {}
service:
  enabled: false
  type: ClusterIP
  port: 9119
  targetPort: 9119
  portName: dashboard
  annotations: {}

resources:
  limits: {}
  requests:
    memory: 10Mi
    cpu: 10m

nodeSelector: {}
tolerations: []
affinity: {}

lifecycle:
  preStop:
    exec:
      command:
        - sh
        - -c
        - rm -f /opt/data/gateway.*.lock; sleep 10

livenessProbe:
  enabled: false
  tcpSocket:
    port: 9119
  initialDelaySeconds: 60
  periodSeconds: 60
  timeoutSeconds: 10
  failureThreshold: 3
readinessProbe:
  enabled: false
  tcpSocket:
    port: 9119
  initialDelaySeconds: 10
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 3
startupProbe:
  enabled: false
  tcpSocket:
    port: 9119
  initialDelaySeconds: 10
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 30

secrets:
  # OAuth bootstrap: entrypoint writes this JSON to /opt/data/auth.json on
  # first boot only ([ ! -f ... ] guard). After that, Hermes rotates the
  # refresh token in-place on the persistent volume, so this env var is
  # consumed exactly once.
  HERMES_AUTH_JSON_BOOTSTRAP:
    key: hermes
    property: auth_json
  OPENROUTER_API_KEY:
    key: hermes
    property: openrouter_api_key
  ANTHROPIC_API_KEY:
    key: hermes
    property: anthropic_api_key
  OPENAI_API_KEY:
    key: hermes
    property: litellm_master_key
  TELEGRAM_BOT_TOKEN:
    key: hermes
    property: telegram_bot_openclaw
  GITLAB_TOKEN:
    key: hermes
    property: gitlab_token
  SERPAPI_API_KEY:
    key: hermes
    property: serpapi_api_key
  TRAVELPAYOUTS_TOKEN:
    key: hermes
    property: travelpayouts_token
  # defi plugin (djinn-home/skills marketplace) on-chain scripts read these
  # as plain process env vars - not MCP servers, so no secretFiles wrapper.
  ETHERSCAN_API_KEY:
    key: hermes
    property: etherscan_api_key
  ALCHEMY_API_KEY:
    key: hermes
    property: alchemy_api_key
  THEGRAPH_API_KEY:
    key: hermes
    property: thegraph_api_key
  ALCHEMY_RPC_ARB:
    key: hermes
    property: alchemy_rpc_arb
  ALCHEMY_RPC_BASE:
    key: hermes
    property: alchemy_rpc_base
  ALCHEMY_RPC_ETH:
    key: hermes
    property: alchemy_rpc_eth
  ALCHEMY_NFT_BASE:
    key: hermes
    property: alchemy_nft_base
  ALCHEMY_NFT_ETH:
    key: hermes
    property: alchemy_nft_eth
  DEFI_WALLET:
    key: hermes
    property: defi_wallet

secretFiles:
  google-sa.json:
    key: hermes
    property: google_sa_json
    mountPath: /etc/hermes/google-sa.json

  # OCI CLI access for all 3 accounts (infra vault owner + prod-0 + prod-1
  # clusters), same credentials/permissions as the human operator's - so
  # the agent can inspect/manage infra with `oci --profile <name> ...`.
  oci-config:
    key: hermes
    property: oci_config
    mountPath: /etc/hermes/.oci/config
  oci-key-lamp-infra.pem:
    key: hermes
    property: oci_key_lamp_infra
    mountPath: /etc/hermes/.oci/lamp-infra.pem
  oci-key-lamp-prod-0.pem:
    key: hermes
    property: oci_key_lamp_prod_0
    mountPath: /etc/hermes/.oci/lamp-prod-0.pem
  oci-key-lamp-prod-1.pem:
    key: hermes
    property: oci_key_lamp_prod_1
    mountPath: /etc/hermes/.oci/lamp-prod-1.pem

  # Multi-instance MCP creds (Jira, GitLab, GitHub, Grafana, Slack) - each
  # server's mcp_servers entry above sources its own file directly rather
  # than relying on inherited process env, matching cbox's wrapper pattern.
  atlassian-cas.env:
    key: hermes
    property: atlassian_cas_env
    mountPath: /etc/hermes/creds/atlassian/cas.env
  atlassian-xdata.env:
    key: hermes
    property: atlassian_xdata_env
    mountPath: /etc/hermes/creds/atlassian/xdata.env
  gitlab-cas-dev.env:
    key: hermes
    property: gitlab_cas_dev_env
    mountPath: /etc/hermes/creds/gitlab/cas-dev.env
  gitlab-cas-gitops.env:
    key: hermes
    property: gitlab_cas_gitops_env
    mountPath: /etc/hermes/creds/gitlab/cas-gitops.env
  gitlab-from-the-lamp.env:
    key: hermes
    property: gitlab_from_the_lamp_env
    mountPath: /etc/hermes/creds/gitlab/from-the-lamp.env
  github-xdata.env:
    key: hermes
    property: github_xdata_env
    mountPath: /etc/hermes/creds/github/xdata.env
  grafana-cas-dev.env:
    key: hermes
    property: grafana_cas_dev_env
    mountPath: /etc/hermes/creds/grafana/cas-dev.env
  grafana-cas-gke-infra.env:
    key: hermes
    property: grafana_cas_gke_infra_env
    mountPath: /etc/hermes/creds/grafana/cas-gke-infra.env
  grafana-cas-sg.env:
    key: hermes
    property: grafana_cas_sg_env
    mountPath: /etc/hermes/creds/grafana/cas-sg.env
  grafana-xdata-common.env:
    key: hermes
    property: grafana_xdata_common_env
    mountPath: /etc/hermes/creds/grafana/xdata-common.env
  grafana-xdata-complycontrol.env:
    key: hermes
    property: grafana_xdata_complycontrol_env
    mountPath: /etc/hermes/creds/grafana/xdata-complycontrol.env
  slack-cas.env:
    key: hermes
    property: slack_cas_env
    mountPath: /etc/hermes/creds/slack/cas.env
  slack-xdata.env:
    key: hermes
    property: slack_xdata_env
    mountPath: /etc/hermes/creds/slack/xdata.env

  # Separate Vault secret: the "hermes" secret is already near OCI Vault's
  # 25600-char content ceiling, and this key is unrelated to the rest anyway
  # (same pattern as litellm-image-pull staying its own entry in lamp-litellm).
  ai-agent-viewer-xdata.json:
    key: hermes-gcp
    property: gcp_viewer_xdata_json
    mountPath: /etc/hermes/gcp/ai-agent-viewer-xdata.json

  # Static kubeconfigs, public GKE control-plane endpoints. exec.env already
  # pins GOOGLE_APPLICATION_CREDENTIALS at the mounted SA key above.
  kube-common-dev.yaml:
    key: hermes-gcp
    property: kube_common_dev_yaml
    mountPath: /etc/hermes/kube/common-dev.yaml
  kube-common-infra.yaml:
    key: hermes-gcp
    property: kube_common_infra_yaml
    mountPath: /etc/hermes/kube/common-infra.yaml

extraEnv:
  TELEGRAM_ALLOWED_USERS: "306361331"
  GATEWAY_ALLOW_ALL_USERS: "false"
  TELEGRAM_HOME_CHANNEL: "306361331"
  TELEGRAM_HOME_CHANNEL_NAME: "DM"
  # lets `oci` (once installed) find the mounted config without --config-file
  OCI_CLI_CONFIG_FILE: /etc/hermes/.oci/config
  # defi plugin's DEFI_SA_KEY alias contract wants a file path, not raw JSON -
  # point it at the same Google SA already mounted for the sheets MCP server.
  DEFI_SA_KEY: /etc/hermes/google-sa.json

externalSecrets:
  kind: ClusterSecretStore
  name: oracle
  refreshInterval: 1h
  creationPolicy: Orphan
