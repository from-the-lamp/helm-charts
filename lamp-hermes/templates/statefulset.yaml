apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "hermes.fullname" . }}
  labels:
    {{- include "hermes.labels" . | nindent 4 }}
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  serviceName: {{ include "hermes.fullname" . }}
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "hermes.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "hermes.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "hermes.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- if or .Values.seedDotenv.enabled .Values.skillsSync.enabled }}
      initContainers:
        {{- if .Values.skillsSync.enabled }}
        - name: sync-skills
          image: "{{ .Values.image.name }}{{ if hasPrefix "sha256:" .Values.image.tag }}@{{ else }}:{{ end }}{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - sh
            - -c
            - |
              set -eu
              dest="{{ .Values.hermes.home }}/skills/{{ .Values.skillsSync.subdir }}"
              token_file="/etc/hermes/creds/gitlab/from-the-lamp.env"
              repo_url="{{ .Values.skillsSync.repo }}"
              # Credential helper reads GITLAB_TOKEN from the mounted secret at
              # git-invocation time instead of embedding it in the remote URL, so
              # the token never sits in .git/config in plaintext (that leaked once
              # already via an incautious `git remote -v`) - and .git now survives
              # (see below) so Hermes itself can pull/commit/push skill edits.
              cred_helper='!f() { echo username=oauth2; set -a; . "'"$token_file"'" 2>/dev/null; set +a; echo password="$GITLAB_TOKEN"; }; f'
              mkdir -p "$(dirname "$dest")"
              if [ -d "$dest/.git" ]; then
                git -C "$dest" config credential.helper "$cred_helper"
                git -C "$dest" config user.name "Hermes"
                git -C "$dest" config user.email "hermes@djinn-home"
                # Only fast-forward: never clobber commits Hermes made itself but
                # hasn't pushed yet, or edits it's mid-way through.
                if git -C "$dest" diff --quiet && git -C "$dest" diff --cached --quiet; then
                  git -c credential.helper="$cred_helper" -C "$dest" fetch origin "{{ .Values.skillsSync.ref }}"
                  git -C "$dest" merge --ff-only "origin/{{ .Values.skillsSync.ref }}" || true
                fi
              else
                rm -rf "$dest"
                git -c credential.helper="$cred_helper" clone --branch "{{ .Values.skillsSync.ref }}" "$repo_url" "$dest"
                git -C "$dest" config credential.helper "$cred_helper"
                git -C "$dest" config user.name "Hermes"
                git -C "$dest" config user.email "hermes@djinn-home"
              fi
              chown -R {{ .Values.hermes.uid }}:{{ .Values.hermes.gid }} "$dest"
          volumeMounts:
            - name: data
              mountPath: {{ .Values.hermes.home }}
              subPath: {{ .Values.persistence.subPath }}
            - name: secret-files
              mountPath: /etc/hermes/creds/gitlab/from-the-lamp.env
              subPath: gitlab-from-the-lamp.env
              readOnly: true
        {{- end }}
        {{- if .Values.seedDotenv.enabled }}
        - name: seed-dotenv
          image: "{{ .Values.image.name }}{{ if hasPrefix "sha256:" .Values.image.tag }}@{{ else }}:{{ end }}{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - sh
            - -c
            - |
              set -eu
              env_file={{ .Values.hermes.home }}/.env
              tmp="$env_file.seed.tmp"
              touch "$env_file"
              for f in /run/hermes-env/*; do
                [ -f "$f" ] || continue
                key=$(basename "$f")
                case "$key" in
                  *_KEY|*_TOKEN) : ;;
                  *) continue ;;
                esac
                val=$(cat "$f")
                [ -n "$val" ] || continue
                grep -v "^$key=" "$env_file" > "$tmp" 2>/dev/null || true
                printf '%s=%s\n' "$key" "$val" >> "$tmp"
                mv "$tmp" "$env_file"
              done
              chown {{ .Values.hermes.uid }}:{{ .Values.hermes.gid }} "$env_file" || true
              chmod 600 "$env_file"
          volumeMounts:
            - name: data
              mountPath: {{ .Values.hermes.home }}
              subPath: {{ .Values.persistence.subPath }}
            - name: env-secret
              mountPath: /run/hermes-env
              readOnly: true
        {{- end }}
      {{- end }}
      containers:
        - name: hermes
          image: "{{ .Values.image.name }}{{ if hasPrefix "sha256:" .Values.image.tag }}@{{ else }}:{{ end }}{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            {{- toYaml .Values.args | nindent 12 }}
          envFrom:
            - secretRef:
                name: {{ .Release.Name }}-env
          volumeMounts:
            - name: config
              subPath: config.yaml
              mountPath: {{ .Values.hermes.home }}/config.yaml
            - name: data
              mountPath: {{ .Values.hermes.home }}
              subPath: {{ .Values.persistence.subPath }}
            {{- range $file, $ref := .Values.secretFiles }}
            {{- if not $ref.mountPath }}{{ fail (printf "lamp-hermes: secretFiles.%s needs .mountPath" $file) }}{{ end }}
            - name: secret-files
              mountPath: {{ $ref.mountPath }}
              subPath: {{ $file }}
              readOnly: true
            {{- end }}
          {{- if .Values.livenessProbe.enabled }}
          livenessProbe:
            {{- omit .Values.livenessProbe "enabled" | toYaml | nindent 12 }}
          {{- end }}
          {{- if .Values.readinessProbe.enabled }}
          readinessProbe:
            {{- omit .Values.readinessProbe "enabled" | toYaml | nindent 12 }}
          {{- end }}
          {{- if .Values.startupProbe.enabled }}
          startupProbe:
            {{- omit .Values.startupProbe "enabled" | toYaml | nindent 12 }}
          {{- end }}
          {{- with .Values.lifecycle }}
          lifecycle:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
      volumes:
        - name: config
          configMap:
            name: {{ .Release.Name }}-config
        {{- if .Values.seedDotenv.enabled }}
        - name: env-secret
          secret:
            secretName: {{ .Release.Name }}-env
        {{- end }}
        {{- if .Values.secretFiles }}
        - name: secret-files
          secret:
            secretName: {{ .Release.Name }}-files
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  {{- if .Values.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: data
        {{- with .Values.persistence.annotations }}
        annotations:
          {{- toYaml . | nindent 10 }}
        {{- end }}
      spec:
        accessModes:
          - {{ .Values.persistence.accessMode }}
        {{- if .Values.persistence.storageClass }}
        storageClassName: {{ .Values.persistence.storageClass }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.persistence.size }}
        {{- with .Values.persistence.selector }}
        selector:
          {{- toYaml . | nindent 10 }}
        {{- end }}
  {{- end }}
