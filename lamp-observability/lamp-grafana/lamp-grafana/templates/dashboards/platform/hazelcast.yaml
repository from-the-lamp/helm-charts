{{- if .Values.dashboards.hazelcast.enabled }}
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaFolder
metadata:
  name: hazelcast
spec:
  instanceSelector:
    matchLabels:
      dashboards: "grafana"
  parentFolderRef: platform
  title: Hazelcast
---
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: hazelcast-map-overview
spec:
  folderRef: hazelcast
  instanceSelector:
    matchLabels:
      dashboards: "grafana"
  datasources:
    - inputName: DS_PROMETHEUS
      datasourceName: VictoriaMetrics
  grafanaCom:
    id: 20647
    revision: 1
{{- end }}
