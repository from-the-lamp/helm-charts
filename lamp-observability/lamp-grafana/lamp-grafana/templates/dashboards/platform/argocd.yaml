{{- if .Values.dashboards.argocd.enabled }}
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaFolder
metadata:
  name: argocd
spec:
  instanceSelector:
    matchLabels:
      dashboards: "grafana"
  parentFolderRef: platform
  title: ArgoCD
---
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: argocd
spec:
  folderRef: argocd
  instanceSelector:
    matchLabels:
      dashboards: "grafana"
  grafanaCom:
    id: 14584
    revision: 1
{{- end }}
