{{- if .Values.dashboards.smartctl_exporter.enabled }}
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaFolder
metadata:
  name: smartctl-exporter
spec:
  instanceSelector:
    matchLabels:
      dashboards: "grafana"
  parentFolderRef: platform
  title: SMART (smartctl_exporter)
---
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: smartctl-exporter
spec:
  folderRef: smartctl-exporter
  instanceSelector:
    matchLabels:
      dashboards: "grafana"
  grafanaCom:
    id: 22604
    revision: 4
{{- end }}
