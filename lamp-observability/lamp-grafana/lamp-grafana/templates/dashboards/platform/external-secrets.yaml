{{- if .Values.dashboards.external_secrets.enabled }}
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaFolder
metadata:
  name: external-secrets
spec:
  instanceSelector:
    matchLabels:
      dashboards: "grafana"
  parentFolderRef: platform
  title: External Secrets
---
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: external-secrets
spec:
  folderRef: external-secrets
  instanceSelector:
    matchLabels:
      dashboards: "grafana"
  configMapRef:
    name: dashboard-external-secrets
    key: json
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: dashboard-external-secrets
  annotations:
    argocd.argoproj.io/sync-options: ServerSideApply=true
data:
  json: >
    {{- .Files.Get "files/external-secrets/external-secrets.json" | nindent 4 }}
{{- end }}
