{{- if .Values.dashboards.cilium.enabled }}
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaFolder
metadata:
  name: cilium
spec:
  instanceSelector:
    matchLabels:
      dashboards: "grafana"
  parentFolderRef: platform
  title: Cilium
---
{{- if .Values.dashboards.cilium.agent }}
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: cilium-agent
spec:
  folderRef: cilium
  instanceSelector:
    matchLabels:
      dashboards: "grafana"
  configMapRef:
    name: dashboard-cilium-agent
    key: json
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: dashboard-cilium-agent
  annotations:
    argocd.argoproj.io/sync-options: ServerSideApply=true
data:
  json: >
    {{- .Files.Get "files/cilium/cilium-agent.json" | nindent 4 }}
{{- end }}
---
{{- if .Values.dashboards.cilium.operator }}
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: cilium-operator
spec:
  folderRef: cilium
  instanceSelector:
    matchLabels:
      dashboards: "grafana"
  configMapRef:
    name: dashboard-cilium-operator
    key: json
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: dashboard-cilium-operator
  annotations:
    argocd.argoproj.io/sync-options: ServerSideApply=true
data:
  json: >
    {{- .Files.Get "files/cilium/cilium-operator.json" | nindent 4 }}
{{- end }}
{{- end }}
