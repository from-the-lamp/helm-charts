{{- if .Values.dashboards.etcd.enabled }}
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaFolder
metadata:
  name: etcd
spec:
  instanceSelector:
    matchLabels:
      dashboards: "grafana"
  parentFolderRef: platform
  title: etcd
---
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: etcd
spec:
  folderRef: etcd
  instanceSelector:
    matchLabels:
      dashboards: "grafana"
  grafanaCom:
    id: 3070
    revision: 3
{{- end }}
