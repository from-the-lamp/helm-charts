apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: talos-backup-s3-creds
spec:
  refreshInterval: "{{ .Values.externalSecrets.refreshInterval }}"
  secretStoreRef:
    kind: "{{ .Values.externalSecrets.kind }}"
    name: "{{ .Values.externalSecrets.name }}"
  target:
    name: talos-backup-s3-creds
    creationPolicy: "{{ .Values.externalSecrets.creationPolicy }}"
  data:
    - secretKey: access_key_id
      remoteRef:
        key: {{ .Values.remoteSecretKeys.accessKeyId.key }}
        property: {{ .Values.remoteSecretKeys.accessKeyId.property }}
    - secretKey: secret_access_key
      remoteRef:
        key: {{ .Values.remoteSecretKeys.secretAccessKey.key }}
        property: {{ .Values.remoteSecretKeys.secretAccessKey.property }}
