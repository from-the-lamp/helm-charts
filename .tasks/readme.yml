version: '3'

silent: true
tasks:
  .readme:
    internal: true
    dir: '{{.DIR}}'
    cmds:
      - mkdir -p .output
      # Helm-docs
      - helm-docs --skip-version-footer -o .output/helm.md
      # Trivy - rendered from JSON via trivy-report.jq instead of --format
      # table: table's own renderer has no stable tie-break when two findings
      # share the same rule ID *and* message (e.g. a generic rule firing on
      # two containers of the same pod) - order then depends on internal map
      # iteration and flips between runs, which broke this hook's idempotency
      # (chart-readme kept reporting "files were modified" forever). The jq
      # filter sorts everything explicitly, so the same scan always renders
      # byte-identical markdown.
      - trivy config . --format json 2>/dev/null | jq -r -f '{{.TASKFILE_DIR}}/trivy-report.jq' > .output/trivy.md
      # README.md
      - cat .output/helm.md > README.md
      - cat .output/trivy.md >> README.md

  readme:all:
    desc: Generate README.md for all Charts
    deps:
      - for: { var: CHART_DIRS }
        task: .readme
        vars:
          DIR: '{{.ITEM}}'

  readme:changed:
    desc: Generate README.md for changed Charts
    deps:
      - for: { var: CHANGED_CHART_DIRS }
        task: .readme
        vars:
          DIR: '{{.ITEM}}'
    preconditions:
      - sh: '[ -n "{{.CHANGED_CHART_DIRS}}" ]'
        msg: "No changed chart directories found."

  readme:matrix:
    desc: Generate compatibility matrix using gomplate
    cmds:
      - mkdir -p .output
      - |
        find . -name Chart.yaml -not -path './.git/*' | while read f; do
          yq -o=json . "$f" | jq --arg p "$f" '. + {path: $p}'
        done | jq -s '.' > .output/charts.json
      - gomplate -d charts=.output/charts.json -f .tasks/README.md.gotmpl -o README.md
    sources:
      - charts/lamp-*/**/Chart.yaml
      - charts/lamp-*/**/NOTES.txt
      - charts/lamp-*/**/NOTES.md
      - README.md.gotmpl
    generates:
      - README.md
    status:
      - "false"
