version: '3'

silent: true
tasks:
  .build:
    internal: true
    dir: '{{.DIR}}'
    cmds:
      - echo -e "\033[36m==>\033[0m {{.DIR}} - removing .output so the push stage only sees this build's package"
      - rm -rf .output
      - echo -e "\033[36m==>\033[0m {{.DIR}} - resolving chart dependencies"
      - helm dependency update
      - echo -e "\033[36m==>\033[0m {{.DIR}} - linting with dependencies in place"
      - helm lint .
      - echo -e "\033[36m==>\033[0m {{.DIR}} - packaging into {{.DIR}}/.output"
      - helm package . -d .output

  build:push:*:
    desc: Build and Push specific Chart
    cmds:
      - echo "Cleanup..."
      - task: cleanup
      - echo "Building..."
      - task: .build 
        vars: { DIR: "{{index .MATCH 0}}" }
      - echo "Pushing..."
      - task: .push 
        vars: { DIR: "{{index .MATCH 0}}" }

  build:push:all:
    desc: Build and Push all Charts
    cmds:
      - echo "Building..."
      - task: build:all
      - echo "Pushing..."
      - task: push:all

  build:push:changed:
    desc: Build and Push changed Charts
    cmds:
      - echo "Building..."
      - task: build:changed
      - echo "Pushing..."
      - task: push:changed
      
  build:*:
    desc: Build specific Chart (ex. task build:dirname)
    cmds:
      - task: .build 
        vars: { DIR: "{{index .MATCH 0}}" }

  build:all:
    desc: Build all Charts
    deps:
      - for: { var: CHART_DIRS }
        task: .build
        vars:
          DIR: '{{.ITEM}}'

  build:changed:
    desc: Build changed Charts (dependency update, lint, package) - Chart.yaml changed since DIFF_BASE, or the dirs in TARGETS
    cmds:
      - echo -e "\033[36m==>\033[0m diff base {{.DIFF_BASE}} - charts to build -> {{if .CHANGED_CHART_DIRS}}{{.CHANGED_CHART_DIRS}}{{else}}none{{end}}"
      - for: { var: CHANGED_CHART_DIRS }
        task: .build
        vars:
          DIR: '{{.ITEM}}'

  .push:
    internal: true
    dir: '{{.DIR}}'
    cmds:
      - echo -e "\033[36m==>\033[0m {{.DIR}} - pushing the package from .output to oci://{{.OCI_REPO}}"
      - helm push $(find .output -type f -name "*.tgz") oci://{{.OCI_REPO}}

  push:*:
    desc: Push specific Chart (ex. task push:dirname)
    cmds:
      - task: .push 
        vars: { DIR: "{{index .MATCH 0}}" }

  push:all:
    desc: Push all Charts
    deps:
      - for: { var: CHART_DIRS }
        task: .push
        vars:
          DIR: '{{.ITEM}}'

  push:changed:
    desc: Push changed Charts - the packages build:changed left in each chart's .output
    cmds:
      - echo -e "\033[36m==>\033[0m diff base {{.DIFF_BASE}} - charts to push -> {{if .CHANGED_CHART_DIRS}}{{.CHANGED_CHART_DIRS}}{{else}}none{{end}}"
      - for: { var: CHANGED_CHART_DIRS }
        task: .push
        vars:
          DIR: '{{.ITEM}}'
