cilium:
  cni:
    exclusive: false
  ipam:
    mode: kubernetes
  # Phase 3 of the kube-proxy-replacement migration: gives Cilium a path to
  # the API server that doesn't depend on kube-proxy, via Talos's KubePrism
  # (listens on every node's own loopback at :7445, default-on since Talos
  # 1.6 - verified reachable on all 3 nodes before this change). Prep only -
  # kubeProxyReplacement is still false everywhere at this point, so this
  # doesn't change current behavior, only adds an additional API path the
  # agent can use once kube-proxy-replacement is flipped per-node.
  k8sServiceHost: "127.0.0.1"
  k8sServicePort: 7445
  # Default maxUnavailable (2) would restart 2 of this cluster's 3
  # (all-control-plane, no spare worker) nodes' agents at once on every
  # Helm upgrade - lowered so each change only ever touches one node's
  # dataplane at a time during the kube-proxy-replacement migration (see
  # ADR/plan in that session).
  updateStrategy:
    rollingUpdate:
      maxUnavailable: 1
  envoy:
    updateStrategy:
      rollingUpdate:
        maxUnavailable: 1
  cgroup:
    autoMount:
      enabled: false
    hostRoot: /sys/fs/cgroup
  securityContext:
    capabilities:
      ciliumAgent:
        - CHOWN
        - KILL
        - NET_ADMIN
        - NET_RAW
        - IPC_LOCK
        - SYS_ADMIN
        - SYS_RESOURCE
        - DAC_OVERRIDE
        - FOWNER
        - SETGID
        - SETUID
      cleanCiliumState:
        - NET_ADMIN
        - SYS_ADMIN
        - SYS_RESOURCE
