{{- if .Values.sourcePVC }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "lamp-volsync-backup.secretName" . }}
spec:
  refreshInterval: "{{ .Values.externalSecrets.refreshInterval }}"
  secretStoreRef:
    kind: "{{ .Values.externalSecrets.kind }}"
    name: "{{ .Values.externalSecrets.name }}"
  target:
    name: {{ include "lamp-volsync-backup.secretName" . }}
    creationPolicy: "{{ .Values.externalSecrets.creationPolicy }}"
    template:
      data:
        RESTIC_REPOSITORY: {{ include "lamp-volsync-backup.repository" . | quote }}
        RESTIC_PASSWORD: "{{`{{ .password }}`}}"
        AWS_ACCESS_KEY_ID: "{{`{{ .access_key }}`}}"
        AWS_SECRET_ACCESS_KEY: "{{`{{ .secret_key }}`}}"
  data:
    - secretKey: password
      remoteRef:
        key: {{ .Values.vault.restic.remoteSecretKey | quote }}
        property: {{ .Values.vault.restic.passwordProperty | quote }}
    - secretKey: access_key
      remoteRef:
        key: {{ .Values.vault.s3.remoteSecretKey | quote }}
        property: {{ .Values.vault.s3.accessKeyProperty | quote }}
    - secretKey: secret_key
      remoteRef:
        key: {{ .Values.vault.s3.remoteSecretKey | quote }}
        property: {{ .Values.vault.s3.secretKeyProperty | quote }}
{{- end }}
