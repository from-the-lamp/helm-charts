{{- if .Values.monitoring.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: {{ .Values.name }}
spec:
  selector:
    matchLabels:
      gateway.networking.k8s.io/gateway-name: {{ .Values.name }}
  podMetricsEndpoints:
    - port: http-envoy-prom
      path: /stats/prometheus
{{- end }}
