nameOverride: ""
fullnameOverride: ""

# app.kubernetes.io/component and /part-of - optional, every consumer should
# set at least `component` (e.g. "adapter", "api", "worker").
labels:
  component: ""
  partOf: ""

# Rollout (default, matches every other app on this platform - Argo
# Rollouts is already the cluster-wide controller) or plain Deployment for
# the rare case something doesn't want canary/analysis machinery at all.
# Same Pod template either way; only kind/apiVersion (and strategy, since
# Deployment's RollingUpdate shape differs from Rollout's canary/blueGreen)
# change.
controller:
  type: Rollout # Rollout | Deployment

image:
  name: # from kargo
  tag: # from kargo - either a semver tag ("0.1.0") or a digest ("sha256:...");
       # the chart picks `name:tag` vs `name@digest` automatically.
  pullPolicy: Always
  pullSecrets:
    - name: gitlab
      url: registry.gitlab.com/from-the-lamp
      username: token
      passwordRemoteSecretKey: gitlab-token

# No dedicated ServiceAccount by default - the namespace default is fine
# until an app needs its own Vault kubernetes-auth role bound per-SA.
serviceAccount:
  create: false
  name: ""
  annotations: {}
  automountServiceAccountToken: false

service:
  enabled: true
  port: 80
  targetPort: 8080

deployment:
  replicas: 1
  annotations: {}
  podAnnotations: {}
  podLabels:
    alloy.logs: enabled
    alloy.traces: enabled
  strategy:
    canary: {}
      # link.argocd.argoproj.io/external-link: http://my-grafana.example.com/pre-generated-link
  # command: ["./command"]
  # args: ["arg1", "arg2"]
  port: 8080
  env: []
  # - name: "EXAMPLE"
  #   value: "ENV"
  envFrom: []
  probes:
    liveness:
      httpGet:
        path: /health
        port: 8080
      initialDelaySeconds: 5
      periodSeconds: 10
    readiness:
      httpGet:
        path: /health
        port: 8080
      initialDelaySeconds: 5
      periodSeconds: 10
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 64Mi

# Pod-level security context - separate from the container-level one below,
# both explicit so the Restricted Pod Security Standard is visible here
# rather than implied by chart defaults a reader can't see.
podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

nodeSelector:
  node-role: worker

affinity:
  enabled: false

# Declarative volume API - no consumer should need its own templates/ file
# just to mount a secret as a file or get a writable /tmp.
volumes:
  # Secret mounted as file(s); always read-only (a writable secret mount is
  # an anti-pattern, so there is no readOnly:false escape hatch here).
  secretMounts: []
  # - name: google-sa
  #   secretName: health-ingest-secret
  #   mountPath: /etc/health-ingest/google-sa.json
  #   subPath: google-sa.json

  # Writable scratch space (e.g. for readOnlyRootFilesystem: true apps that
  # still need to write somewhere, like /tmp).
  emptyDirMounts: []
  # - name: tmp
  #   mountPath: /tmp

  # Escape hatch for anything the two conveniences above don't cover -
  # raw Volume + VolumeMount objects, passed through as-is.
  extra: []
  extraVolumeMounts: []

# Backing values for both imagePullSecrets (below) and externalSecret
# (app's own secrets, below) - one ClusterSecretStore config shared by both.
externalSecrets:
  kind: ClusterSecretStore
  name: vault
  refreshInterval: 1h
  creationPolicy: Owner

# Renders one ExternalSecret -> Secret for the app's own credentials, the
# same mechanism imagePullSecrets.yaml already uses for registry auth - no
# consumer should need to hand-write its own templates/externalsecret.yaml.
# The resulting Secret is named like the app itself (app.fullname) and can
# be referenced from deployment.env[].valueFrom.secretKeyRef or
# volumes.secretMounts[].secretName.
externalSecret:
  enabled: false
  data: []
  # - secretKey: jira_api_token
  #   remoteRefKey: product/monorepo/ingest-jira
  #   remoteRefProperty: jira_api_token

# Real template, default off - a PDB only protects against voluntary
# disruption (node drain), which on a single-node cluster means full outage
# regardless of minAvailable. Keep it off on homelab, flip it on for
# oracle-prod-0/1 once those grow past one node.
pdb:
  enabled: false
  minAvailable: 1

# Real template, default off - a single bare-metal node has fixed capacity,
# so autoscaling has nothing to scale into until there's more than one node.
hpa:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 80

# Real template, default off - Istio's mesh-level mTLS/AuthorizationPolicy
# already covers most of what a NetworkPolicy would, so this is opt-in for
# an app that genuinely needs an extra, mesh-independent boundary.
networkPolicy:
  enabled: false
  policyTypes: ["Ingress"]
  ingress: []
  egress: []
