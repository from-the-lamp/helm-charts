{{- $store := .Values.externalSecrets -}}
{{- define "hermes.remoteRef" -}}
{{- if not .ref.key }}{{ fail (printf "lamp-hermes: %s needs .key" .name) }}{{ end -}}
key: {{ .ref.key }}
{{- with .ref.property }}
property: {{ . }}
{{- end }}
{{- end -}}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Release.Name }}-env
spec:
  refreshInterval: "{{ $store.refreshInterval }}"
  secretStoreRef:
    kind: "{{ $store.kind }}"
    name: "{{ $store.name }}"
  target:
    name: {{ .Release.Name }}-env
    creationPolicy: "{{ $store.creationPolicy }}"
    template:
      data:
        # Hermes runtime — entrypoint reads these as process env (overriding ~/.hermes/.env).
        HERMES_HOME: {{ .Values.hermes.home | quote }}
        HERMES_UID: {{ .Values.hermes.uid | quote }}
        HERMES_GID: {{ .Values.hermes.gid | quote }}
        {{- range $k, $v := .Values.extraEnv }}
        {{ $k }}: {{ $v | quote }}
        {{- end }}
        {{- range $env, $ref := .Values.secrets }}
        {{ $env }}: {{ printf "{{ .%s }}" ($env | lower) | quote }}
        {{- end }}
  data:
  {{- range $env, $ref := .Values.secrets }}
  - secretKey: {{ $env | lower }}
    remoteRef:
      {{- include "hermes.remoteRef" (dict "ref" ($ref | default dict) "name" (printf "secrets.%s" $env)) | nindent 6 }}
  {{- end }}
{{- if .Values.secretFiles }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Release.Name }}-files
spec:
  refreshInterval: "{{ $store.refreshInterval }}"
  secretStoreRef:
    kind: "{{ $store.kind }}"
    name: "{{ $store.name }}"
  target:
    name: {{ .Release.Name }}-files
    creationPolicy: "{{ $store.creationPolicy }}"
  data:
  {{- range $file, $ref := .Values.secretFiles }}
  - secretKey: {{ $file }}
    remoteRef:
      {{- include "hermes.remoteRef" (dict "ref" ($ref | default dict) "name" (printf "secretFiles.%s" $file)) | nindent 6 }}
  {{- end }}
{{- end }}
