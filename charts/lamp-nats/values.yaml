# Single-node homelab - no clustering (cluster.enabled stays false, same
# single-replica posture as lamp-vault-server). JetStream file storage on
# local-path, matching every other PVC-backed app on this cluster.
nats:
  # Pinned (not left to Release.Name) for the same reason lamp-base
  # consumers now set fullnameOverride explicitly - a predictable Service
  # name ("nats", not "<release>-nats") that other services' NATS_URL can
  # rely on without having to know what release name ArgoCD assigns.
  fullnameOverride: nats
  config:
    cluster:
      enabled: false
    jetstream:
      enabled: true
      fileStore:
        enabled: true
        pvc:
          size: 5Gi
          storageClassName: local-path

  # FTL-187 step 4: scrape NATS server metrics the same way as every other
  # homelab workload (pull-based ServiceMonitor/PodMonitor, picked up by
  # the VictoriaMetrics operator's converter - see lamp-base's
  # serviceMonitor from FTL-187 step 3). The NATS server itself only
  # exposes varz/connz, not Prometheus exposition format, so the chart's
  # own promExporter sidecar (natsio/prometheus-nats-exporter) is required
  # to get a /metrics endpoint at all.
  promExporter:
    enabled: true
    podMonitor:
      enabled: true
