{{- $store := .Values.externalSecrets -}}
{{- define "lamp-hindsight.remoteRef" -}}
{{- if not .ref.key }}{{ fail (printf "lamp-hindsight: secrets.%s needs .key" .name) }}{{ end -}}
key: {{ .ref.key }}
{{- with .ref.property }}
property: {{ . }}
{{- end }}
{{- end -}}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Release.Name }}-secret
spec:
  refreshInterval: "{{ $store.refreshInterval }}"
  secretStoreRef:
    kind: "{{ $store.kind }}"
    name: "{{ $store.name }}"
  target:
    name: {{ .Release.Name }}-secret
    creationPolicy: "{{ $store.creationPolicy }}"
  data:
  {{- range $key, $ref := .Values.secrets }}
  - secretKey: {{ $key }}
    remoteRef:
      {{- include "lamp-hindsight.remoteRef" (dict "ref" ($ref | default dict) "name" $key) | nindent 6 }}
  {{- end }}
