apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "lamp-searxng.fullname" . }}
  annotations:
    reloader.stakater.com/auto: "true"
  labels:
    {{- include "lamp-searxng.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "lamp-searxng.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "lamp-searxng.selectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: SEARXNG_SECRET
              value: {{ .Values.secretKey | quote }}
            - name: SEARXNG_BASE_URL
              value: "http://{{ include "lamp-searxng.fullname" . }}:{{ .Values.service.port }}/"
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /
              port: http
          readinessProbe:
            httpGet:
              path: /
              port: http
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: settings
              mountPath: /etc/searxng/settings.yml
              subPath: settings.yml
      volumes:
        - name: settings
          configMap:
            name: {{ include "lamp-searxng.fullname" . }}-settings
