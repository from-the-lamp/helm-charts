{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccount.name }}
  namespace: {{ .Release.Namespace }}
  {{- if .Values.gcpUnseal.enabled }}
  annotations:
    iam.gke.io/gcp-service-account: {{ .Values.gcpUnseal.gsaName }}@{{ .Values.global.projectId }}.iam.gserviceaccount.com
  {{- end }}
{{- end }}
