{{- if and .Values.backup.enabled (eq (include "vsoft-vault-backup.provider" .) "gcs") }}
{{- $projectId := required "global.projectId must be set" .Values.global.projectId }}
{{- $gcs := dig "gcs" dict .Values.backup }}
{{- $bucket := include "vsoft-vault-backup.gcsBucket" . }}
{{- $createBucket := dig "bucket" "create" true $gcs }}
{{- $ksa := include "vsoft-vault-backup.workloadIdentitySA" . }}
{{- $createSA := dig "serviceAccount" "create" true $gcs }}
{{- if $createBucket }}
apiVersion: storage.cnrm.cloud.google.com/v1beta1
kind: StorageBucket
metadata:
  name: {{ $bucket }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
    cnrm.cloud.google.com/project-id: "{{ $projectId }}"
    cnrm.cloud.google.com/state-into-spec: "absent"
    cnrm.cloud.google.com/deletion-policy: abandon
spec:
  resourceID: {{ $bucket }}
  location: {{ default (required "global.region must be set" .Values.global.region) (dig "bucket" "location" "" $gcs) }}
  storageClass: {{ dig "bucket" "storageClass" "STANDARD" $gcs }}
  uniformBucketLevelAccess: true
  publicAccessPrevention: enforced
{{- end }}
{{- if $ksa }}
{{- $gsa := printf "%s@%s.iam.gserviceaccount.com" $ksa $projectId }}
{{- if $createSA }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $ksa }}
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
    iam.gke.io/gcp-service-account: {{ $gsa }}
---
apiVersion: iam.cnrm.cloud.google.com/v1beta1
kind: IAMServiceAccount
metadata:
  name: {{ $ksa }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
    cnrm.cloud.google.com/project-id: "{{ $projectId }}"
    cnrm.cloud.google.com/state-into-spec: "absent"
    cnrm.cloud.google.com/deletion-policy: abandon
spec:
  resourceID: {{ $ksa }}
  displayName: "GCP SA for Vault raft snapshot backups to GCS"
---
apiVersion: iam.cnrm.cloud.google.com/v1beta1
kind: IAMPolicyMember
metadata:
  name: vault-backup-workload-identity
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
    cnrm.cloud.google.com/project-id: "{{ $projectId }}"
    cnrm.cloud.google.com/state-into-spec: "absent"
    cnrm.cloud.google.com/deletion-policy: abandon
spec:
  member: "serviceAccount:{{ $projectId }}.svc.id.goog[{{ .Release.Namespace }}/{{ $ksa }}]"
  role: roles/iam.workloadIdentityUser
  resourceRef:
    apiVersion: iam.cnrm.cloud.google.com/v1beta1
    kind: IAMServiceAccount
    name: {{ $ksa }}
{{- end }}
---
apiVersion: iam.cnrm.cloud.google.com/v1beta1
kind: IAMPolicyMember
metadata:
  name: vault-backup-bucket-admin
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
    cnrm.cloud.google.com/project-id: "{{ $projectId }}"
    cnrm.cloud.google.com/state-into-spec: "absent"
    cnrm.cloud.google.com/deletion-policy: abandon
spec:
  member: "serviceAccount:{{ $gsa }}"
  role: roles/storage.objectAdmin
  resourceRef:
    apiVersion: storage.cnrm.cloud.google.com/v1beta1
    kind: StorageBucket
    {{- if $createBucket }}
    name: {{ $bucket }}
    {{- else }}
    external: {{ $bucket }}
    {{- end }}
{{- end }}
{{- end }}
