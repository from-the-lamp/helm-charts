{{- if and .Values.backup.enabled (include "vsoft-vault-backup.needsCredentials" .) }}
{{- $provider := include "vsoft-vault-backup.provider" . }}
{{- $gcsAuth := include "vsoft-vault-backup.gcsAuth" . }}
{{- $tokenSource := include "vsoft-vault-backup.tokenSource" . }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: vault-backup-credentials
spec:
  refreshInterval: "{{ .Values.externalSecrets.refreshInterval }}"
  secretStoreRef:
    kind: "{{ .Values.externalSecrets.kind }}"
    name: "{{ .Values.externalSecrets.name }}"
  target:
    name: vault-backup-credentials
    creationPolicy: "{{ .Values.externalSecrets.creationPolicy }}"
    template:
      data:
        {{- if eq $tokenSource "externalSecret" }}
        VAULT_TOKEN: "{{`{{ .vault_token }}`}}"
        {{- end }}
        {{- if eq $provider "s3" }}
        RCLONE_S3_ACCESS_KEY_ID: "{{`{{ .access_key }}`}}"
        RCLONE_S3_SECRET_ACCESS_KEY: "{{`{{ .secret_key }}`}}"
        {{- else if eq $gcsAuth "key" }}
        RCLONE_GCS_SERVICE_ACCOUNT_CREDENTIALS: "{{`{{ .credentials_json }}`}}"
        {{- end }}
  data:
{{- if eq $tokenSource "externalSecret" }}
  - secretKey: vault_token
    remoteRef:
      key: "{{ .Values.backup.vault.token.externalSecret.path }}"
      property: "{{ .Values.backup.vault.token.externalSecret.key }}"
{{- end }}
{{- if eq $provider "s3" }}
  - secretKey: access_key
    remoteRef:
      key: "{{ .Values.backup.s3.accessKey.path }}"
      property: "{{ .Values.backup.s3.accessKey.key }}"
  - secretKey: secret_key
    remoteRef:
      key: "{{ .Values.backup.s3.secretKey.path }}"
      property: "{{ .Values.backup.s3.secretKey.key }}"
{{- else if eq $gcsAuth "key" }}
  - secretKey: credentials_json
    remoteRef:
      key: "{{ required "backup.gcs.credentialsJson.path must be set when backup.gcs.auth=key" (dig "gcs" "credentialsJson" "path" "" .Values.backup) }}"
      property: "{{ required "backup.gcs.credentialsJson.key must be set when backup.gcs.auth=key" (dig "gcs" "credentialsJson" "key" "" .Values.backup) }}"
{{- end }}
{{- end }}
