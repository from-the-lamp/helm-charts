{{- if .Values.oauth.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: open-webui-oauth-config
data:
  ENABLE_OAUTH_SIGNUP: "true"
  ENABLE_OAUTH_ROLE_MANAGEMENT: "true"
  # SSO-only: no email/password form, no local password auth at all. Both
  # are PersistentConfig - the DB wins over env after the very first boot,
  # so ENABLE_PERSISTENT_CONFIG=false is required to actually make these
  # (and every other PersistentConfig setting) take effect on every start,
  # not just the first one.
  ENABLE_LOGIN_FORM: "false"
  ENABLE_PASSWORD_AUTH: "false"
  ENABLE_PERSISTENT_CONFIG: "false"
  # Skips the "Continue with GitLab" welcome screen and sends an
  # unauthenticated visitor straight to the IdP - only works with exactly
  # one provider and the login form already disabled above.
  OAUTH_AUTO_REDIRECT: "true"
  OPENID_PROVIDER_URL: {{ .Values.oauth.providerUrl | quote }}
  OAUTH_PROVIDER_NAME: {{ .Values.oauth.providerName | quote }}
  OAUTH_SCOPES: {{ .Values.oauth.scopes | quote }}
  OAUTH_ROLES_CLAIM: {{ .Values.oauth.rolesClaim | quote }}
  OAUTH_ALLOWED_ROLES: {{ .Values.oauth.allowedRoles | quote }}
  OAUTH_ADMIN_ROLES: {{ .Values.oauth.adminRoles | quote }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: open-webui-oauth-secret
spec:
  refreshInterval: "{{ .Values.externalSecrets.refreshInterval }}"
  secretStoreRef:
    kind: "{{ .Values.externalSecrets.kind }}"
    name: "{{ .Values.externalSecrets.name }}"
  target:
    name: open-webui-oauth-secret
    creationPolicy: "{{ .Values.externalSecrets.creationPolicy }}"
  data:
    - secretKey: OAUTH_CLIENT_ID
      remoteRef:
        key: {{ .Values.oauth.remoteSecretKey }}
        property: {{ .Values.oauth.clientIdProperty }}
    - secretKey: OAUTH_CLIENT_SECRET
      remoteRef:
        key: {{ .Values.oauth.remoteSecretKey }}
        property: {{ .Values.oauth.clientSecretProperty }}
{{- end }}
