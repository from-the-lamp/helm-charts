{{- if .Values.storage.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: open-webui-storage-config
data:
  STORAGE_PROVIDER: "s3"
  S3_BUCKET_NAME: {{ .Values.storage.bucket | quote }}
  S3_REGION_NAME: {{ .Values.storage.region | quote }}
  S3_ENDPOINT_URL: {{ .Values.storage.endpointUrl | quote }}
  S3_KEY_PREFIX: {{ .Values.storage.keyPrefix | quote }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: open-webui-storage-secret
spec:
  refreshInterval: "{{ .Values.externalSecrets.refreshInterval }}"
  secretStoreRef:
    kind: "{{ .Values.externalSecrets.kind }}"
    name: "{{ .Values.externalSecrets.name }}"
  target:
    name: open-webui-storage-secret
    creationPolicy: "{{ .Values.externalSecrets.creationPolicy }}"
  data:
    - secretKey: S3_ACCESS_KEY_ID
      remoteRef:
        key: {{ .Values.storage.remoteSecretKey }}
        property: {{ .Values.storage.accessKeyProperty }}
    - secretKey: S3_SECRET_ACCESS_KEY
      remoteRef:
        key: {{ .Values.storage.remoteSecretKey }}
        property: {{ .Values.storage.secretKeyProperty }}
{{- end }}
