{{- if .Values.secretKey.enabled }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: open-webui-secret-key
spec:
  refreshInterval: "{{ .Values.externalSecrets.refreshInterval }}"
  secretStoreRef:
    kind: "{{ .Values.externalSecrets.kind }}"
    name: "{{ .Values.externalSecrets.name }}"
  target:
    name: open-webui-secret-key
    creationPolicy: "{{ .Values.externalSecrets.creationPolicy }}"
  data:
    # Pinned explicitly: without persistence (no PVC), the auto-generated
    # .webui_secret_key file lives on the emptyDir and is lost on every pod
    # restart, invalidating every session/JWT.
    - secretKey: WEBUI_SECRET_KEY
      remoteRef:
        key: {{ .Values.secretKey.remoteSecretKey }}
        property: {{ .Values.secretKey.property }}
{{- end }}
