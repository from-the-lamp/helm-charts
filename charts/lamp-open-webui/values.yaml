externalSecrets:
  kind: ClusterSecretStore
  name: vault
  refreshInterval: 1h
  creationPolicy: Orphan

# Generic OIDC SSO (OAUTH_CLIENT_ID/SECRET, OPENID_PROVIDER_URL - Open WebUI's
# own native support, no custom auth code). Disabled by default; a consumer
# turns it on, points providerUrl/remoteSecretKey at its own IdP/Vault entry,
# and sets allowedRoles/adminRoles to whatever role or group claim its IdP
# emits - without that restriction ENABLE_OAUTH_SIGNUP lets anyone who can
# complete the IdP login provision themselves an account.
oauth:
  enabled: false
  remoteSecretKey: open-webui
  clientIdProperty: oauth.client-id
  clientSecretProperty: oauth.client-secret
  providerUrl: ""
  providerName: "SSO"
  scopes: "openid email profile"
  rolesClaim: "groups"
  allowedRoles: ""
  adminRoles: ""

# Relational data (chats/users/config) and RAG vectors in the shared CNPG
# Postgres instead of local SQLite/Chroma. Disabled by default; a consumer
# points host/database/user at its own role (created on that shared
# cluster, not here - see apps/homelab/platform/postgres) and
# remoteSecretKey/passwordProperty at its own Vault entry.
postgres:
  enabled: false
  host: postgres-rw.postgres.svc.cluster.local
  port: 5432
  database: open-webui
  user: open-webui
  remoteSecretKey: postgres
  passwordProperty: users.open-webui.password

# Uploaded files/attachments in S3-compatible storage instead of local
# disk. Disabled by default; a consumer points bucket/region/endpointUrl
# and remoteSecretKey/*Property at its own Vault entry.
storage:
  enabled: false
  bucket: ""
  region: ""
  endpointUrl: ""
  keyPrefix: ""
  remoteSecretKey: ""
  accessKeyProperty: ""
  secretKeyProperty: ""

# WEBUI_SECRET_KEY pinned from Vault instead of the chart's own
# auto-generated-and-written-to-disk default. Needed whenever persistence
# is disabled (see open-webui.persistence.enabled below) - otherwise every
# pod restart invalidates every session. Disabled by default.
secretKey:
  enabled: false
  remoteSecretKey: open-webui
  property: webui-secret-key

# OpenAI-compatible backend pointed at the cluster's own litellm proxy
# instead of api.openai.com. enabled only creates the ExternalSecret below
# (open-webui-litellm-secret, key "api-key") - open-webui's own
# openaiBaseApiUrl/openaiApiKeyExistingSecret/openaiApiKeyExistingSecretKey
# fields are plain scalar chart values, not env vars, so they can't be
# derived from this block and a consumer must set them directly (pointing
# at this same secret) alongside remoteSecretKey/apiKeyProperty here.
litellm:
  enabled: false
  remoteSecretKey: litellm
  apiKeyProperty: master_key

open-webui:
  # optional: true on all of these - each ConfigMap/ExternalSecret only
  # exists when its own feature flag above is enabled; without it they're
  # missing and this must not block pod startup.
  extraEnvFrom:
    - secretRef:
        name: open-webui-oauth-secret
        optional: true
    - configMapRef:
        name: open-webui-oauth-config
        optional: true
    - secretRef:
        name: open-webui-postgres-secret
        optional: true
    - configMapRef:
        name: open-webui-postgres-config
        optional: true
    - secretRef:
        name: open-webui-storage-secret
        optional: true
    - configMapRef:
        name: open-webui-storage-config
        optional: true
    - secretRef:
        name: open-webui-secret-key
        optional: true
