# Actual Budget bundles its own SQLite store under /data - no database
# wiring needed here, unlike lamp-pgadmin/lamp-home-assistant.
actualbudget:
  image:
    tag: "" # defaults to appVersion (26.10.0)

  # RollingUpdate (the chart default) briefly runs two pods against the same
  # RWO SQLite-backed PVC - force Recreate to avoid two actual-server
  # processes writing the same data files at once.
  strategy:
    type: Recreate

  service:
    type: ClusterIP
    port: 5006

  persistence:
    enabled: true
    accessModes:
      - ReadWriteOnce
    size: 5Gi

  # Routing is handled by lamp-istio-routes in the consuming argo-apps app,
  # so this chart's own Ingress object is never actually used for traffic -
  # BUT the chart's own deployment.yaml gates its *entire* ACTUAL_OPENID_*
  # env/secret wiring (client id/secret, discovery url, hostname, ...) behind
  # `ingress.enabled`, with no other toggle to reach it. Left on for that
  # reason alone; no IngressClass on this cluster (Gateway API/Istio only)
  # ever picks the resulting Ingress object up.
  ingress:
    enabled: true

  login:
    # Flip to "openid" (here or in the consuming argo-apps values.yaml) once
    # the GitLab OAuth Application exists and openid.remoteSecretKeys below
    # resolves in Vault - until then the openid-client ExternalSecret is
    # harmless to leave in place unsynced, since nothing references it in
    # password mode.
    method: password
    openid:
      # Chart default; per Actual's own docs this "forces OpenID/OAuth2 as
      # the only allowed login method" - kept true intentionally, SSO is
      # meant to be the only way in. allowedLoginMethods is restricted to
      # match at the consuming (argo-apps) layer once method flips to
      # "openid", since it's rendered unconditionally and listing
      # "password" there while method is still "password" (chart default)
      # must stay valid for anyone else using this chart's defaults as-is.
      enforce: true
      providerName: "GitLab"
      discoveryUrl: "https://gitlab.com"
      authMethod: openid
      existingSecret:
        name: actualbudget-openid-client
        clientIdKey: client_id
        clientSecretKey: client_secret

  # Static (non-secret) - the chart would otherwise derive this from
  # ingress.hosts/tls, which carry no real data since routing is via
  # lamp-istio-routes; env entries override envFrom-sourced ones of the same
  # name, so this always wins over the chart's own guess.
  extraEnvVars:
    ACTUAL_OPENID_SERVER_HOSTNAME: "https://actualbudget.from-the-lamp.work"

# Consumed by templates/openid-secret.yaml, same remoteSecretKeys shape as
# lamp-pgadmin's oauth block. Placeholder path here; the argo-apps layer
# points it at the real Vault path once the GitLab OAuth Application exists.
openid:
  remoteSecretKeys:
    client_id:
      path: example/path
      key: client_id
    client_secret:
      path: example/path
      key: client_secret

externalSecrets:
  kind: ClusterSecretStore
  name: vault
  refreshInterval: 1h
  creationPolicy: Orphan

# No storage-layer replication on a single-node cluster (local-path), and
# no backup for this PVC otherwise - same rclone-to-S3 CronJob shape as
# lamp-immich's backup.*, just tarring the whole /data dir (server-files +
# user-files) instead of a library subset. Disabled by default; the
# consuming argo-apps app turns it on with real bucket/Vault values.
backup:
  enabled: false
  bucket: ""
  path: actualbudget
  keep: 7
  schedule: "0 3 * * *"
  deploymentName: actualbudget
  podSelector: "app.kubernetes.io/instance=actualbudget,app.kubernetes.io/name=actualbudget"
  pvcClaimName: actualbudget-data
  rclone:
    provider: Other
    region: ""
    endpoint: ""
  vault:
    remoteSecretKey: s3
    accessKeyProperty: ""
    secretKeyProperty: ""
