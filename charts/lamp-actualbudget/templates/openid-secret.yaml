apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: actualbudget-openid-client
spec:
  refreshInterval: "{{ .Values.externalSecrets.refreshInterval }}"
  secretStoreRef:
    kind: "{{ .Values.externalSecrets.kind }}"
    name: "{{ .Values.externalSecrets.name }}"
  target:
    name: actualbudget-openid-client
    creationPolicy: "{{ .Values.externalSecrets.creationPolicy }}"
  data:
    - secretKey: client_id
      remoteRef:
        key: "{{ .Values.openid.remoteSecretKeys.client_id.path }}"
        property: "{{ .Values.openid.remoteSecretKeys.client_id.key }}"
    - secretKey: client_secret
      remoteRef:
        key: "{{ .Values.openid.remoteSecretKeys.client_secret.path }}"
        property: "{{ .Values.openid.remoteSecretKeys.client_secret.key }}"
