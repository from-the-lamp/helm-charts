remoteSecretKeys:
  token: gitlab-runner-token

gitlab-runner:
  gitlabUrl: https://gitlab.com
  rbac:
    create: true
  serviceAccount:
    create: true
    name: gitlab-runner
  runners:
    serviceAccountName: gitlab-runner
    secret: gitlab-runner
    config: |
      [[runners]]
        request_concurrency = 2
        [runners.feature_flags]
          FF_USE_ADAPTIVE_REQUEST_CONCURRENCY = true
        [runners.kubernetes]
          namespace = "{{ default .Release.Namespace .Values.runners.jobNamespace }}"
          image = "ubuntu:latest"
          helper_image = "gitlab/gitlab-runner-helper:arm64-latest"
          privileged = true

externalSecrets:
  kind: ClusterSecretStore
  name: oracle
  refreshInterval: 1h
  creationPolicy: Orphan

buildkitd:
  enabled: false
  image:
    repository: moby/buildkit
    tag: v0.35.0
    pullPolicy: IfNotPresent
  port: 1234
  persistence:
    size: 30Gi
    storageClass: ""
    # When set, buildkitd's state dir is a hostPath at this path instead
    # of a local-path-provisioner PVC - needed on nodes where the
    # provisioner's default path is itself a nested overlay mount (e.g.
    # Talos' /opt), which the kernel refuses as an overlayfs upperdir and
    # forces buildkit to fall back to the much slower "native" snapshotter.
    hostPath: ""
  gc:
    maxUsedSpace: 20GB
  resources: {}
  nodeSelector: {}
  networkPolicy:
    enabled: true
    clientLabel: ci-docker-client
