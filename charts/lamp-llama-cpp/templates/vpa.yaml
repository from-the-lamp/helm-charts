{{- if .Values.vpa.enabled }}
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: {{ include "llama-cpp.fullname" . }}
  labels:
    {{- include "llama-cpp.labels" . | nindent 4 }}
spec:
  targetRef:
    apiVersion: apps/v1
    kind: StatefulSet
    name: {{ include "llama-cpp.fullname" . }}
  updatePolicy:
    # "Off": the recommender only computes and reports what this pod's
    # requests/limits should be (`kubectl describe vpa ...`) - nothing
    # ever gets applied automatically. Switching to "Auto"/"Initial" also
    # needs apps/homelab/platform/vpa's updater/admissionController
    # enabled (deliberately off cluster-wide), not just this value.
    updateMode: {{ .Values.vpa.updateMode | quote }}
  resourcePolicy:
    containerPolicies:
      # Memory only - no CPU limit is set on this container on purpose
      # (see values.yaml's resources comment), so a CPU recommendation
      # would have nothing to act on even once updateMode leaves "Off".
      - containerName: llama-cpp
        controlledResources: ["memory"]
      # The model-download init container is short-lived and its memory
      # footprint is curl's own, not llama.cpp's - excluded so it never
      # pollutes the recommendation for the actual inference container.
      - containerName: model-fetch
        mode: "Off"
{{- end }}
