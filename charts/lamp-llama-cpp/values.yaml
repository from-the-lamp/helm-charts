replicaCount: 1

# "server-vulkan" (no build suffix) is a rolling/mutable tag - it moves
# to whatever ggml-org merges that day, which breaks the same
# reproducibility this chart pins everywhere else (model revision,
# schematic hash). Pinned instead to the specific, immutable build tag
# it resolved to on 2026-11-16 (confirmed same digest via the registry
# API: ghcr.io/ggml-org/llama.cpp@sha256:2d9c3250...af5d749, upstream
# revision 9fba51d2c9a1b5cb5f0c47986c031334e2d7663a) - llama.cpp's CI
# never reuses a "b<N>" build number, so this tag will not move under us.
# Bump deliberately by checking which "server-vulkan-b<N>" tag the
# rolling "server-vulkan" tag currently resolves to, not by switching
# back to the rolling tag.
image:
  repository: ghcr.io/ggml-org/llama.cpp
  tag: server-vulkan-b12429
  pullPolicy: IfNotPresent

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}

# fsGroup (not supplementalGroups) - applies to every mounted volume's
# ownership regardless of which non-root UID a container image happens to
# run as, so the model-fetch init container (ghcr.io/curlimages/curl runs
# as its own "curl_user", confirmed via that image's config blob - no
# `User` override needed) can always write the downloaded GGUF onto the
# PVC. Picked once, here, not derived from anything node-specific - no
# live lookup required.
podSecurityContext:
  fsGroup: 1000

# The model-fetch init container only downloads a file onto the PVC -
# no device access, so it keeps the non-privileged profile the main
# container used to have, separately from securityContext below.
modelFetchSecurityContext:
  privileged: false
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  runAsNonRoot: false

# privileged: true for the main container only - genuinely needed, not
# a default. Two non-privileged attempts were tried live and both failed
# with "no usable GPU found" even though /dev/dri/renderD128 was visible
# in the container: a hostPath volume (Directory, then CharDevice) is
# just a bind mount - it does not add anything to the cgroup device
# allow-list, so the default non-privileged list (null/zero/random/tty/
# ...) still blocks open()/ioctl() on the render node. This is not an
# oversight Kubernetes special-cases for CharDevice; see
# kubernetes/kubernetes#89939, which asks for exactly that feature and
# confirms it doesn't exist. The only declarative alternatives are a GPU
# device-plugin DaemonSet (its own cluster-wide component, not justified
# for one single-node consumer) or privileged: true. No
# allowPrivilegeEscalation field here - the Kubernetes API rejects
# privileged: true combined with allowPrivilegeEscalation: false outright
# ("cannot set allowPrivilegeEscalation to false and privileged to true",
# confirmed live as a SyncFailed admission error) since privileged already
# implies it; leaving the field unset is the only valid combination.
securityContext:
  privileged: true
  readOnlyRootFilesystem: false
  runAsNonRoot: false

gpu:
  enabled: true
  # Vulkan/RADV talks to the render node, not the display/control node -
  # renderD* is the only one a headless server container needs. The
  # whole /dev/dri directory is mounted (not just this one file) since
  # privileged: true above already removes the cgroup restriction this
  # path was originally trying to route around - no reason to keep the
  # narrower single-file mount once privileged is unavoidable.
  renderDevicePath: /dev/dri

# GGUF model fetched once into the PVC by the init container below and
# reused across restarts - never re-downloaded unless the file is
# missing or fails the sha256 check. Revision is a pinned HF git commit
# (not a mutable "main" ref) so the content a given chart version
# downloads cannot silently change later.
model:
  repo: bartowski/Qwen2.5-7B-Instruct-GGUF
  revision: 8911e8a47f92bac19d6f5c64a2e2095bd2f7d031
  file: Qwen2.5-7B-Instruct-Q4_K_M.gguf
  sha256: 65b8fcd92af6b4fefa935c625d1ac27ea29dcb6ee14589c55a8f115ceaaa1423
  fetchImage:
    repository: curlimages/curl
    tag: 8.12.1

server:
  contextSize: 8192
  # 99 = "offload as many layers as fit" (llama.cpp clamps to the model's
  # real layer count); Radeon 780M's RADV Vulkan heap is shared system
  # RAM, not dedicated VRAM, so this is a request, not a guaranteed full
  # offload - the smoke test checks the actual offloaded-layer count in
  # the server's own startup log, not this value.
  gpuLayers: 99
  extraArgs: []

service:
  type: ClusterIP
  port: 8080

persistence:
  accessMode: ReadWriteOnce
  size: 20Gi
  storageClass: local-path

# Single biggest memory consumer on the node once scheduled (see
# apps/homelab/platform/llama-cpp's values.yaml comment for the sizing
# rationale against the node's free headroom). No CPU limit: llama.cpp
# falls back to CPU layers for whatever Vulkan can't hold, and capping
# CPU would silently slow that fallback path instead of making it visible.
resources:
  requests:
    cpu: "2"
    memory: 6Gi
  limits:
    memory: 9Gi

nodeSelector: {}
affinity: {}
tolerations: []

# Recommendation-only VerticalPodAutoscaler (see templates/vpa.yaml) -
# requires apps/homelab/platform/vpa (the VPA recommender) to actually be
# deployed; the CRD alone being absent would just leave this resource
# unreconciled, not break anything else. updateMode "Off" never touches
# the running pod - it only gives a live, continuously-updated answer to
# "what should requests/memory actually be" instead of the one-time
# static guess in resources.requests.memory above, without needing the
# updater/admission-controller components (both left disabled cluster-
# wide) that would be required to act on it automatically.
vpa:
  enabled: true
  updateMode: "Off"

# Single-node cluster, no dedicated GPU scheduling tier: this is the
# cheap, already-established substitute for workload-aware memory
# management (see lamp-hermes's own priorityclass.yaml, mirrored here
# with the opposite sign). Under real node memory pressure, kubelet's
# eviction manager ranks same-QoS pods by priority as a tiebreaker - a
# negative value here means llama-cpp is evicted before every
# default-priority (0) pod on the node, protecting kube-apiserver/vault/
# etc. without any new controller. Empty disables the PriorityClass.
priorityClassName: llama-cpp-low-priority

terminationGracePeriodSeconds: 30
