# FTL-223: first real (not scaffold) pass. Verified against the actual
# upstream chart source (pulled oneuptime-15.0.0.tgz from
# https://helm-chart.oneuptime.com and read templates/nginx.yaml,
# templates/_helpers.tpl, templates/secrets.yaml directly) rather than
# guessed from docs:
#
# - nginx.service.type defaults to LoadBalancer - homelab has no public LB
#   (apps/homelab/platform README). Forced to ClusterIP below; the
#   apps/homelab/platform/oneuptime app's own lamp-istio-routes dependency
#   fronts it via istio-gateway-internal instead, backendRef
#   oneuptime-nginx:80 (Service name is always "{{ .Release.Name }}-nginx",
#   and this app's Helm release name is "oneuptime" - confirmed against the
#   live litellm Service, whose release name matches its app directory
#   name, not the ArgoCD Application name "platform-homelab-<app>").
# - postgresql is now the shared "postgres" CNPG cluster
#   (apps/homelab/platform/postgres), not the bundled StatefulSet - see
#   externalPostgres/database below. Root cause for the switch, confirmed
#   live: this chart's own secret-generation templates (templates/
#   secrets.yaml) ALL use a `lookup "v1" "Secret" ...` guard meant to reuse
#   an existing password across `helm upgrade`, falling back to
#   `randAlphaNum 32` only when no existing Secret is found. ArgoCD renders
#   Helm charts with `helm template` (no connected-cluster context), so
#   `lookup` always returns empty there - every single sync regenerated a
#   BRAND NEW random postgres-password, while the already-initialized
#   Postgres container (which only reads its password once, at first
#   startup) kept the old one. Observed live: new oneuptime-app/-nginx/
#   -probe-one replicas CrashLoopBackOff on "password authentication failed
#   for user postgres" while pods running since the original install kept
#   working on their already-established connections. The exact same
#   `lookup`-based pattern also covers clickhouse/valkey's passwords and
#   oneuptimeSecret/registerProbeKey/encryptionSecret - those are NOT fixed
#   here (still exposed to the same silent-regeneration risk on every sync,
#   tracked by FTL-223), this change only takes postgres out of that chart-
#   internal mechanism entirely by pointing it at Vault-sourced, stable
#   credentials instead.
# - clickhouse/valkey/oneuptimeSecret/registerProbeKey/encryptionSecret are
#   now PINNED to fixed literal values below instead of left to the chart's
#   `randAlphaNum` fallback - confirmed live the bug above isn't
#   postgres-specific: right after the postgres fix synced, the very next
#   sync regenerated valkey's password too (new app/nginx/probe-one
#   replicas WRONGPASS against oneuptime-valkey-master, migrate Job failed
#   outright on it). Valkey doesn't persist its password in data the way
#   Postgres does (requirepass is just a container-start argument sourced
#   from the Secret each time), so pinning it plus restarting the pod once
#   was enough - no ALTER-equivalent needed. Plain literals here, not
#   Vault-backed (no FTL-223 Vault entry for these and no write access in
#   this session) - good enough to stop the regeneration; revisit under
#   FTL-223 if Vault-backing these specifically is wanted later.
oneuptime:
  host: oneuptime.from-the-lamp.work
  # TLS terminates at istio-gateway-internal, not at this pod (same as
  # every other app here) - the pod itself still only ever speaks plain
  # http. But OneUptime bakes HTTP_PROTOCOL+HOST into absolute URLs/CORS
  # checks the frontend uses, and real browser access is over https -
  # confirmed live: the dashboard's every fetch failed with the generic
  # "OneUptime could not be reached" (Common/Types/Exception/
  # UnexplainedError.ts's wording for a fetch() that got no answer at all,
  # which is indistinguishable in JS from a browser-blocked mixed-content/
  # CORS request). httpProtocol only changes what URLs/cookies/Origin
  # checks the app builds, not the pod's actual listener.
  httpProtocol: https

  global:
    storageClass: local-path

  image:
    type: community-edition
    # Chart default is the floating "release" tag + pullPolicy Always - a
    # pod recreate can silently pull a newer app release. Pinned to the
    # version actually running today (confirmed live: the running image's
    # digest matches this tag on Docker Hub, and the app's own /version
    # endpoint reports 15.0.0 too) so a version bump is a deliberate tag
    # change here, not a side effect of a restart.
    tag: "15.0.0"
    pullPolicy: IfNotPresent

  email:
    serverType: custom-smtp
    fromEmail: artyom.zverev@proton.me
    fromName: OneUptime
    smtp:
      host: smtp-relay.brevo.com
      port: 587
      requireTls: true
      username: c40526001@smtp-brevo.com
    existingSecret:
      name: oneuptime-email

  slackApp:
    clientId: "6547522206593.12639247996437"
    existingSecret:
      name: oneuptime-slack
      clientIdKey: clientId
      clientSecretKey: clientSecret
      signingSecretKey: signingSecret

  postgresql:
    enabled: false

  # migrate-job.yaml's name (`{{ .Release.Name }}-migrate-{{ .Release.Revision }}`)
  # never changes under ArgoCD - Release.Revision stays "1" forever there - so
  # any values change that touches this Job's pod spec (new env vars, like the
  # email/Slack ones added here) makes ArgoCD's sync fail with "field is
  # immutable" on the next sync, since Jobs can't be patched in place. Same
  # annotation as our own admin-bootstrap/global-oidc-bootstrap Jobs, but
  # passed through the chart's own supported migrate.annotations (confirmed in
  # its migrate-job.yaml: merged in as-is, only helm.sh/hook is refused) so
  # ArgoCD deletes and recreates it instead of erroring, on every sync.
  migrate:
    annotations:
      argocd.argoproj.io/sync-options: Replace=true,Force=true
    # Chart default {} - the migrate Job runs briefly on every sync; sized
    # generously rather than measured, since it's not a steady-state pod.
    resources:
      requests:
        cpu: 50m
        memory: 256Mi
      limits:
        memory: 512Mi

  # "oneuptime" role/database created on the shared cluster by
  # apps/homelab/platform/postgres's values.yaml (databases/roles lists).
  # postgres-rw is that cluster's Service, in the "postgres" namespace -
  # cross-namespace, so needs the FQDN (bare short names only resolve
  # same-namespace) - same hostname every other consumer of that cluster
  # uses (e.g. lamp-immich's own values.yaml).
  externalPostgres:
    host: postgres-rw.postgres.svc.cluster.local
    port: 5432
    username: oneuptime
    database: oneuptime
    existingSecret:
      name: postgres-oneuptime-password
      passwordKey: password

  nginx:
    service:
      type: ClusterIP
    # Chart default {} - live pods_top shows nginx at ~405Mi RSS, higher
    # than a bare reverse-proxy would suggest; sized with headroom rather
    # than trimmed tight.
    resources:
      requests:
        cpu: 10m
        memory: 448Mi
      limits:
        memory: 768Mi

  # By default an Incoming Request monitor evaluates only the NEWEST request
  # when several arrive before the previous one is processed, and silently
  # skips the ones in between (upstream docs, monitor/incoming-request-
  # monitor.md). Alertmanager sends one webhook per alert group to the same
  # URL, so a burst loses firing alerts, and a skipped "resolved" leaves its
  # incident open forever - Alertmanager never repeats a recovery. With this
  # off every request is evaluated on its own. app.extraEnv is the upstream
  # chart's own passthrough (templates/app.yaml).
  app:
    extraEnv:
      - name: INCOMING_REQUEST_INGEST_COALESCE_ENABLED
        value: "false"
    # Chart default is {} on every component - the app ran with an
    # unbounded Node.js heap (the chart sizes it off resources.limits.memory
    # itself). Sized from live pods_top (app ~775Mi RSS today) with
    # headroom for the restart spike measured upstream.
    resources:
      requests:
        cpu: 200m
        memory: 896Mi
      limits:
        memory: 1792Mi

  probes:
    one:
      # Chart default {} - live pods_top shows probe-one at ~220Mi RSS.
      resources:
        requests:
          cpu: 50m
          memory: 256Mi
        limits:
          memory: 512Mi

  # Hex only, deliberately - clickhouse's init container does
  # `sed -i "s/PLACEHOLDER/$CLICKHOUSE_PASSWORD/g"` against its config
  # (confirmed live: clickhouse-config-init crash-looped, "sed: couldn't
  # open file DC5/g" - a `/` in the first base64-generated password broke
  # sed's own delimiter). Valkey doesn't go through sed, but pinned to hex
  # here too rather than verify that's true for every version.
  valkey:
    auth:
      password: "52756b121de34e5f052b36168ecf58d5000209d73d5571d4"
    # Chart default {} - live pods_top shows this at a few MiB; capped
    # modestly rather than left fully unbounded.
    master:
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          memory: 128Mi

  # Moved off the bundled StatefulSet onto the shared central ClickHouse
  # (apps/homelab/platform/clickhouse, lamp-clickhouse-cluster) - same
  # reasoning as externalPostgres above: one cluster instead of one per
  # consumer. The "oneuptime" user there is scoped to database "oneuptime"
  # only (CREATE DATABASE + DML/DDL, see that chart's values.yaml).
  clickhouse:
    enabled: false

  externalClickhouse:
    host: clickhouse-cluster.clickhouse.svc.cluster.local
    isHostHttps: false
    port: 8123
    username: oneuptime
    database: oneuptime
    # Must match the central cluster's actual cluster name (cluster.name in
    # lamp-clickhouse-cluster, "default" there) - the chart's own default
    # here is the Helm release name ("oneuptime"), which doesn't exist as a
    # ClickHouse cluster, so every ON CLUSTER DDL in the migrate Job failed
    # with "Requested cluster 'oneuptime' not found" until this was set.
    clusterName: default
    existingSecret:
      name: clickhouse-oneuptime-password
      passwordKey: password
    tls:
      enabled: false

  # Chart default is "everything". Logs/metrics/traces live in Loki/
  # VictoriaMetrics/Tempo, not here - this instance only consumes alerts
  # and manages incidents, so "incident-response" matches actual usage.
  # Helm-apply-time seed only: Settings -> Products in the admin UI
  # overrides this after the first save, so changing it here again later
  # has no visible effect unless that UI setting is also changed.
  products:
    onThisServer: incident-response

  telemetry:
    disableIngestion: true

  webhooks:
    privateNetworkAllowlist: "kelos-webhook-generic.kelos.svc.cluster.local"

  oneuptimeSecret: "aae773dc92ab56adaed5572c19f7da561da0391320f14227"
  registerProbeKey: "48524500951e237d50a49f38227552ecf7308135572a8f38"
  encryptionSecret: "5a7b269f475bbc0ecffbb28b5a0ae8509c78fd17715e91ef"

  # The probe pod's default capabilities add NET_RAW (for ICMP ping-type
  # monitors) - this cluster's default PodSecurity admission (baseline,
  # applied to every unlabeled namespace) rejects that outright (confirmed
  # live: ReplicaSet FailedCreate, "must not include NET_RAW"). Dropped
  # rather than relaxing the oneuptime namespace's PodSecurity level, which
  # would need its own explicit decision - HTTP(S)/TCP/SSL/API/browser
  # monitors (the large majority of real usage) don't need it. Only the
  # ping/ICMP monitor type is unavailable as a result.
  probeContainerSecurityContext:
    capabilities:
      add:
        - CHOWN
        - DAC_OVERRIDE
        - KILL
        - SETGID
        - SETUID

# templates/admin-bootstrap.yaml: a Job that signs up the server's first
# (= Master Admin, per OneUptime's own server-side election - there is no
# separate "create admin" endpoint) account from Vault-sourced credentials
# instead of a browser. Same convention as lamp-home-assistant's and
# lamp-immich's own admin-bootstrap.yaml. Disabled by default - enabling it
# needs platform/oneuptime written to Vault first (this session has no
# write access there):
#   vault kv put platform/oneuptime \
#     admin-email=<email> admin-name=<name> \
#     admin-password="$(openssl rand -base64 24)"
# Password must be >=15 characters and not an obvious pattern (OneUptime's
# own rule, Common/Types/Password.ts) - openssl rand -base64 24 clears both.
adminBootstrap:
  enabled: true
  remoteSecretKey: platform/oneuptime
  emailProperty: admin-email
  nameProperty: admin-name
  passwordProperty: admin-password

# templates/email-secret.yaml: the Secret oneuptime.email.existingSecret.name
# names - the chart reads its smtpPassword key for GLOBAL_EMAIL_SMTP_PASSWORD.
emailSecret:
  enabled: true
  remoteSecretKey: smtp
  passwordProperty: brevo.smtp-api-key

# templates/slack-secret.yaml: the Secret oneuptime.slackApp.existingSecret.name
# names - the chart reads clientSecret/signingSecret from it.
slackSecret:
  enabled: true
  remoteSecretKey: slack
  clientIdProperty: oneuptime.client-id
  clientSecretProperty: oneuptime.client-secret
  signingSecretProperty: oneuptime.signing-secret

# templates/global-oidc-bootstrap.yaml: creates the GitLab OIDC GlobalOidc
# provider (if a provider of this name doesn't already exist) and sets
# GlobalConfig.requireSsoForLogin/disableSignup, the same way
# adminBootstrap creates the first user - all through the already-running
# oneuptime-app's own API, idempotently, instead of a one-off manual change.
globalOidcBootstrap:
  enabled: true
  name: "GitLab (from-the-lamp)"
  description: "GitLab OIDC SSO for homelab OneUptime, group from-the-lamp"
  discoveryURL: "https://gitlab.com/.well-known/openid-configuration"
  issuerURL: "https://gitlab.com"
  scopes: "openid email profile"
  emailClaimName: "email"
  nameClaimName: "name"
  disableSignUpWithSso: false
  restrictToAttachedProjects: false
  isEnabled: true
  remoteSecretKey: platform/oneuptime
  clientIdProperty: client-id
  clientSecretProperty: client-secret

globalConfig:
  requireSsoForLogin: true
  disableSignup: true
  setupChecklist:
    smsAndCalls: skipped
    backups: confirmed

externalSecrets:
  kind: ClusterSecretStore
  name: vault
  refreshInterval: 1h
  creationPolicy: Orphan

# templates/db-password.yaml: this chart's own copy of the shared postgres
# cluster's "oneuptime" role password (Secrets are namespace-scoped, so a
# cross-namespace consumer needs its own ExternalSecret pulling the same
# Vault property - same pattern as lamp-immich's own database: block).
# Mirrors apps/homelab/platform/postgres's rolePasswordSources.oneuptime -
# both must agree on the one Vault property.
database:
  passwordSecret:
    name: postgres-oneuptime-password
    remoteSecretKey: postgres
    remoteSecretProperty: users.oneuptime.password

# templates/clickhouse-password.yaml: same cross-namespace pattern as
# database.passwordSecret above, for the shared central ClickHouse's
# "oneuptime" user (apps/homelab/platform/clickhouse's userPasswordSources).
clickhousePasswordSecret:
  name: clickhouse-oneuptime-password
  remoteSecretKey: clickhouse
  remoteSecretProperty: users.oneuptime.password
