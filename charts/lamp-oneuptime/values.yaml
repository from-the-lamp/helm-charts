# FTL-223: first real (not scaffold) pass. Verified against the actual
# upstream chart source (pulled oneuptime-15.0.0.tgz from
# https://helm-chart.oneuptime.com and read templates/nginx.yaml,
# templates/_helpers.tpl, templates/secrets.yaml directly) rather than
# guessed from docs:
#
# - nginx.service.type defaults to LoadBalancer - homelab has no public LB
#   (apps/homelab/platform README). Forced to ClusterIP below; the
#   apps/homelab/platform/oneuptime app's own lamp-istio-routes dependency
#   fronts it via istio-gateway-internal instead, backendRef
#   oneuptime-nginx:80 (Service name is always "{{ .Release.Name }}-nginx",
#   and this app's Helm release name is "oneuptime" - confirmed against the
#   live litellm Service, whose release name matches its app directory
#   name, not the ArgoCD Application name "platform-homelab-<app>").
# - postgresql is now the shared "postgres" CNPG cluster
#   (apps/homelab/platform/postgres), not the bundled StatefulSet - see
#   externalPostgres/database below. Root cause for the switch, confirmed
#   live: this chart's own secret-generation templates (templates/
#   secrets.yaml) ALL use a `lookup "v1" "Secret" ...` guard meant to reuse
#   an existing password across `helm upgrade`, falling back to
#   `randAlphaNum 32` only when no existing Secret is found. ArgoCD renders
#   Helm charts with `helm template` (no connected-cluster context), so
#   `lookup` always returns empty there - every single sync regenerated a
#   BRAND NEW random postgres-password, while the already-initialized
#   Postgres container (which only reads its password once, at first
#   startup) kept the old one. Observed live: new oneuptime-app/-nginx/
#   -probe-one replicas CrashLoopBackOff on "password authentication failed
#   for user postgres" while pods running since the original install kept
#   working on their already-established connections. The exact same
#   `lookup`-based pattern also covers clickhouse/valkey's passwords and
#   oneuptimeSecret/registerProbeKey/encryptionSecret - those are NOT fixed
#   here (still exposed to the same silent-regeneration risk on every sync,
#   tracked by FTL-223), this change only takes postgres out of that chart-
#   internal mechanism entirely by pointing it at Vault-sourced, stable
#   credentials instead.
# - clickhouse/valkey are still left at the chart's own bundled defaults -
#   same open decision as before, not resolved here.
oneuptime:
  host: oneuptime.from-the-lamp.work
  httpProtocol: http

  global:
    storageClass: local-path

  image:
    type: community-edition

  postgresql:
    enabled: false

  # "oneuptime" role/database created on the shared cluster by
  # apps/homelab/platform/postgres's values.yaml (databases/roles lists).
  # postgres-rw is that cluster's Service, in the "postgres" namespace -
  # cross-namespace, so needs the FQDN (bare short names only resolve
  # same-namespace) - same hostname every other consumer of that cluster
  # uses (e.g. lamp-immich's own values.yaml).
  externalPostgres:
    host: postgres-rw.postgres.svc.cluster.local
    port: 5432
    username: oneuptime
    database: oneuptime
    existingSecret:
      name: postgres-oneuptime-password
      passwordKey: password

  nginx:
    service:
      type: ClusterIP

  # The probe pod's default capabilities add NET_RAW (for ICMP ping-type
  # monitors) - this cluster's default PodSecurity admission (baseline,
  # applied to every unlabeled namespace) rejects that outright (confirmed
  # live: ReplicaSet FailedCreate, "must not include NET_RAW"). Dropped
  # rather than relaxing the oneuptime namespace's PodSecurity level, which
  # would need its own explicit decision - HTTP(S)/TCP/SSL/API/browser
  # monitors (the large majority of real usage) don't need it. Only the
  # ping/ICMP monitor type is unavailable as a result.
  probeContainerSecurityContext:
    capabilities:
      add:
        - CHOWN
        - DAC_OVERRIDE
        - KILL
        - SETGID
        - SETUID

# templates/admin-bootstrap.yaml: a Job that signs up the server's first
# (= Master Admin, per OneUptime's own server-side election - there is no
# separate "create admin" endpoint) account from Vault-sourced credentials
# instead of a browser. Same convention as lamp-home-assistant's and
# lamp-immich's own admin-bootstrap.yaml. Disabled by default - enabling it
# needs platform/oneuptime written to Vault first (this session has no
# write access there):
#   vault kv put platform/oneuptime \
#     admin-email=<email> admin-name=<name> \
#     admin-password="$(openssl rand -base64 24)"
# Password must be >=15 characters and not an obvious pattern (OneUptime's
# own rule, Common/Types/Password.ts) - openssl rand -base64 24 clears both.
adminBootstrap:
  enabled: true
  remoteSecretKey: platform/oneuptime
  emailProperty: admin-email
  nameProperty: admin-name
  passwordProperty: admin-password

externalSecrets:
  kind: ClusterSecretStore
  name: vault
  refreshInterval: 1h
  creationPolicy: Orphan

# templates/db-password.yaml: this chart's own copy of the shared postgres
# cluster's "oneuptime" role password (Secrets are namespace-scoped, so a
# cross-namespace consumer needs its own ExternalSecret pulling the same
# Vault property - same pattern as lamp-immich's own database: block).
# Mirrors apps/homelab/platform/postgres's rolePasswordSources.oneuptime -
# both must agree on the one Vault property.
database:
  passwordSecret:
    name: postgres-oneuptime-password
    remoteSecretKey: postgres
    remoteSecretProperty: users.oneuptime.password
