{{- if .Values.slackSecret.enabled }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: oneuptime-slack
spec:
  refreshInterval: "{{ .Values.externalSecrets.refreshInterval }}"
  secretStoreRef:
    kind: "{{ .Values.externalSecrets.kind }}"
    name: "{{ .Values.externalSecrets.name }}"
  target:
    name: oneuptime-slack
    creationPolicy: "{{ .Values.externalSecrets.creationPolicy }}"
  data:
    - secretKey: clientSecret
      remoteRef:
        key: {{ .Values.slackSecret.remoteSecretKey }}
        property: {{ .Values.slackSecret.clientSecretProperty }}
    - secretKey: signingSecret
      remoteRef:
        key: {{ .Values.slackSecret.remoteSecretKey }}
        property: {{ .Values.slackSecret.signingSecretProperty }}
{{- end }}
