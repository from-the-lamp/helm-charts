{{- if .Values.emailSecret.enabled }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: oneuptime-email
spec:
  refreshInterval: "{{ .Values.externalSecrets.refreshInterval }}"
  secretStoreRef:
    kind: "{{ .Values.externalSecrets.kind }}"
    name: "{{ .Values.externalSecrets.name }}"
  target:
    name: oneuptime-email
    creationPolicy: "{{ .Values.externalSecrets.creationPolicy }}"
  data:
    - secretKey: smtpPassword
      remoteRef:
        key: {{ .Values.emailSecret.remoteSecretKey }}
        property: {{ .Values.emailSecret.passwordProperty }}
{{- end }}
