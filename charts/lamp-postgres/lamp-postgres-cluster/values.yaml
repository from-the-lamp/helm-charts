cluster:
  mode: standalone
  type: postgresql
  fullnameOverride: postgres
  cluster:
    instances: 1
    logLevel: info
    primaryUpdateStrategy: unsupervised
    postgresql:
      parameters:
        max_connections: "1000"
        shared_buffers: 256MB
        pg_stat_statements.max: '10000'
        pg_stat_statements.track: all
        auto_explain.log_min_duration: '10s'
      pg_hba: []
        # - "host all all 10.244.0.0/16 md5"
    storage:
      size: 10Gi
      storageClass: local-path
    walStorage:
      size: 1Gi
      storageClass: local-path
    monitoring:
      enabled: true
      podMonitor:
        enabled: true
      prometheusRule:
        excludeRules:
          - CNPGClusterHAWarning
          - CNPGClusterHACritical
    enableSuperuserAccess: true
    superuserSecret: postgres-superuser
    superuser:
      username: postgres
      password:
        key: postgres-superuser-password
        property: pass

    databases: []
      # - name: example
      #   owner: example
      #   publication:
      #     enabled: true
      #     allTables: true

    # Only real CNPG Role CRD fields belong here - passwordSecret.name must
    # match a key in rolePasswordSources below (enforced by
    # templates/passwords.yaml, which generates the ExternalSecret from
    # there instead). Previously this list also carried
    # passwordSecret.remoteSecretKey/remoteSecretProperty directly - those
    # aren't part of CNPG's schema, and toYaml-ing this list straight into
    # the live Cluster CR made every server-side-diff dry-run fail with
    # "field not declared in schema", stuck at ArgoCD Sync Status: Unknown
    # for the whole app (confirmed live 2026-11-14, FTL - postgres/hindsight
    # rollout).
    roles: []
      # - name: example
      #   ensure: present
      #   login: true
      #   superuser: false
      #   connectionLimit: -1
      #   inherit: true
      #   passwordSecret:
      #     name: postgres-example-password

  poolers:
    - name: rw
      type: rw
      poolMode: transaction
      instances: 1
      parameters:
        max_client_conn: "1000"
        default_pool_size: "25"
      monitoring:
        enabled: true
        podMonitor:
          enabled: true
      template: {}

  backups:
    enabled: false
    method: plugin
    pluginConfiguration:
      name: barman-cloud.cloudnative-pg.io
    provider: s3
    endpointURL: ""
    s3:
      region: ""
      bucket: ""
      path: "/"
    secret:
      create: false
      name: ""
    retentionPolicy: 30d
    scheduledBackups:
      - name: daily-backup
        schedule: "0 0 0 * * *"
        backupOwnerReference: self
        method: plugin
        pluginConfiguration:
          name: barman-cloud.cloudnative-pg.io

backupCredentials:
  remoteSecretKey: s3
  accessKeyProperty: backblaze.from-the-lamp.id
  secretKeyProperty: backblaze.from-the-lamp.secret

# Vault source for each cluster.cluster.roles[].passwordSecret, keyed by
# role name - kept out of the roles list itself so it never reaches the
# live Cluster CR (see the comment on roles: above).
rolePasswordSources: {}
  # example:
  #   key: postgres-example-password
  #   property: password

externalSecrets:
  kind: ClusterSecretStore
  name: "" #
  refreshInterval: 1h
  creationPolicy: Orphan
