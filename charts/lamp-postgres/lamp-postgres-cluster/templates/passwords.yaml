{{- range $key, $val := .Values.cluster.cluster.roles }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .passwordSecret.name }}
spec:
  refreshInterval: "{{ $.Values.externalSecrets.refreshInterval }}"
  secretStoreRef:
    kind: "{{ $.Values.externalSecrets.kind }}"
    name: "{{ $.Values.externalSecrets.name }}"
  target:
    name: {{ .passwordSecret.name }}
    creationPolicy: "{{ $.Values.externalSecrets.creationPolicy }}"
    template:
      data:
        username: {{ .name }}
        password: "{{`{{ .password }}`}}"
  data:
  - secretKey: password
    remoteRef:
      {{- $src := index $.Values.rolePasswordSources .name }}
      {{- if not $src }}{{ fail (printf "lamp-postgres-cluster: role %q has no matching entry in rolePasswordSources" .name) }}{{ end }}
      key: "{{ $src.key }}"
      property: "{{ $src.property }}"
{{- end }}
