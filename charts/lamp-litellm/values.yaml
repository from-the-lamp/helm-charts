externalSecrets:
  kind: ClusterSecretStore
  name: vault
  refreshInterval: 1h
  creationPolicy: Orphan

metrics:
  enabled: false

# All litellm secrets live as properties of a single Oracle Vault secret
# (remoteRef.key below) - one JSON object with a field per property.
masterKey:
  secretName: litellm-masterkey
  remoteRef:
    key: litellm
    property: master_key

# Backs litellm's native chatgpt/ provider (litellm/llms/chatgpt, in-tree
# since v1.105.0 - no custom provider code needed). The PVC name is kept
# identical to the previous custom-bridge setup's PVC on purpose: the
# already-authenticated ChatGPT OAuth session living on that volume carries
# forward, so switching providers doesn't require a fresh device-code login.
chatgptAuthPersistence:
  pvcName: litellm-codex-auth-persistent
  size: 64Mi
  storageClass: hcloud-volumes

imagePullSecret:
  secretName: litellm-image-pull
  registry: registry.gitlab.com/from-the-lamp
  username: token
  remoteKey: gitlab
  remoteProperty: image-pull-secret

# Models served through litellm's native ChatGPT Plus/Pro OAuth provider.
chatgptModels:
  - gpt-5.6-sol
  - gpt-5.6-terra
  - gpt-5.6-luna

# Cheap delegation/worker models served directly off the DeepSeek API. To
# enable: point deepseekApiKey.remoteRef at wherever the key lives in Vault
# and list the model ids here - each becomes `deepseek/<model>` in litellm's
# model_list.
deepseekApiKey:
  secretName: litellm-deepseek
  remoteRef:
    key: litellm
    property: deepseek_api_key
deepseekModels:
  - deepseek-v4-flash

# Anthropic Claude models via a direct API key (platform/litellm vault
# secret, property claude_api_token - ~$100/mo of API credit). Same shape
# as deepseekApiKey/deepseekModels: each entry becomes `anthropic/<model>`
# in litellm's model_list.
claudeApiKey:
  secretName: litellm-claude
  remoteRef:
    key: litellm
    property: claude_api_token
claudeModels:
  - claude-opus-5
  - claude-sonnet-5
  - claude-haiku-4-5-20251001

# Google AI Studio (Gemini) API key - free tier, image generation only.
# litellm's native gemini/ provider (AI-Studio-backed, not vertex_ai/) wires
# imagen-4.0-generate-001 straight into /v1/images/generations; it is the
# only configured provider in this chart that can serve an image request -
# chatgptModels' chatgpt/ provider only exposes /chat/completions and
# /responses, and none of claudeModels/deepseekModels do image generation at
# all. Same shape as claudeApiKey/claudeModels, but each entry becomes
# `gemini/<model>` tagged model_info.mode: image_generation so litellm only
# ever routes an image request to it, never a chat completion.
geminiApiKey:
  secretName: litellm-gemini
  remoteRef:
    key: litellm
    property: gemini_api_key
geminiImageModels:
  - imagen-4.0-generate-001

# Explicit cross-provider fallbacks, additive to the chatgptModels sibling
# fallback below - litellm's router tries each listed target, in order, if
# the key model's call fails (rate limit, outage, etc). claude-sonnet-5 is
# Kelos's primary model; gpt-5.6-terra is the fallback if Anthropic is down.
modelFallbacks:
  claude-sonnet-5:
    - gpt-5.6-terra

# Appended to the END of every fallback chain generated above (both the
# chatgptModels sibling mesh and modelFallbacks) - a last-resort model tried
# only once every other configured fallback has already failed. Kept
# separate from chatgptModels/modelFallbacks rather than listing a local
# model there directly: chatgptModels' model_list loop assumes a native
# chatgpt/ provider, so a local-server model listed there would be routed
# through the wrong provider instead of lmstudioModels' openai/ + api_base.
fallbackTail: []

# Audio transcription (Whisper) via Groq - same shape as deepseekApiKey/
# deepseekModels above, each becomes `groq/<model>` in litellm's model_list
# with model_info.mode: audio_transcription.
groqApiKey:
  secretName: litellm-groq
  remoteRef:
    key: litellm
    property: groq_api_key
whisperModels:
  - whisper-large-v3

# A local LM Studio instance (OpenAI-compatible server) reached over
# Tailscale instead of a cloud provider - no API key needed/possible, so
# unlike deepseekModels/claudeModels this has no *ApiKey sibling. Each
# entry becomes `openai/<model>` in litellm's model_list with api_base set
# to lmstudioApiBase. The model id must match exactly what LM Studio's own
# Local Server tab shows as loaded - litellm forwards it as-is.
lmstudioApiBase: ""
lmstudioModels: []

proxyConfigMap:
  name: litellm-proxy-config
  key: config.yaml

litellm-helm:
  environmentSecrets:
    - litellm-deepseek
    - litellm-groq
    - litellm-claude
    - litellm-gemini

  image:
    repository: registry.gitlab.com/from-the-lamp/infra/docker-images/lamp-litellm
    tag: "1.0.11"
    pullPolicy: Always

  imagePullSecrets:
    - name: litellm-image-pull

  replicaCount: 1

  strategy:
    type: Recreate

  deploymentAnnotations:
    reloader.stakater.com/auto: "true"

  masterkeySecretName: litellm-masterkey
  masterkeySecretKey: masterkey

  db:
    deployStandalone: false
    useExisting: false

  migrationJob:
    enabled: false

  service:
    type: ClusterIP
    port: 4000

  envVars:
    CHATGPT_TOKEN_DIR: /var/lib/litellm/chatgpt-auth
    CHATGPT_AUTH_FILE: chatgpt-auth.json

  # One-time, idempotent migration of the already-authenticated OAuth
  # session from the previous custom bridge's nested auth.json shape
  # ({"tokens": {...}}) to the flat shape litellm's native chatgpt provider
  # expects. Runs on every pod start; no-ops once chatgpt-auth.json exists.
  extraInitContainers:
    - name: migrate-chatgpt-auth
      image: ghcr.io/berriai/litellm:v1.106.4
      command:
        - python3
        - -c
        - |
          import json, os

          token_dir = "/var/lib/litellm/chatgpt-auth"
          old_file = os.path.join(token_dir, "auth.json")
          new_file = os.path.join(token_dir, "chatgpt-auth.json")

          if os.path.exists(new_file):
              print("chatgpt-auth.json already present, nothing to migrate")
          elif os.path.exists(old_file):
              with open(old_file) as f:
                  nested = json.load(f)
              tokens = nested.get("tokens", {})
              flat = {
                  "access_token": tokens.get("access_token"),
                  "refresh_token": tokens.get("refresh_token"),
                  "id_token": tokens.get("id_token"),
              }
              if flat["access_token"] and flat["refresh_token"]:
                  with open(new_file, "w") as f:
                      json.dump(flat, f)
                  os.chmod(new_file, 0o600)
                  print("migrated nested auth.json -> flat chatgpt-auth.json")
              else:
                  print("old auth.json missing required fields, skipping migration")
          else:
              print("no existing session found, native provider will require a device-code login")
      volumeMounts:
        - name: chatgpt-auth-persistent
          mountPath: /var/lib/litellm/chatgpt-auth

  volumes:
    - name: chatgpt-auth-persistent
      persistentVolumeClaim:
        claimName: litellm-codex-auth-persistent
  volumeMounts:
    - name: chatgpt-auth-persistent
      mountPath: /var/lib/litellm/chatgpt-auth

  resources:
    requests:
      cpu: 100m
      memory: 1280Mi
    limits:
      memory: 3Gi

  proxyConfigMap:
    create: false
    name: litellm-proxy-config
    key: config.yaml
