apiVersion: v2
name: lamp-litellm
version: 0.9.1

dependencies:
  - name: litellm-helm
    version: 1.83.14-stable.patch.2
    repository: oci://ghcr.io/berriai

annotations:
  notes: "chatgptModels no longer includes gpt-5.6-sol by default - confirmed live via litellm router logs that OpenAI's Codex/ChatGPT backend rejects it unconditionally (ChatgptException model_not_found, subreason model_not_in_accessible_catalog) regardless of account/cooldown state, so it only ever added a guaranteed-to-fail hop to gpt-5.6-terra's own fallback chain. New openrouterApiKey/openrouterModels[] list (default []) adds OpenRouter models to model_list as model: openrouter/<model>, new ExternalSecret litellm-openrouter (remoteRef property openrouter.api_key) - requires that property to exist in Vault's platform/litellm secret before upgrading, otherwise the ExternalSecret just fails to sync (no impact on an existing deployment that leaves openrouterModels empty). New groqChatModels[] list (default []) adds Groq chat-completion models to model_list, each as model: groq/<model> reusing the existing groqApiKey/GROQ_API_KEY wiring whisperModels already relies on - no action needed for an existing deployment, groqChatModels defaults to empty. chatgptModels/chatgptAccounts[] now support more than one ChatGPT OAuth session via chatgptAccountMode (single/balancer/fallback) and litellm_params.chatgpt_auth_file per account; the migrate-chatgpt-auth init container's script moved into a new litellm-chatgpt-migrate ConfigMap, generated from chatgptAccounts instead of being hardcoded in values.yaml - no action needed for an existing single-account deployment, chatgptAccounts defaults to the same primary account/paths as before."
