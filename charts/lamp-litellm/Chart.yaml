apiVersion: v2
name: lamp-litellm
version: 0.5.5

dependencies:
  - name: litellm-helm
    version: 1.83.14-stable.patch.2
    repository: oci://ghcr.io/berriai

annotations:
  notes: "router_settings: allowed_fails: 1 / cooldown_time: 300s, so a deployment that fails on credit exhaustion or a usage-limit window stops being retried on every request and the router goes straight to its fallback, auto-recovering after 5 minutes without a pod restart."
