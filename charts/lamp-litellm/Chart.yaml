apiVersion: v2
name: lamp-litellm
version: 0.6.1

dependencies:
  - name: litellm-helm
    version: 1.83.14-stable.patch.2
    repository: oci://ghcr.io/berriai

annotations:
  notes: "LITELLM_SALT_KEY from Vault (saltKey, property salt_key - must exist before upgrading), LITELLM_MODE=PRODUCTION, JSON logs at WARNING level, router enable_pre_call_checks, localOpenAICompatibleServers[].maxInputTokens to declare each local server's context window, and claudeApiKey/claudeModels replaced by a claudeApiKeys[] list (multiple Anthropic keys load-balanced per model via router_settings.routing_strategy: simple-shuffle) - requires platform/litellm's flat claude_api_token property to be migrated to a nested claude_api.<name> object in Vault before upgrading."
