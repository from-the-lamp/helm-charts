apiVersion: v2
name: lamp-litellm
version: 0.7.0

dependencies:
  - name: litellm-helm
    version: 1.83.14-stable.patch.2
    repository: oci://ghcr.io/berriai

annotations:
  notes: "chatgptModels/chatgptAccounts[] now support more than one ChatGPT OAuth session via chatgptAccountMode (single/balancer/fallback) and litellm_params.chatgpt_auth_file per account; the migrate-chatgpt-auth init container's script moved into a new litellm-chatgpt-migrate ConfigMap, generated from chatgptAccounts instead of being hardcoded in values.yaml - no action needed for an existing single-account deployment, chatgptAccounts defaults to the same primary account/paths as before."
