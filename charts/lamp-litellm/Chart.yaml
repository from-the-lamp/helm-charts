apiVersion: v2
name: lamp-litellm
version: 0.5.6

dependencies:
  - name: litellm-helm
    version: 1.83.14-stable.patch.2
    repository: oci://ghcr.io/berriai

annotations:
  notes: "Claude deployments cool down on repeated 400s (allowed_fails_policy.BadRequestErrorAllowedFails: 2), which is how Anthropic reports exhausted credit; rolling update instead of Recreate, 5s liveness/readiness probe timeouts, allow_requests_on_db_unavailable, OTLP traces over HTTP (4318), and the chatgpt auth init container hands the token dir to uid 10001 so the non-root image can read it."
