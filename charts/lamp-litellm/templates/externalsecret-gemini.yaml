{{- if .Values.geminiApiKey }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.geminiApiKey.secretName }}
spec:
  refreshInterval: "{{ .Values.externalSecrets.refreshInterval }}"
  secretStoreRef:
    kind: "{{ .Values.externalSecrets.kind }}"
    name: "{{ .Values.externalSecrets.name }}"
  target:
    name: {{ .Values.geminiApiKey.secretName }}
    creationPolicy: "{{ .Values.externalSecrets.creationPolicy }}"
  data:
  - secretKey: GEMINI_API_KEY
    remoteRef:
      {{- include "lamp-litellm.remoteRef" (merge (dict "name" "geminiApiKey") .Values.geminiApiKey.remoteRef) | nindent 6 }}
{{- end }}
