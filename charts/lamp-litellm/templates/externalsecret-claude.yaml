{{- range $key := .Values.claudeApiKeys }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $key.secretName }}
spec:
  refreshInterval: "{{ $.Values.externalSecrets.refreshInterval }}"
  secretStoreRef:
    kind: "{{ $.Values.externalSecrets.kind }}"
    name: "{{ $.Values.externalSecrets.name }}"
  target:
    name: {{ $key.secretName }}
    creationPolicy: "{{ $.Values.externalSecrets.creationPolicy }}"
  data:
  - secretKey: {{ $key.envVar }}
    remoteRef:
      {{- include "lamp-litellm.remoteRef" (merge (dict "name" (printf "claudeApiKeys[%s]" $key.name)) $key.remoteRef) | nindent 6 }}
{{- end }}
