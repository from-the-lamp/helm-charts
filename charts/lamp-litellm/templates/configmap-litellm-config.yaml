apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.proxyConfigMap.name }}
data:
  {{ .Values.proxyConfigMap.key }}: |
    model_list:
      {{- range $model := .Values.chatgptModels }}
      - model_name: {{ $model }}
        litellm_params:
          model: chatgpt/{{ $model }}
          # The ChatGPT/Codex OAuth backend rejects any request carrying a
          # system-role input item (400 "System messages are not allowed")
          # - a bug in litellm's chatgpt provider, fixed upstream for
          # plain-string system messages but not yet for Anthropic-style
          # content-block system prompts (BerriAI/litellm#48562, as of
          # v1.108.3). Caller-side callers like Claude Code's Anthropic-
          # messages passthrough always send a system prompt, so without
          # this override every one of these models 400s on its very
          # first request. supports_system_message: false makes litellm
          # fold the system content into a user message instead of a
          # rejected system/developer input item - a general litellm
          # model setting, independent of the chatgpt-provider-specific
          # fix still pending upstream.
          supports_system_message: false
      {{- end }}
      {{- range $model := .Values.deepseekModels }}
      - model_name: {{ $model }}
        litellm_params:
          model: deepseek/{{ $model }}
          api_key: os.environ/DEEPSEEK_API_KEY
      {{- end }}
      {{- range $model := .Values.claudeModels }}
      - model_name: {{ $model }}
        litellm_params:
          model: anthropic/{{ $model }}
          api_key: os.environ/ANTHROPIC_API_KEY
      {{- end }}
      {{- range $model := .Values.whisperModels }}
      - model_name: {{ $model }}
        litellm_params:
          model: groq/{{ $model }}
          api_key: os.environ/GROQ_API_KEY
        model_info:
          mode: audio_transcription
      {{- end }}
      {{- range $model := .Values.lmstudioModels }}
      - model_name: {{ $model }}
        litellm_params:
          model: openai/{{ $model }}
          api_base: {{ $.Values.lmstudioApiBase }}
          api_key: "not-needed"
      {{- end }}
      {{- range $model := .Values.geminiImageModels }}
      - model_name: {{ $model }}
        litellm_params:
          model: gemini/{{ $model }}
          api_key: os.environ/GEMINI_API_KEY
        model_info:
          mode: image_generation
      {{- end }}
    router_settings:
      routing_strategy: simple-shuffle
      num_retries: 2
      timeout: 120
      fallbacks:
        {{- range $model := .Values.chatgptModels }}
        - {{ $model }}:
            {{- range $other := $.Values.chatgptModels }}
            {{- if ne $other $model }}
            - {{ $other }}
            {{- end }}
            {{- end }}
            {{- range $tail := $.Values.fallbackTail }}
            - {{ $tail }}
            {{- end }}
        {{- end }}
        {{- range $model, $targets := .Values.modelFallbacks }}
        - {{ $model }}:
            {{- range $target := $targets }}
            - {{ $target }}
            {{- end }}
            {{- range $tail := $.Values.fallbackTail }}
            - {{ $tail }}
            {{- end }}
        {{- end }}
    litellm_settings:
      drop_params: true
      {{- if .Values.metrics.enabled }}
      callbacks: ["prometheus"]
      service_callback: ["prometheus_system"]
      require_auth_for_metrics_endpoint: false
      {{- end }}
    general_settings:
      master_key: os.environ/PROXY_MASTER_KEY
