apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.proxyConfigMap.name }}
data:
  {{ .Values.proxyConfigMap.key }}: |
    model_list:
      {{- range $model := .Values.chatgptModels }}
      - model_name: {{ $model }}
        litellm_params:
          model: chatgpt/{{ $model }}
          # The ChatGPT/Codex OAuth backend rejects any request carrying a
          # system-role input item (400 "System messages are not allowed")
          # - a bug in litellm's chatgpt provider, fixed upstream for
          # plain-string system messages but not yet for Anthropic-style
          # content-block system prompts (BerriAI/litellm#48562, as of
          # v1.108.3). Caller-side callers like Claude Code's Anthropic-
          # messages passthrough always send a system prompt, so without
          # this override every one of these models 400s on its very
          # first request. supports_system_message: false makes litellm
          # fold the system content into a user message instead of a
          # rejected system/developer input item - a general litellm
          # model setting, independent of the chatgpt-provider-specific
          # fix still pending upstream.
          supports_system_message: false
      {{- end }}
      {{- range $model := .Values.deepseekModels }}
      - model_name: {{ $model }}
        litellm_params:
          model: deepseek/{{ $model }}
          api_key: os.environ/DEEPSEEK_API_KEY
      {{- end }}
      {{- range $model := .Values.claudeModels }}
      {{- range $key := $.Values.claudeApiKeys }}
      - model_name: {{ $model }}
        litellm_params:
          model: anthropic/{{ $model }}
          api_key: os.environ/{{ $key.envVar }}
        model_info:
          allowed_fails_policy:
            BadRequestErrorAllowedFails: 2
      {{- end }}
      {{- end }}
      {{- range $model := .Values.whisperModels }}
      - model_name: {{ $model }}
        litellm_params:
          model: groq/{{ $model }}
          api_key: os.environ/GROQ_API_KEY
        model_info:
          mode: audio_transcription
      {{- end }}
      {{- range $server := .Values.localOpenAICompatibleServers }}
      {{- range $model := $server.models }}
      - model_name: {{ $model }}
        litellm_params:
          model: openai/{{ $model }}
          api_base: {{ $server.apiBase }}
          api_key: "not-needed"
        {{- if $server.maxInputTokens }}
        model_info:
          max_input_tokens: {{ $server.maxInputTokens }}
        {{- end }}
      {{- end }}
      {{- end }}
      {{- range $model := .Values.geminiImageModels }}
      - model_name: {{ $model }}
        litellm_params:
          model: gemini/{{ $model }}
          api_key: os.environ/GEMINI_API_KEY
        model_info:
          mode: image_generation
      {{- end }}
    router_settings:
      routing_strategy: simple-shuffle
      enable_weighted_failover: true
      num_retries: 2
      timeout: 120
      # 2026-11-14 incident: Anthropic credit exhaustion and the ChatGPT
      # plan's own usage-limit window are not transient - once a model
      # starts failing this way it stays broken anywhere from tens of
      # minutes (observed resets_in_seconds ~3864 on the ChatGPT side) to
      # indefinitely (Anthropic credits need a manual top-up). Without a
      # cooldown, every single request pays the full num_retries: 2 cost
      # against the known-dead model before ever reaching its fallback -
      # confirmed live: three separate Kelos remediation Jobs each
      # independently re-discovered the same claude-sonnet-5 failure.
      # allowed_fails: 1 trips cooldown on the 2nd failure - within the
      # same request's own retries, so the very next request already
      # skips straight to the fallback. cooldown_time: 300 (5 min) is a
      # deliberate middle ground: short enough that a genuinely transient
      # blip self-heals within minutes without needing a pod restart, long
      # enough that a real multi-hour outage only costs one wasted call
      # every 5 minutes instead of on every single request.
      allowed_fails: 1
      cooldown_time: 300
      enable_pre_call_checks: true
      fallbacks:
        {{- range $model := .Values.chatgptModels }}
        - {{ $model }}:
            {{- range $other := $.Values.chatgptModels }}
            {{- if ne $other $model }}
            - {{ $other }}
            {{- end }}
            {{- end }}
            {{- if hasKey $.Values.modelFallbacks $model }}
            {{- range $target := index $.Values.modelFallbacks $model }}
            - {{ $target }}
            {{- end }}
            {{- end }}
            {{- range $tail := $.Values.fallbackTail }}
            - {{ $tail }}
            {{- end }}
        {{- end }}
        {{- range $model, $targets := .Values.modelFallbacks }}
        {{- if not (has $model $.Values.chatgptModels) }}
        - {{ $model }}:
            {{- range $target := $targets }}
            - {{ $target }}
            {{- end }}
            {{- range $tail := $.Values.fallbackTail }}
            - {{ $tail }}
            {{- end }}
        {{- end }}
        {{- end }}
    litellm_settings:
      drop_params: true
      {{- $callbacks := list }}
      {{- if .Values.metrics.enabled }}
      {{- $callbacks = append $callbacks "prometheus" }}
      {{- end }}
      {{- if .Values.otel.enabled }}
      {{- $callbacks = append $callbacks "otel" }}
      {{- end }}
      {{- if $callbacks }}
      callbacks: {{ $callbacks | toJson }}
      {{- end }}
      {{- if .Values.metrics.enabled }}
      service_callback: ["prometheus_system"]
      require_auth_for_metrics_endpoint: false
      {{- end }}
    general_settings:
      master_key: os.environ/PROXY_MASTER_KEY
      {{- if .Values.postgres.enabled }}
      store_model_in_db: true
      allow_requests_on_db_unavailable: true
      {{- end }}
