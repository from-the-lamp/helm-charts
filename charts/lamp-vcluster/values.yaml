# Off by default - the consumer app turns it on and names the target
# namespace/secret once it actually wires up exportKubeConfig.additionalSecrets.
kubeconfigExport:
  enabled: false
  namespace: ""
  secretName: ""

vcluster:
  telemetry:
    enabled: false

  controlPlane:
    statefulSet:
      image:
        # Pure OSS build instead of the chart default vcluster-pro image -
        # no licensed/pro features needed.
        repository: "loft-sh/vcluster-oss"
