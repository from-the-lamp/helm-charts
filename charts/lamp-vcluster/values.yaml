# Off by default - the consumer app turns it on once it actually wires up
# exportKubeConfig.additionalSecrets (same namespace as this release) and
# wants that secret mirrored into another namespace. See
# templates/kubeconfig-copier.yaml for why this is a narrowly-RBAC'd copy
# job instead of granting vcluster's own controller cross-namespace access.
kubeconfigCopier:
  enabled: false
  sourceSecretName: ""
  targetNamespace: ""
  targetSecretName: ""
  schedule: "*/10 * * * *"
  image:
    repository: bitnamilegacy/kubectl
    tag: "1.33.4"

vcluster:
  telemetry:
    enabled: false

  controlPlane:
    statefulSet:
      image:
        # Pure OSS build instead of the chart default vcluster-pro image -
        # no licensed/pro features needed.
        repository: "loft-sh/vcluster-oss"
