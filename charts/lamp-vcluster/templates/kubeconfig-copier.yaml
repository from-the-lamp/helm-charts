{{- if .Values.kubeconfigCopier.enabled }}
# Replicates the admin kubeconfig Secret vcluster exports into its own
# Release.Namespace (exportKubeConfig.additionalSecrets, no extra RBAC
# needed there - the chart's own vc-<release> Role already covers it) into
# a Secret with the same name in the Toolhive namespace, so an MCPServer
# there can mount it.
#
# Deliberately NOT done by pointing exportKubeConfig.additionalSecrets at
# the Toolhive namespace directly: that makes vcluster's own controller
# open a multi-namespace watch there, and controller-runtime caches every
# GVK it manages (pods, services, secrets, configmaps, ...) across every
# namespace it touches - confirmed against a live cluster, the pod logged
# "cannot list resource \"services\"/\"pods\" in namespace \"toolhive\"".
# Granting that would mean this scratch vcluster's host identity could
# list/watch every Secret in Toolhive (every other MCP server's
# credentials), not just read the one it needs - the opposite of the
# isolation this app exists for. A narrowly RBAC'd one-way copier avoids
# that entirely: get on exactly one named secret as source, create/update
# on exactly one named secret as target, nothing else.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}-kubeconfig-copier
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Release.Name }}-kubeconfig-copier-source
  namespace: {{ .Release.Namespace }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["{{ .Values.kubeconfigCopier.sourceSecretName }}"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Release.Name }}-kubeconfig-copier-source
  namespace: {{ .Release.Namespace }}
subjects:
  - kind: ServiceAccount
    name: {{ .Release.Name }}-kubeconfig-copier
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: {{ .Release.Name }}-kubeconfig-copier-source
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Release.Name }}-kubeconfig-copier-target
  namespace: {{ .Values.kubeconfigCopier.targetNamespace }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["{{ .Values.kubeconfigCopier.targetSecretName }}"]
    verbs: ["get", "update", "patch"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Release.Name }}-kubeconfig-copier-target
  namespace: {{ .Values.kubeconfigCopier.targetNamespace }}
subjects:
  - kind: ServiceAccount
    name: {{ .Release.Name }}-kubeconfig-copier
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: {{ .Release.Name }}-kubeconfig-copier-target
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ .Release.Name }}-kubeconfig-copier
spec:
  schedule: {{ .Values.kubeconfigCopier.schedule | quote }}
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: Never
          serviceAccountName: {{ .Release.Name }}-kubeconfig-copier
          containers:
            - name: copier
              # renovate: datasource=docker depName=bitnamilegacy/kubectl
              image: "{{ .Values.kubeconfigCopier.image.repository }}:{{ .Values.kubeconfigCopier.image.tag }}"
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
              # Explicit and small - the consumer's own ResourceQuota is
              # sized for vcluster's control plane, with little headroom
              # left for LimitRange's defaults (8Gi ephemeral-storage per
              # container) to fall back on; confirmed live, the first
              # version of this Job without explicit resources was
              # rejected by the quota before a pod could even schedule.
              resources:
                requests:
                  cpu: 25m
                  memory: 32Mi
                  ephemeral-storage: 64Mi
                limits:
                  cpu: 100m
                  memory: 128Mi
                  ephemeral-storage: 256Mi
              command: ["/bin/sh", "-euc"]
              args:
                - |
                  config=$(kubectl get secret {{ .Values.kubeconfigCopier.sourceSecretName }} \
                    -n {{ .Release.Namespace }} -o jsonpath='{.data.config}' | base64 -d)
                  kubectl create secret generic {{ .Values.kubeconfigCopier.targetSecretName }} \
                    -n {{ .Values.kubeconfigCopier.targetNamespace }} \
                    --from-literal=config="$config" \
                    --dry-run=client -o yaml | kubectl apply -f -
{{- end }}
