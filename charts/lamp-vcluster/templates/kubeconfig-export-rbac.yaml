{{- if .Values.kubeconfigExport.enabled }}
# vcluster's own RBAC (_rbac.tpl) only grants its host ServiceAccount
# (vc-<release>) write access to Secrets in Release.Namespace. Writing the
# exported admin kubeconfig into another namespace (so toolhive's MCPServer
# can mount it) needs this namespace's own grant - confirmed against
# upstream vcluster v0.37.7 source, no chart-provided RBAC covers it.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Release.Name }}-kubeconfig-export
  namespace: {{ .Values.kubeconfigExport.namespace }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["{{ .Values.kubeconfigExport.secretName }}"]
    verbs: ["get", "update", "patch"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Release.Name }}-kubeconfig-export
  namespace: {{ .Values.kubeconfigExport.namespace }}
subjects:
  - kind: ServiceAccount
    name: vc-{{ .Release.Name }}
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: {{ .Release.Name }}-kubeconfig-export
  apiGroup: rbac.authorization.k8s.io
{{- end }}
