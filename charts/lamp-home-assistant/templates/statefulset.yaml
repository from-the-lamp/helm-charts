apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "home-assistant.fullname" . }}
  annotations:
    reloader.stakater.com/auto: "true"
  labels:
    {{- include "home-assistant.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "home-assistant.fullname" . }}
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "home-assistant.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "home-assistant.selectorLabels" . | nindent 8 }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
    {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
    {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- if .Values.configuration.http.trusted_proxies }}
      initContainers:
        - name: http-storage-seed
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          env:
            - name: TRUSTED_PROXIES_JSON
              value: {{ .Values.configuration.http.trusted_proxies | toJson | quote }}
            - name: USE_X_FORWARDED_FOR
              value: {{ .Values.configuration.http.use_x_forwarded_for | toString | quote }}
          command: ["python3", "-c"]
          args:
            - |
              import json, os, sys

              path = "/config/.storage/http"

              try:
                  if not os.path.exists(path):
                      print("no .storage/http yet - first boot will migrate HTTP config from YAML")
                      sys.exit(0)

                  with open(path) as f:
                      doc = json.load(f)

                  stable = doc["data"]["stable"]
                  stable["trusted_proxies"] = json.loads(os.environ["TRUSTED_PROXIES_JSON"])
                  stable["use_x_forwarded_for"] = os.environ["USE_X_FORWARDED_FOR"] == "true"
                  doc["data"]["pending"] = None
                  doc["data"]["yaml_migration_done"] = True

                  tmp = path + ".tmp"
                  with open(tmp, "w") as f:
                      json.dump(doc, f)
                  os.replace(tmp, path)
                  print("patched .storage/http stable http config")
              except Exception as exc:
                  print(f"could not patch .storage/http, leaving it untouched: {exc}")
          volumeMounts:
          - mountPath: /config
            name: {{ include "home-assistant.fullname" . }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.envFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.env }}
          env:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: 8123
              protocol: TCP
          {{- if .Values.additionalPorts }}
            {{- .Values.additionalPorts | toYaml | nindent 12 }}
          {{- end }}
          livenessProbe:
            httpGet:
              path: /
              port: http
          readinessProbe:
            httpGet:
              path: /
              port: http
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
          - mountPath: /config
            name: {{ include "home-assistant.fullname" . }}
          - name: configuration-yaml
            mountPath: /config/configuration.yaml
            subPath: configuration
          - name: lovelace-yaml
            mountPath: /config/ui-lovelace.yaml
            subPath: lovelace
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
    {{- end }}
    {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
    {{- end }}
      volumes:
      - name: configuration-yaml
        configMap:
          name: {{ .Release.Name }}-configuration
      - name: lovelace-yaml
        configMap:
          name: {{ .Release.Name }}-lovelace
  volumeClaimTemplates:
  - metadata:
      name: {{ include "home-assistant.fullname" . }}
    spec:
      accessModes:
        - {{ .Values.persistence.accessMode }}
      {{- if .Values.persistence.existingVolume }}
      volumeName: {{ .Values.persistence.existingVolume }}
      {{- end }}
      resources:
        requests:
          storage: {{ .Values.persistence.size }}
      {{- if .Values.persistence.storageClass }}
      storageClassName: {{ .Values.persistence.storageClass }}
      {{- end }}
