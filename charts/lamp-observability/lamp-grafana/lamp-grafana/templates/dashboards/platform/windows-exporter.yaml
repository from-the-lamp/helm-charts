        {
          "id": 118,
          "type": "timeseries",
          "title": "Available & Cache Bytes",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 35
          },
          "datasource": { "uid": "VictoriaMetrics", "type": "prometheus" },
          "targets": [
            {
              "expr": "windows_memory_available_bytes{host=\"$host\"}",
              "legendFormat": "Available",
              "refId": "A"
            },
            {
              "expr": "windows_memory_cache_bytes{host=\"$host\"}",
              "legendFormat": "Cache",
              "refId": "B"
