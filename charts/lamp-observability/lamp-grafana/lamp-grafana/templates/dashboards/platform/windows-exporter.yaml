# Custom dashboard (no usable upstream exists on grafana.com - every
# community "windows_exporter" dashboard checked still uses the pre-0.20
# metric names like windows_cpu_time_total/windows_cs_hostname, renamed
# years ago; see git history for the research). Shares the "nodes"
# GrafanaFolder with node_exporter/smartctl_exporter (node-exporter.yaml's
# folder guard includes this toggle too) since it's the same kind of
# per-host system dashboard, just for Windows instead of Linux.
{{- if .Values.dashboards.windows_exporter.enabled }}
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: windows-exporter
spec:
  folderRef: nodes
  instanceSelector:
    matchLabels:
      dashboards: "grafana"
  json: |
    {
      "uid": "dg4etjm87kohsd",
      "title": "Windows Exporter",
      "tags": [
        "windows",
        "windows_exporter"
      ],
      "schemaVersion": 39,
      "timezone": "browser",
      "refresh": "1m",
      "time": {
        "from": "now-6h",
        "to": "now"
      },
      "templating": {
        "list": [
          {
            "name": "host",
            "label": "Host",
            "type": "query",
            "datasource": { "uid": "VictoriaMetrics", "type": "prometheus" },
            "query": {
              "query": "label_values(windows_os_info, host)",
              "refId": "StandardVariableQuery"
            },
            "refresh": 1,
            "sort": 1,
            "multi": false,
            "includeAll": false,
            "current": {}
          }
        ]
      },
      "panels": [
        {
          "id": 101,
          "type": "row",
          "title": "Overview",
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 0
          },
          "collapsed": false,
          "panels": []
        },
        {
          "id": 102,
          "type": "stat",
          "title": "CPU Usage",
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 0,
            "y": 1
          },
          "datasource": { "uid": "VictoriaMetrics", "type": "prometheus" },
          "targets": [
            {
              "expr": "100 * (1 - avg(rate(windows_cpu_time_seconds_total{mode=\"idle\", host=\"$host\"}[5m])))",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 70
                  },
                  {
                    "color": "red",
                    "value": 90
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "graphMode": "area",
            "colorMode": "value",
            "textMode": "auto"
          }
        },
        {
          "id": 103,
          "type": "stat",
          "title": "Memory Usage",
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 4,
            "y": 1
          },
          "datasource": { "uid": "VictoriaMetrics", "type": "prometheus" },
          "targets": [
            {
              "expr": "100 * (1 - windows_memory_physical_free_bytes{host=\"$host\"} / windows_memory_physical_total_bytes{host=\"$host\"})",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 80
                  },
                  {
                    "color": "red",
                    "value": 92
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "graphMode": "area",
            "colorMode": "value",
            "textMode": "auto"
          }
        },
        {
          "id": 104,
          "type": "stat",
          "title": "Busiest Disk",
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 8,
            "y": 1
          },
