        {
          "id": 124,
          "type": "table",
          "title": "Disk Space by Volume (GB)",
          "gridPos": {
            "h": 7,
            "w": 24,
            "x": 0,
            "y": 68
          },
          "datasource": { "uid": "VictoriaMetrics", "type": "prometheus" },
          "targets": [
            {
              "expr": "windows_logical_disk_size_bytes{host=\"$host\"}",
              "refId": "A",
              "format": "table",
              "instant": true
            },
            {
              "expr": "windows_logical_disk_free_bytes{host=\"$host\"}",
              "refId": "B",
              "format": "table",
              "instant": true
            }
          ],
          "transformations": [
            {
              "id": "joinByField",
              "options": {
                "byField": "volume",
                "mode": "outer"
              }
            },
            {
              "id": "calculateField",
              "options": {
                "mode": "binary",
                "binary": {
                  "left": "Value #A",
                  "operator": "-",
                  "right": "Value #B"
                },
                "alias": "Used",
                "replaceFields": false
              }
            },
            {
              "id": "organize",
              "options": {
                "excludeByName": {
                  "Time": true,
                  "instance": true,
                  "job": true,
                  "cluster": true,
                  "host": true,
                  "prometheus": true,
                  "__name__": true
                },
                "renameByName": {
                  "Value #A": "Total",
                  "Value #B": "Free",
                  "volume": "Volume"
                },
                "indexByName": {
                  "Volume": 0,
                  "Total": 1,
                  "Used": 2,
                  "Free": 3
                }
              }
            }
          ],
          "fieldConfig": {
            "defaults": {},
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "Total"
                },
                "properties": [
                  {
                    "id": "unit",
                    "value": "bytes"
                  },
                  {
                    "id": "decimals",
                    "value": 1
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "Used"
                },
                "properties": [
                  {
                    "id": "unit",
                    "value": "bytes"
                  },
                  {
                    "id": "decimals",
                    "value": 1
                  },
                  {
                    "id": "custom.cellOptions",
                    "value": {
                      "type": "color-background",
                      "mode": "gradient"
                    }
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "Free"
                },
                "properties": [
                  {
                    "id": "unit",
                    "value": "bytes"
                  },
                  {
                    "id": "decimals",
                    "value": 1
                  }
                ]
              }
            ]
          },
          "options": {
            "showHeader": true
          }
        },
        {
          "id": 125,
          "type": "timeseries",
          "title": "Logical Disk Throughput",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
