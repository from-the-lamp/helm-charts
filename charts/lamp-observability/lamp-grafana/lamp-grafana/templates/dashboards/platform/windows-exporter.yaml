            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "ops"
            },
            "overrides": []
          }
        },
        {
          "id": 114,
          "type": "row",
          "title": "Memory",
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 26
          },
          "collapsed": false,
          "panels": []
        },
        {
          "id": 115,
          "type": "timeseries",
          "title": "Physical Memory",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 27
          },
          "datasource": { "uid": "VictoriaMetrics", "type": "prometheus" },
          "targets": [
            {
              "expr": "windows_memory_physical_total_bytes{host=\"$host\"}",
              "legendFormat": "Total",
              "refId": "A"
            },
            {
              "expr": "windows_memory_physical_total_bytes{host=\"$host\"} - windows_memory_physical_free_bytes{host=\"$host\"}",
              "legendFormat": "Used",
              "refId": "B"
            },
            {
              "expr": "windows_memory_physical_free_bytes{host=\"$host\"}",
              "legendFormat": "Free",
              "refId": "C"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "bytes",
              "min": 0
            },
            "overrides": []
          }
        },
        {
          "id": 116,
          "type": "bargauge",
          "title": "Commit Charge",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 27
          },
          "datasource": { "uid": "VictoriaMetrics", "type": "prometheus" },
          "targets": [
            {
              "expr": "100 * windows_memory_committed_bytes{host=\"$host\"} / windows_memory_commit_limit_bytes{host=\"$host\"}",
              "legendFormat": "commit %",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "min": 0,
              "max": 100,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 80
                  },
                  {
                    "color": "red",
                    "value": 92
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "displayMode": "gradient",
            "orientation": "vertical",
            "showUnfilled": true,
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            }
          }
        },
        {
          "id": 117,
          "type": "timeseries",
          "title": "Committed vs Commit Limit",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 35
          },
          "datasource": { "uid": "VictoriaMetrics", "type": "prometheus" },
          "targets": [
            {
              "expr": "windows_memory_committed_bytes{host=\"$host\"}",
              "legendFormat": "Committed",
              "refId": "A"
            },
            {
              "expr": "windows_memory_commit_limit_bytes{host=\"$host\"}",
              "legendFormat": "Commit Limit",
              "refId": "B"
            }
          ],
          "fieldConfig": {
            "defaults": {
