          "targets": [
            {
              "expr": "max(100 * (1 - windows_logical_disk_free_bytes{host=\"$host\"} / windows_logical_disk_size_bytes{host=\"$host\"}))",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 80
                  },
                  {
                    "color": "red",
                    "value": 90
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "graphMode": "area",
            "colorMode": "value",
            "textMode": "auto"
          }
        },
        {
