              "refId": "C"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "ops"
            },
            "overrides": []
          }
        },
        {
          "id": 121,
          "type": "timeseries",
          "title": "Pagefile I/O /sec",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 51
          },
          "datasource": { "uid": "VictoriaMetrics", "type": "prometheus" },
          "targets": [
            {
              "expr": "rate(windows_memory_swap_page_reads_total{host=\"$host\"}[5m])",
              "legendFormat": "reads",
              "refId": "A"
            },
            {
              "expr": "rate(windows_memory_swap_page_writes_total{host=\"$host\"}[5m])",
              "legendFormat": "writes",
              "refId": "B"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "ops"
            },
            "overrides": []
          }
        },
        {
          "id": 122,
          "type": "row",
          "title": "Disk \u2014 Logical",
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 59
          },
          "collapsed": false,
          "panels": []
        },
        {
          "id": 123,
          "type": "bargauge",
          "title": "Disk Usage by Volume",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 60
          },
          "datasource": { "uid": "VictoriaMetrics", "type": "prometheus" },
          "targets": [
            {
              "expr": "100 * (1 - windows_logical_disk_free_bytes{host=\"$host\"} / windows_logical_disk_size_bytes{host=\"$host\"})",
