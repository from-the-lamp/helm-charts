        {
          "id": 109,
          "type": "row",
          "title": "CPU",
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 9
          },
          "collapsed": false,
          "panels": []
        },
        {
          "id": 110,
          "type": "timeseries",
          "title": "CPU Usage by Mode",
          "gridPos": {
            "h": 8,
