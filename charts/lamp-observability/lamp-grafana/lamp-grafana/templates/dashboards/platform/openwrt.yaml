{{- if .Values.dashboards.openwrt.enabled }}
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaFolder
metadata:
  name: network
spec:
  instanceSelector:
    matchLabels:
      dashboards: "grafana"
  parentFolderRef: platform
  title: Network
---
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: openwrt-gl-mt3000
spec:
  folderRef: network
  instanceSelector:
    matchLabels:
      dashboards: "grafana"
  configMapRef:
    name: dashboard-openwrt-gl-mt3000
    key: json
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: dashboard-openwrt-gl-mt3000
  annotations:
    argocd.argoproj.io/sync-options: ServerSideApply=true
data:
  json: >
    {{- .Files.Get "files/openwrt/gl-mt3000.json" | nindent 4 }}
{{- end }}
