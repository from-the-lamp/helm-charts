{{- if .Values.dashboards.litellm.enabled }}
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: litellm
spec:
  folderRef: ai
  instanceSelector:
    matchLabels:
      dashboards: "grafana"
  # grafanaCom id 25541 (previous source) queries litellm_proxy_requests_metric_total,
  # litellm_deployment_requests_total, litellm_cache_hits_metric_total /
  # litellm_cache_misses_metric_total and litellm_api_key_max_budget_metric - all
  # renamed or removed by newer litellm releases, so ~13 of its 50 panels showed
  # No data. This is BerriAI's own dashboard instead, kept in sync with the
  # proxy's real metric names by their own consistency test
  # (tests/unit/integrations/test_prometheus_metric_name_consistency.py).
  url: https://raw.githubusercontent.com/BerriAI/litellm/main/cookbook/litellm_proxy_server/grafana_dashboard/dashboard_all_metrics/grafana_dashboard.json
{{- end }}
