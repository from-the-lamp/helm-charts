{{- if .Values.dashboards.toolhive.enabled }}
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: toolhive
spec:
  folderRef: ai
  instanceSelector:
    matchLabels:
      dashboards: "grafana"
  configMapRef:
    name: dashboard-toolhive-mcp
    key: json
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: dashboard-toolhive-mcp
  annotations:
    argocd.argoproj.io/sync-options: ServerSideApply=true
data:
  # Adapted from Stacklok's own "starter" dashboard
  # (github.com/stacklok/toolhive examples/otel/grafana-dashboards), not an
  # official upstream one. Their version hardcodes job="toolhive-system/
  # mcp-fetch-server" with no template variable, and its Memory/CPU panels
  # query k8s_pod_memory_usage_bytes/k8s_pod_cpu_usage - OTel kubeletstats
  # receiver metrics from their otel-collector architecture, which this
  # stand doesn't run (direct VMPodScrape instead, see argo-apps toolhive
  # app's templates/monitoring/podscrape.yaml). Rewired here to
  # job="toolhive/toolhive" with a $pod template variable (every backend
  # shares one job), and the Memory/CPU panels to the cAdvisor metrics this
  # cluster already collects (container_memory_working_set_bytes,
  # container_cpu_usage_seconds_total) filtered to the toolhive namespace's
  # proxyrunner/vmcp containers. Also fixed go_goroutine_count (not a real
  # client_golang metric name) to go_goroutines - confirmed live which
  # metric names and labels this cluster's own backends actually export.
  # Every panel's datasource also hardcoded a literal uid "prometheus" - not
  # a real datasource here, so the dashboard showed no data (confirmed live).
  # Tried the ${DS_PROMETHEUS} + spec.datasources[] input-substitution
  # convention this chart's other configMapRef dashboards (mongodb,
  # litellm, etc.) use next - confirmed live that this grafana-operator
  # version never actually performs that substitution for configMapRef-
  # sourced dashboards (the saved model, and a direct query, both still show
  # the literal "${DS_PROMETHEUS}" string - a pre-existing bug affecting
  # every dashboard in this chart that uses that pattern, not something this
  # change introduced). Fixed properly instead: templates/datasources/
  # victoria-metrics.yaml now pins uid: victoria-metrics (same reasoning as
  # the loki/tempo/pyroscope datasources already do in this chart - without
  # a pinned uid, Grafana generates a random one, and this Grafana has no
  # PVC, so a pod restart that recreates the datasource would silently
  # reassign it and break every dashboard hardcoding the old value). Every
  # panel here references that stable "victoria-metrics" uid directly -
  # confirmed live this returns real data.
  json: >
    {{- .Files.Get "files/toolhive/mcp.json" | nindent 4 }}
{{- end }}
