apiVersion: v2
name: lamp-victoria-metrics
version: 3.5.0

annotations:
  notes: "VictoriaMetrics v1.156.0 live (this note previously said v1.131.0 - stale, corrected 3.5.0), configurable RBAC roles for VMAgent. 3.0.0: alertManagerConfig.cronitor dead man's switch for Watchdog (FTL-83). 3.0.1: fix invalid YAML when alertManagerConfig.routes is empty (bare [] broke the Alertmanager config parse). 3.1.0: alertManagerConfig.slack token now Vault-sourced (credentials_file via its own ExternalSecret) instead of a literal value. 3.2.0: alertManagerConfig.webhookReceivers - plain webhook_configs receivers for in-cluster, unauthenticated-by-design targets (FTL-110), distinct from the slack_configs receivers above. 3.3.0: webhookReceivers[].maxAlerts - optional max_alerts passthrough, fixes a receiver only ever seeing alerts[0] of a grouped delivery (FTL-110/FTL-143). 3.4.0: alertManagerConfig.oneuptime - dedicated Vault-sourced (url_file) receiver for the OneUptime Incoming Request monitor's heartbeat URL, same secret-indirection pattern as cronitor, since that URL is bearer-token-equivalent. 3.5.0 (FTL-223 hardening pass): route.group_by fixed from [alertname, cluster, service] - service never existed on any alert, so grouping silently degraded to [alertname, cluster] - to [alertname, severity, cluster, namespace]. namespace is the real stand-in for service identity; severity is added so every webhook batch reaching a receiver holds alerts of one severity value, which the oneuptime Incoming Request monitor's criteria now depend on."

dependencies:
  - name: prometheus-operator-crds
    version: 33.0.2
    repository: https://prometheus-community.github.io/helm-charts

  - name: victoria-metrics-k8s-stack
    version: 0.99.1
    repository: https://victoriametrics.github.io/helm-charts/
