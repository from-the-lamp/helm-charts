{{- if .Values.alertManagerConfig.cronitor.enabled }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.alertManagerConfig.cronitor.secretName }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    kind: {{ .Values.externalSecrets.kind }}
    name: {{ .Values.externalSecrets.name }}
  target:
    name: {{ .Values.alertManagerConfig.cronitor.secretName }}
    creationPolicy: {{ .Values.externalSecrets.creationPolicy }}
  data:
    - secretKey: url
      remoteRef:
        key: {{ .Values.alertManagerConfig.cronitor.urlSecret.key }}
        property: {{ .Values.alertManagerConfig.cronitor.urlSecret.property }}
{{- end }}
