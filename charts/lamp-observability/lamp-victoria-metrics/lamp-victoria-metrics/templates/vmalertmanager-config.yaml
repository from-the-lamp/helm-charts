apiVersion: v1
kind: Secret
metadata:
  name: vmalertmanager-config
type: Opaque
stringData:
  alertmanager.yaml: |
    global:
      slack_api_url: {{ .Values.alertManagerConfig.slack.apiUrl }}
    route:
      receiver: blackhole
      group_by:
        - alertname
        - cluster
        - service
      routes:
      {{- if .Values.alertManagerConfig.cronitor.enabled }}
      # Dead man's switch (FTL-83): Watchdog (vector(1), always firing) pings
      # Cronitor's heartbeat monitor. Must come first with continue: false -
      # Watchdog must never reach the slack routes below (pure noise there)
      # and must never pick up their repeat_interval. send_resolved: false on
      # the receiver side is the other half of this - a resolved notification
      # (e.g. vmalert itself dying) would otherwise count as a valid ping and
      # defeat the switch.
      - receiver: cronitor-watchdog
        matchers:
        - alertname="Watchdog"
        continue: false
        group_wait: 0s
        group_interval: 1m
        repeat_interval: {{ .Values.alertManagerConfig.cronitor.repeatInterval }}
      {{- end }}
      {{- if .Values.alertManagerConfig.routes }}
      {{- toYaml .Values.alertManagerConfig.routes | nindent 6 }}
      {{- end }}
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 12h
    inhibit_rules:
      - equal:
        - cluster
        - namespace
        - alertname
        source_matchers:
        - severity=critical
        target_matchers:
        - severity=~"warning|info"
      - equal:
        - cluster
        - namespace
        - alertname
        source_matchers:
        - severity=warning
        target_matchers:
        - severity=info
      - equal:
        - cluster
        - namespace
        source_matchers:
        - alertname=InfoInhibitor
        target_matchers:
        - severity=info
    receivers:
      - name: blackhole
      {{- if .Values.alertManagerConfig.cronitor.enabled }}
      # url_file, not url - the ping URL is a bearer-token-equivalent secret
      # (anyone with it can forge a heartbeat), sourced from Vault via the
      # ExternalSecret this chart also renders (cronitor-externalsecret.yaml)
      # and mounted by the operator's spec.secrets convention at
      # /etc/vm/secrets/<secret-name>/<key> - the caller must add
      # {{ .Values.alertManagerConfig.cronitor.secretName }} to
      # victoria-metrics-k8s-stack.alertmanager.spec.secrets for that mount
      # to actually exist.
      - name: cronitor-watchdog
        webhook_configs:
        - url_file: /etc/vm/secrets/{{ .Values.alertManagerConfig.cronitor.secretName }}/url
          send_resolved: false
      {{- end }}
      {{- range .Values.alertManagerConfig.receivers }}
      - name: {{ .name }}
        slack_configs:
        - channel: "#{{ .channel }}"
          http_config:
            authorization:
              # credentials_file, not credentials - the bot token is Vault-
              # sourced via slack-externalsecret.yaml and mounted at
              # /etc/vm/secrets/<secret-name>/token, same reasoning as
              # cronitor's url_file above.
              credentials_file: /etc/vm/secrets/{{ $.Values.alertManagerConfig.slack.secretName }}/token
          color: '{{`{{ template "slack.monzo.color" . }}`}}'
          icon_emoji: '{{`{{ template "slack.monzo.icon_emoji" . }}`}}'
          send_resolved: true
          text: |-
            {{`{{ range .Alerts }}`}}
              *Alert:* {{`{{ .Annotations.summary }}`}} - `{{`{{ .Labels.severity }}`}}`
              *Description:* {{`{{ .Annotations.description }}`}}
              *Details:*
              {{`{{ range .Labels.SortedPairs }}`}} • *{{`{{ .Name }}`}}:* `{{`{{ .Value }}`}}`
              {{`{{ end }}`}}
            {{`{{ end }}`}}
          title: '{{`{{ template "slack.monzo.title" . }}`}}'
          actions:
            - name: runbookbutton
              text: 'Runbook :green_book:'
              type: button
              url: '{{`{{ (index .Alerts 0).Annotations.runbook_url }}`}}'
              value: text
            - name: querybutton
              text: 'Query :mag:'
              type: button
              url: '{{`{{ (index .Alerts 0).GeneratorURL }}`}}'
              value: text
            - name: grafanabutton
              text: 'Dashboard :grafana:'
              type: button
              url: '{{`{{ (index .Alerts 0).Annotations.dashboard }}`}}'
              value: text
            - name: mutebutton
              text: 'Mute :no_bell:'
              type: button
              url: '{{`{{ template "__alert_silence_link" . }}`}}'
              value: text
            - name: linkbutton
              text: '{{`{{ template "slack.monzo.link_button_text" . }}`}}'
              type: button
              url: '{{`{{ .CommonAnnotations.link_url }}`}}'
              value: text
      {{- end }}
    templates:
    - /etc/vm/configs/**/*.tmpl
    - /etc/vm/templates/vmalertmanager-victoria-metrics-monzo-tpl/monzo.tmpl
