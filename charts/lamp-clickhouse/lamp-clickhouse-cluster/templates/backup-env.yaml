{{- if .Values.cluster.backup.enabled }}
{{- $provider := include "vsoft-clickhouse-cluster.backup.provider" . }}
{{- $gcs := dig "gcs" dict .Values.cluster.backup }}
{{- $gcsAuth := include "vsoft-clickhouse-cluster.backup.gcsAuth" . }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: clickhouse-backup-env
spec:
  refreshInterval: "{{ .Values.externalSecrets.refreshInterval }}"
  secretStoreRef:
    kind: "{{ .Values.externalSecrets.kind }}"
    name: "{{ .Values.externalSecrets.name }}"
  target:
    name: clickhouse-backup-env
    creationPolicy: "{{ .Values.externalSecrets.creationPolicy }}"
    template:
      data:
        LOG_LEVEL: "{{ .Values.cluster.backup.logLevel }}"
        ALLOW_EMPTY_BACKUPS: "true"
        API_LISTEN: "0.0.0.0:7171"
        API_CREATE_INTEGRATION_TABLES: "true"
        BACKUPS_TO_KEEP_REMOTE: "{{ .Values.cluster.backup.keep }}"
        REMOTE_STORAGE: "{{ $provider }}"
        {{- if eq $provider "s3" }}
        S3_ACL: "private"
        {{- if .Values.cluster.backup.s3.endpoint }}
        S3_ENDPOINT: "{{ .Values.cluster.backup.s3.endpoint }}"
        {{- end }}
        S3_REGION: "{{ .Values.cluster.backup.s3.region }}"
        S3_BUCKET: "{{ .Values.cluster.backup.s3.bucket }}"
        S3_PATH: "{{ .Values.cluster.backup.s3.path }}/shard-{shard}"
        S3_ACCESS_KEY: "{{`{{ .access_key }}`}}"
        S3_SECRET_KEY: "{{`{{ .secret_key }}`}}"
        S3_FORCE_PATH_STYLE: "true"
        {{- else }}
        GCS_BUCKET: "{{ include "vsoft-clickhouse-cluster.backup.gcsBucket" . }}"
        GCS_PATH: "{{ dig "path" "clickhouse" $gcs }}/shard-{shard}"
        {{- if eq $gcsAuth "key" }}
        GCS_CREDENTIALS_JSON: "{{`{{ .credentials_json }}`}}"
        {{- end }}
        {{- end }}
        BACKUP_USER: "{{ .Values.cluster.backup.user }}"
        BACKUP_PASSWORD: "{{`{{ .backup_password }}`}}"
        CLICKHOUSE_PORT: "9000"
        MAKE_INCREMENT_BACKUP: "1"
        FULL_BACKUP_WEEKDAY: "1"
        # use all replicas in each shard to restore schema
        CLICKHOUSE_SCHEMA_RESTORE_SERVICES: |
          {{- $clusterName := .Values.cluster.name }}
          {{- $shardCount := int .Values.cluster.shards }}
          {{- $replicaNames := include "vsoft-clickhouse-cluster.replicaNames" . | fromYamlArray }}
          {{- $services := list }}
          {{- range $shard := until $shardCount }}
            {{- range $replica := $replicaNames }}
              {{- $svc := printf "chi-cluster-%s-%d-%s" $clusterName $shard $replica }}
              {{- $services = append $services $svc }}
            {{- end }}
          {{- end }}
          {{ join "," $services }}
        # use only first replica in each shard to restore data
        CLICKHOUSE_DATA_RESTORE_SERVICES: |
          {{- $clusterName := .Values.cluster.name }}
          {{- $shardCount := int .Values.cluster.shards }}
          {{- $first := first (include "vsoft-clickhouse-cluster.replicaNames" . | fromYamlArray) }}
          {{- $services := list }}
          {{- range $shard := until $shardCount }}
            {{- $svc := printf "chi-cluster-%s-%d-%s" $clusterName $shard $first }}
            {{- $services = append $services $svc }}
          {{- end }}
          {{ join "," $services }}
        # use only first replica in each shard to backup data
        CLICKHOUSE_SERVICES: |
          {{- $clusterName := .Values.cluster.name }}
          {{- $shardCount := int .Values.cluster.shards }}
          {{- $first := first (include "vsoft-clickhouse-cluster.replicaNames" . | fromYamlArray) }}
          {{- $services := list }}
          {{- range $shard := until $shardCount }}
            {{- $svc := printf "chi-cluster-%s-%d-%s" $clusterName $shard $first }}
            {{- $services = append $services $svc }}
          {{- end }}
          {{ join "," $services }}
  data:
  - secretKey: backup_password
    remoteRef:
{{- $targetUser := .Values.cluster.backup.user }}
{{- range .Values.cluster.users }}
  {{- if eq .name $targetUser }}
    {{- with .remoteSecret }}
      key: {{ .path }}
      property: {{ .key }}
    {{- end }}
  {{- end }}
{{- end }}
{{- if eq $provider "s3" }}
  - secretKey: access_key
    remoteRef:
      key: "{{ .Values.cluster.backup.s3.accessKey.path }}"
      property: "{{ .Values.cluster.backup.s3.accessKey.key }}"
  - secretKey: secret_key
    remoteRef:
      key: "{{ .Values.cluster.backup.s3.secretKey.path }}"
      property: "{{ .Values.cluster.backup.s3.secretKey.key }}"
{{- else if eq $gcsAuth "key" }}
  - secretKey: credentials_json
    remoteRef:
      key: "{{ dig "credentialsJson" "path" "" $gcs }}"
      property: "{{ dig "credentialsJson" "key" "" $gcs }}"
{{- end }}
{{- end }}
