{{- range .Values.clickhouse.users }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .passwordSecret.name }}
spec:
  refreshInterval: "{{ $.Values.externalSecrets.refreshInterval }}"
  secretStoreRef:
    kind: "{{ $.Values.externalSecrets.kind }}"
    name: "{{ $.Values.externalSecrets.name }}"
  target:
    name: {{ .passwordSecret.name }}
    creationPolicy: "{{ $.Values.externalSecrets.creationPolicy }}"
    template:
      data:
        password: "{{`{{ .password }}`}}"
  data:
  - secretKey: password
    remoteRef:
      {{- $src := index $.Values.userPasswordSources .name }}
      {{- if not $src }}{{ fail (printf "lamp-clickhouse-cluster: user %q has no matching entry in userPasswordSources" .name) }}{{ end }}
      key: "{{ $src.key }}"
      property: "{{ $src.property }}"
{{- end }}
