apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: clickhouse-users
spec:
  refreshInterval: "{{ .Values.externalSecrets.refreshInterval }}"
  secretStoreRef:
    kind: "{{ .Values.externalSecrets.kind }}"
    name: "{{ .Values.externalSecrets.name }}"
  target:
    name: clickhouse-users
    creationPolicy: "{{ .Values.externalSecrets.creationPolicy }}"
    template:
      metadata:
        annotations:
          argocd.argoproj.io/sync-wave: "-1"
      type: Opaque
      data:
      {{- range .Values.cluster.users }}
        {{ include "vsoft-clickhouse-cluster.user.secretKey" .name }}: "{{`{{ `}}.{{ include "vsoft-clickhouse-cluster.user.secretKey" .name }}{{` }}`}}"
      {{- end }}
  data:
{{- range .Values.cluster.users }}
    - secretKey: "{{ include "vsoft-clickhouse-cluster.user.secretKey" .name }}"
      remoteRef:
        key: "{{ .remoteSecret.path }}"
        property: "{{ .remoteSecret.key }}"
{{- end }}
