apiVersion: clickhouse.altinity.com/v1
kind: ClickHouseInstallation
metadata:
  name: cluster
spec:
  configuration:
    clusters:
      - name: default
        layout:
          shardsCount: {{ .Values.clickhouse.shardsCount }}
          replicasCount: {{ .Values.clickhouse.replicasCount }}
    {{- if .Values.clickhouse.profiles }}
    profiles:
      {{- range $profile, $settings := .Values.clickhouse.profiles }}
      {{- range $key, $val := $settings }}
      {{ $profile }}/{{ $key }}: {{ $val }}
      {{- end }}
      {{- end }}
    {{- end }}
    users:
      {{- range .Values.clickhouse.users }}
      {{ .name }}/k8s_secret_password: {{ .passwordSecret.name }}/password
      {{ .name }}/networks/ip:
        - "0.0.0.0/0"
      {{- if .accessManagement }}
      {{ .name }}/access_management: 1
      {{- end }}
      {{- if .profile }}
      {{ .name }}/profile: {{ .profile }}
      {{- end }}
      {{- if .grants }}
      {{ .name }}/grants/query:
        {{- range .grants }}
        - {{ . | quote }}
        {{- end }}
      {{- end }}
      {{- end }}
  defaults:
    templates:
      dataVolumeClaimTemplate: default
      podTemplate: default
  templates:
    podTemplates:
      - name: default
        metadata:
          annotations:
            prometheus.io/scrape: "true"
            prometheus.io/port: "8888"
            prometheus.io/path: /metrics
        spec:
          securityContext:
            runAsUser: 101
            runAsGroup: 101
            fsGroup: 101
          containers:
            - name: clickhouse-pod
              image: {{ .Values.clickhouse.image }}
              {{- with .Values.clickhouse.resources }}
              resources:
                {{- toYaml . | nindent 16 }}
              {{- end }}
              {{- if .Values.clickhouse.databases }}
              volumeMounts:
                - name: init-db
                  mountPath: /docker-entrypoint-initdb.d
              {{- end }}
          {{- if .Values.clickhouse.databases }}
          volumes:
            - name: init-db
              configMap:
                name: clickhouse-init-db
          {{- end }}
    volumeClaimTemplates:
      - name: default
        spec:
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: {{ .Values.clickhouse.storage.size }}
          storageClassName: {{ .Values.clickhouse.storage.storageClass }}
