{{- if .Values.vmcpTokenRefresher.enabled }}
# Canonical in-cluster copy of the windmill-delegate token-exchange result.
# Populated by the CronJob below via kubectl patch - same stub-Secret idiom
# as casdev/secret-stub.yaml and windmill/secret-stub.yaml.
apiVersion: v1
kind: Secret
metadata:
  name: toolhive-bearer-token
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
{{- end }}
