{{- if .Values.mcp.playwright.enabled }}
{{- range $item := .Values.mcp.playwright.mcps }}
{{- if $item.storageState }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $item.name }}-mcp-secret
spec:
  refreshInterval: {{ $.Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    kind: {{ $.Values.externalSecrets.kind }}
    name: {{ $.Values.externalSecrets.name }}
  target:
    name: {{ $item.name }}-mcp-secret
    creationPolicy: {{ $.Values.externalSecrets.creationPolicy }}
  data:
    - secretKey: state
      remoteRef:
        key: {{ $item.storageState.key }}
        {{- with $item.storageState.property }}
        property: {{ . }}
        {{- end }}
{{- end }}
{{- end }}
{{- end }}
