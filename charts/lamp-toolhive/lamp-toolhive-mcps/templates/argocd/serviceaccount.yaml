{{- if .Values.mcp.argocd.enabled }}
{{- $serviceAccounts := dict }}
{{- range $item := .Values.mcp.argocd.mcps }}
{{- if $item.serviceAccount }}
{{- $_ := set $serviceAccounts $item.serviceAccount true }}
{{- end }}
{{- end }}
{{- range $sa, $_ := $serviceAccounts }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $sa }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
{{- end }}
{{- end }}
