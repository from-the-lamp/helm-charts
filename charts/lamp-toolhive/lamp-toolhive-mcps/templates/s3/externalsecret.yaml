{{- if .Values.mcp.s3.enabled }}
{{- range $item := .Values.mcp.s3.mcps }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $item.name }}-mcp-secret
spec:
  refreshInterval: {{ $.Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    kind: {{ $.Values.externalSecrets.kind }}
    name: {{ $.Values.externalSecrets.name }}
  target:
    name: {{ $item.name }}-mcp-secret
    creationPolicy: {{ $.Values.externalSecrets.creationPolicy }}
  data:
    - secretKey: access-key-id
      remoteRef:
        key: {{ $item.vaultKey }}
        property: {{ $item.accessKeyProperty }}
    - secretKey: secret-access-key
      remoteRef:
        key: {{ $item.vaultKey }}
        property: {{ $item.secretKeyProperty }}
{{- end }}
{{- end }}
