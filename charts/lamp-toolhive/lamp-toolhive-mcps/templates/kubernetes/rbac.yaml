{{- if .Values.mcp.kubernetes.enabled }}
{{- $serviceAccounts := dict }}
{{- $readAllSAs := dict }}
{{- range $item := .Values.mcp.kubernetes.mcps }}
{{- if ne $item.enabled false }}
{{- if and $item.serviceAccount (not $item.kubeconfig) (not $item.connectGateway) }}
{{- $_ := set $serviceAccounts $item.serviceAccount ($item.clusterRole | default "view") }}
{{- if $item.readAllResources }}
{{- $_ := set $readAllSAs $item.serviceAccount true }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
{{- range $sa, $clusterRole := $serviceAccounts }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $sa }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $sa }}-{{ $clusterRole }}
subjects:
  - kind: ServiceAccount
    name: {{ $sa }}
    namespace: {{ $.Release.Namespace }}
roleRef:
  kind: ClusterRole
  name: {{ $clusterRole }}
  apiGroup: rbac.authorization.k8s.io
{{- end }}
{{- range $sa, $_ := $readAllSAs }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $sa }}-readonly-all
rules:
  - apiGroups: ["*"]
    resources: ["*"]
    verbs: [get, list, watch]
  - apiGroups: [apiextensions.k8s.io]
    resources: [customresourcedefinitions]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $sa }}-readonly-all
subjects:
  - kind: ServiceAccount
    name: {{ $sa }}
    namespace: {{ $.Release.Namespace }}
roleRef:
  kind: ClusterRole
  name: {{ $sa }}-readonly-all
  apiGroup: rbac.authorization.k8s.io
{{- end }}
{{- end }}
