{{- if .Values.mcp.gcloud.enabled }}
{{- range $item := .Values.mcp.gcloud.mcps }}
{{- if not $item.workloadIdentity }}
{{- fail (printf "mcp.gcloud.mcps[%s].workloadIdentity is required" $item.name) }}
{{- end }}
---
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPServer
metadata:
  name: {{ $item.name }}
spec:
  image: {{ $.Values.mcp.gcloud.image }}
  transport: stdio
  groupRef:
    name: {{ $item.groupRef | default $.Values.mcp.defaults.groupRef }}
  permissionProfile:
    type: builtin
    name: {{ $.Values.mcp.defaults.permissionProfile }}
  audit:
    enabled: true
  {{- with $item.toolConfig }}
  toolConfigRef:
    name: {{ $item.name }}-tool-config
  {{- end }}
  serviceAccount: {{ $item.workloadIdentity.serviceAccount }}
  podTemplateSpec:
    spec:
      nodeSelector:
        iam.gke.io/gke-metadata-server-enabled: "true"
      containers:
        - name: mcp
          volumeMounts:
            - name: gcloud-config
              mountPath: /home/node/.config
      volumes:
        - name: gcloud-config
          emptyDir: {}
  env:
    - name: CLOUDSDK_CORE_PROJECT
      value: {{ $item.workloadIdentity.projectId | quote }}
    {{- with $item.env }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with $item.toolConfig }}
---
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPToolConfig
metadata:
  name: {{ $item.name }}-tool-config
spec:
  {{- with .toolsFilter }}
  toolsFilter:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .toolsOverride }}
  toolsOverride:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- end }}
{{- end }}
{{- end }}
