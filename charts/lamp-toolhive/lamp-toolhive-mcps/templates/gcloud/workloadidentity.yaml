{{- if .Values.mcp.gcloud.enabled }}
{{- range $item := .Values.mcp.gcloud.mcps }}
{{- $wi := $item.workloadIdentity }}
{{- if not $wi }}
{{- fail (printf "mcp.gcloud.mcps[%s].workloadIdentity is required" $item.name) }}
{{- end }}
{{- $sa := $wi.serviceAccount }}
{{- $projectId := $wi.projectId }}
{{- if not $wi.roles }}
{{- fail (printf "mcp.gcloud.mcps[%s].workloadIdentity.roles must be a non-empty list" $item.name) }}
{{- end }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $sa }}
  annotations:
    iam.gke.io/gcp-service-account: {{ $sa }}@{{ $projectId }}.iam.gserviceaccount.com
---
apiVersion: iam.cnrm.cloud.google.com/v1beta1
kind: IAMServiceAccount
metadata:
  name: {{ $sa }}
  annotations:
    cnrm.cloud.google.com/project-id: {{ $projectId | quote }}
spec:
  displayName: "GCP SA bound to K8S SA {{ $projectId }}[{{ $.Release.Namespace }}/{{ $sa }}]"
---
apiVersion: iam.cnrm.cloud.google.com/v1beta1
kind: IAMPolicyMember
metadata:
  name: {{ $sa }}-workload
  annotations:
    cnrm.cloud.google.com/project-id: {{ $projectId | quote }}
spec:
  member: "serviceAccount:{{ $projectId }}.svc.id.goog[{{ $.Release.Namespace }}/{{ $sa }}]"
  role: "roles/iam.workloadIdentityUser"
  resourceRef:
    apiVersion: iam.cnrm.cloud.google.com/v1beta1
    kind: IAMServiceAccount
    name: {{ $sa }}
{{- range $role := $wi.roles }}
{{- $roleSlug := $role | trimPrefix "roles/" | replace "." "-" }}
---
apiVersion: iam.cnrm.cloud.google.com/v1beta1
kind: IAMPolicyMember
metadata:
  name: {{ $sa }}-{{ $roleSlug }}
  annotations:
    cnrm.cloud.google.com/project-id: {{ $projectId | quote }}
spec:
  member: "serviceAccount:{{ $sa }}@{{ $projectId }}.iam.gserviceaccount.com"
  role: {{ $role | quote }}
  resourceRef:
    kind: Project
    external: {{ $projectId | quote }}
{{- end }}
{{- end }}
{{- end }}
