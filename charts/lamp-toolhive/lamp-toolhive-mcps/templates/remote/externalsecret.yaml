{{- if .Values.mcp.remote.enabled }}
{{- range $item := .Values.mcp.remote.mcps }}
{{- if $item.headers }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $item.name }}-mcp-secret
spec:
  refreshInterval: {{ $.Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    kind: {{ $.Values.externalSecrets.kind }}
    name: {{ $.Values.externalSecrets.name }}
  target:
    name: {{ $item.name }}-mcp-secret
    creationPolicy: {{ $.Values.externalSecrets.creationPolicy }}
  data:
    {{- range $h := $item.headers }}
    - secretKey: {{ $h.secretKey }}
      remoteRef:
        key: {{ $h.token.key }}
        {{- with $h.token.property }}
        property: {{ . }}
        {{- end }}
    {{- end }}
{{- end }}
{{- end }}
{{- end }}
