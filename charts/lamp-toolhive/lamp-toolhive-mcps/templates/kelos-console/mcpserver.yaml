{{- if .Values.mcp.kelosConsole.enabled }}
{{- range $item := .Values.mcp.kelosConsole.mcps }}
---
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPServer
metadata:
  name: mcp-{{ $item.name }}
spec:
  image: {{ $.Values.mcp.kelosConsole.image }}
  transport: stdio
  groupRef:
    name: {{ $item.groupRef | default $.Values.mcp.defaults.groupRef }}
  permissionProfile:
    type: builtin
    name: {{ $.Values.mcp.defaults.permissionProfile }}
  audit:
    enabled: true
  {{- with $item.toolConfig }}
  toolConfigRef:
    name: {{ $item.name }}-tool-config
  {{- end }}
  podTemplateSpec:
    metadata:
      annotations:
        {{- include "lamp-toolhive-mcps.podAnnotations" . | nindent 8 }}
    spec:
      containers:
        - name: mcp
          env:
            - name: CONSOLE_BASE_URL
              value: {{ $item.url }}
            - name: CONSOLE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ $item.name }}-mcp-secret
                  key: token
  {{- with $item.env }}
  env:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with $item.toolConfig }}
---
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPToolConfig
metadata:
  name: {{ $item.name }}-tool-config
spec:
  {{- with .toolsFilter }}
  toolsFilter:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .toolsOverride }}
  toolsOverride:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- end }}
{{- end }}
{{- end }}
