{{- if .Values.mcp.imageGen.enabled }}
{{- range $item := .Values.mcp.imageGen.mcps }}
---
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPServer
metadata:
  name: mcp-{{ $item.name }}
spec:
  image: {{ $.Values.mcp.imageGen.image }}
  transport: stdio
  groupRef:
    name: {{ $item.groupRef | default $.Values.mcp.defaults.groupRef }}
  permissionProfile:
    type: builtin
    name: {{ $.Values.mcp.defaults.permissionProfile }}
  audit:
    enabled: true
  podTemplateSpec:
    metadata:
      annotations:
        {{- include "lamp-toolhive-mcps.podAnnotations" . | nindent 8 }}
    spec:
      containers:
        - name: mcp
          env:
            - name: LITELLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $item.name }}-mcp-secret
                  key: token
            {{- with $item.baseUrl }}
            - name: LITELLM_BASE_URL
              value: {{ . }}
            {{- end }}
            {{- with $item.model }}
            - name: IMAGE_GEN_MODEL
              value: {{ . }}
            {{- end }}
{{- end }}
{{- end }}
