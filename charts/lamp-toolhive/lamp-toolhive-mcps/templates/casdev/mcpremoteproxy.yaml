{{- if .Values.mcp.casDev.enabled }}
{{- range $item := .Values.mcp.casDev.mcps }}
---
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPRemoteProxy
metadata:
  name: mcp-proxy-{{ $item.name }}
spec:
  remoteUrl: {{ $.Values.mcp.casDev.remoteUrl }}
  groupRef:
    name: {{ $item.groupRef | default $.Values.mcp.defaults.groupRef }}
  proxyPort: 8080
  headerForward:
    addHeadersFromSecret:
      - headerName: Authorization
        valueSecretRef:
          name: cas-dev-mcp-auth-header
          key: authHeader
{{- end }}
{{- end }}
