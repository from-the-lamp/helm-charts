mcp:
  defaults:
    groupRef: mcp-tools
    permissionProfile: network

  grafana:
    enabled: false
    image: grafana/mcp-grafana:2.1.1
    mcps: []

  github:
    enabled: true
    image: ghcr.io/github/github-mcp-server:v2.0.3
    mcps:
      - name: github-xdata
        token:
          key: toolhive
          property: github_xdata_token

  gitlab:
    enabled: true
    image: zereight050/gitlab-mcp:2.3.11
    mcps:
      - name: gitlab
        apiUrl: https://gitlab.com/api/v4
        permissionMode: full
        env:
          - name: GITLAB_TOOLSETS
            value: core,merge_requests,pipelines,ci,repositories
        token:
          key: toolhive
          property: gitlab_token_from_the_lamp
      - name: gitlab-cas-dev
        apiUrl: https://gitlab.v-soft.dev/api/v4
        permissionMode: full
        token:
          key: toolhive
          property: gitlab_token_cas_dev
      - name: gitlab-cas-gitops
        apiUrl: https://gitlab.v-gitops.cc/api/v4
        permissionMode: full
        token:
          key: toolhive
          property: gitlab_token_cas_gitops

  kubernetes:
    enabled: true
    image: quay.io/containers/kubernetes_mcp_server:v0.1.1
    mcpPort: 8080
    mcps:
      - name: kubernetes
        serviceAccount: kubernetes-mcp
      - name: oracle-1
        kubeconfig:
          key: toolhive
          property: kubeconfig-prod-1
      - name: oracle-0
        kubeconfig:
          key: toolhive
          property: kubeconfig-prod-0

  slack:
    enabled: true
    image: ghcr.io/korotovsky/slack-mcp-server:v1.3.0
    mcps:
      - name: slack-cas
        token:
          key: toolhive
          property: slack_token_cas
      - name: slack-xdata
        token:
          key: toolhive
          property: slack_token_xdata
      - name: slack-currency
        token:
          key: toolhive
          property: slack_token_currency

  jira:
    enabled: false
    image: ghcr.io/sooperset/mcp-atlassian:0.23.1
    mcps: []

  atlassian:
    enabled: true
    image: xuanxdev/atlassian-mcp:latest
    mcps:
      - name: jira-cas
        domain: jirasolutions.atlassian.net
        email: artem.zverev@v-soft.dev
        token:
          key: toolhive
          property: atlassian_token_cas
      - name: jira-xdata
        domain: xdatagroup.atlassian.net
        email: artem.zverev@xdatagroup.io
        token:
          key: toolhive
          property: atlassian_token_xdata
      - name: jira-currency
        domain: cx-labs-io.atlassian.net
        email: a.zverev@cx-labs.io
        token:
          key: toolhive
          property: atlassian_token_currency
      - name: jira-from-the-lamp
        domain: artyomzverev.atlassian.net
        email: artyom.zverev@protonmail.com
        token:
          key: toolhive
          property: jira_token_from_the_lamp

  bitbucket:
    enabled: true
    image: registry.gitlab.com/from-the-lamp/infra/docker-images/lamp-bitbucket-mcp:latest
    mcps:
      - name: bitbucket
        username: a.zverev@cx-labs.io
        workspace: currencycom
        token:
          key: toolhive
          property: atlassian_token_currency

  victoriametrics:
    enabled: false
    image: ghcr.io/victoriametrics/mcp-victoriametrics:v1.120.1
    mcps: []

  # The upstream server only knows how to send a VAULT_TOKEN, so it talks to a
  # Vault Proxy sidecar instead of to Vault: the proxy logs in with the pod's
  # ServiceAccount (kubernetes auth) and rewrites the token on every request
  # (use_auto_auth_token = "force"), which keeps a static token out of the
  # cluster entirely and renews on its own. Each entry gets its own
  # ServiceAccount named after it, bound to a Vault role of its choosing - that
  # role's policy is what decides the reach. Pair every entry with
  # toolConfig.toolsFilter so the write/delete/read tools the image also ships
  # are never exposed to a client.
  vault:
    enabled: false
    image: hashicorp/vault-mcp-server:0.2.0
    address: http://vault.vault:8200
    authMount: kubernetes
    proxy:
      image: hashicorp/vault:2.2.1
      port: 8100
    mcps: []

  clickhouse:
    enabled: false
    image: us-central1-docker.pkg.dev/database-toolbox/toolbox/toolbox:1.15.0
    mcps: []

  postgres:
    enabled: false
    image: us-central1-docker.pkg.dev/database-toolbox/toolbox/toolbox:1.15.0
    mcps: []

  redis:
    enabled: false
    image: us-central1-docker.pkg.dev/database-toolbox/toolbox/toolbox:1.15.0
    mcps: []

  kafka:
    enabled: false
    image: ghcr.io/tuannvm/kafka-mcp-server:2.0.2
    mcps: []

  argocd:
    enabled: false
    image: ""
    mcps: []

  sheets:
    enabled: true
    image: registry.gitlab.com/from-the-lamp/infra/docker-images/lamp-google-sheets:latest
    mcps:
      - name: sheets
        credentials:
          key: toolhive
          property: sheets-mcp

  oracle:
    enabled: true
    image: registry.gitlab.com/from-the-lamp/infra/docker-images/lamp-oracle-mcp:latest
    mcps:
      - name: oracle-prod-0
        profile: lamp-prod-0
        config:
          key: toolhive
          property: oracle_config
        keyFiles:
          - name: lamp-prod-0.pem
            property: oracle_key_lamp_prod_0
          - name: lamp-prod-1.pem
            property: oracle_key_lamp_prod_1
      - name: oracle-prod-1
        profile: lamp-prod-1
        config:
          key: toolhive
          property: oracle_config
        keyFiles:
          - name: lamp-prod-0.pem
            property: oracle_key_lamp_prod_0
          - name: lamp-prod-1.pem
            property: oracle_key_lamp_prod_1

  etherscan:
    enabled: true
    image: registry.gitlab.com/from-the-lamp/infra/docker-images/lamp-etherscan-mcp:latest
    mcps:
      - name: etherscan
        token:
          key: toolhive
          property: etherscan_api_key

  alchemy:
    enabled: true
    image: registry.gitlab.com/from-the-lamp/infra/docker-images/lamp-alchemy-mcp:latest
    mcps:
      - name: alchemy
        token:
          key: toolhive
          property: alchemy_api_key

  coingecko:
    enabled: true
    image: registry.gitlab.com/from-the-lamp/infra/docker-images/lamp-coingecko-mcp:1.0.2
    mcps:
      - name: coingecko
        token:
          key: toolhive
          property: coingecko_demo_api_key

  alphavantage:
    enabled: true
    image: registry.gitlab.com/from-the-lamp/infra/docker-images/lamp-alphavantage-mcp:1.0.3
    mcps:
      - name: alphavantage
        token:
          key: toolhive
          property: alphavantage_api_key

  googlemaps:
    enabled: true
    remoteUrl: https://mapstools.googleapis.com/mcp
    mcps:
      - name: googlemaps-grounding
        token:
          key: toolhive
          property: googlemaps_grounding_lite_api_key

  thegraph:
    enabled: true
    image: registry.gitlab.com/from-the-lamp/infra/docker-images/lamp-thegraph-mcp:latest
    mcps:
      - name: thegraph
        token:
          key: toolhive
          property: thegraph_api_key

  aave:
    enabled: true
    remoteUrl: https://mcp.aave.com
    mcps:
      - name: aave

  defillama:
    enabled: false
    remoteUrl: https://mcp.defillama.com/mcp
    mcps:
      - name: defillama

  defilamaFreeApi:
    enabled: true
    image: registry.gitlab.com/from-the-lamp/infra/docker-images/lamp-defilama-free-api-mcp:0.1.0
    mcps:
      - name: defilama-free-api

  defilamaYields:
    enabled: true
    image: registry.gitlab.com/from-the-lamp/infra/docker-images/lamp-defilama-yields-mcp:0.1.3
    mcps:
      - name: defilama-yields

  windmill:
    enabled: true
    remoteUrl: ""
    bootstrap:
      windmillBaseUrl: ""
      workspaceId: djinn
      serviceUserEmail: toolhive-mcp@windmill.internal
      superadminSecret:
        name: windmill-superadmin-secret
        namespace: windmill
        key: secret

  letsfg:
    enabled: true
    image: registry.gitlab.com/from-the-lamp/infra/docker-images/lamp-letsfg-mcp:1.1.0
    mcps:
      - name: letsfg

  sentry:
    enabled: true
    image: ghcr.io/stacklok/dockyard/npx/sentry-mcp-server:0.42.0
    mcps: []

  linkedin:
    enabled: true
    image: stickerdaniel/linkedin-mcp-server:latest
    mcps:
      - name: linkedin
        sessionClaimSize: 2Gi

  playwright:
    enabled: false
    image: mcr.microsoft.com/playwright/mcp:v0.0.83
    mcpPort: 8931
    mcps: []

  # ghcr.io/drolosoft/immich-photo-manager - unlike every stdio category
  # above, this image already speaks MCP natively over streamable-http
  # (port 8626) - see templates/immich/mcpserver.yaml for the transport/
  # mcpPort difference that implies. API key comes from Vault like every
  # other category (NOT self-minted): Immich's passwordLogin is commonly
  # disabled once GitLab OAuth is confirmed working (GitLab-only login
  # for humans), which also blocks any in-cluster Job from authenticating
  # via POST /api/auth/login to mint its own key headlessly - confirmed
  # live (401 "Password login has been disabled"). Create the key once by
  # hand via the web UI (Settings > API Keys) and write it to Vault.
  # baseUrl is the in-cluster Immich Service URL - override to match your
  # own.
  immich:
    enabled: true
    image: ghcr.io/drolosoft/immich-photo-manager:latest
    mcpPort: 8626
    baseUrl: http://immich-server.immich.svc.cluster.local:2283
    mcps:
      - name: immich
        token:
          key: toolhive
          property: immich_api_key

# Replaces the Windmill-hosted refresh_toolhive_token_v2 cron as the
# refresh MECHANISM for windmill-delegate's RFC 8693 token exchange - see
# templates/vmcptokenrefresher/. Disabled by default (no consumer should
# get an extra CronJob+ServiceAccount+RBAC it didn't ask for); the
# homelab consumer values.yaml turns this on with its own real
# tokenEndpoint/resourceAudience/windmillApiBase.
vmcpTokenRefresher:
  enabled: false
  schedule: "*/5 * * * *"
  tokenEndpoint: ""
  resourceAudience: ""
  windmillApiBase: ""

  letsfg:
    enabled: true
    # Self-built from docker-images/lamp-letsfg-mcp (npm package letsfg-mcp, no official image).
    # letsfg-mcp only accepts a static LETSFG_BEARER_TOKEN env var (no refresh logic of its own),
    # and its OAuth refresh_token rotates on every use - so the container's own supervisor reads
    # the current refresh_token straight from Vault (via the mounted lamp-infra OCI profile,
    # reusing the oracle-infra MCP's ExternalSecret-derived k8s Secret), exchanges it for a fresh
    # access token, writes the rotated refresh_token back, and restarts itself shortly before
    # the access token expires so Kubernetes cycles the pod through this loop again.
    image: registry.gitlab.com/from-the-lamp/infra/docker-images/lamp-letsfg-mcp:latest
    mcps:
      - name: letsfg
        ociProfile: lamp-infra
        ociSecretName: oracle-infra-mcp-secret
        vaultSecretId: ocid1.vaultsecret.oc1.eu-frankfurt-1.amaaaaaap56pctia3kx6u2sw3qqt5gkav6rp4pst77gu2lu54qmeram4jcfa

  gcloud:
    enabled: false
    image: europe-central2-docker.pkg.dev/common-infra-4585/docker-images/gcloud-mcp:0.1.0
    mcps: []

  # remote proxies an externally-hosted MCP server (MCPRemoteProxy) instead of
  # running one in-cluster, so there is no `image` at the type level.
  remote:
    enabled: false
    mcps: []
    # - name: example-remote
    #   groupRef: mcp-tools            # optional, defaults to mcp.defaults.groupRef
    #   remoteUrl: https://example-mcp.internal.example.com
    #   transport: streamable-http     # streamable-http | sse
    #   toolConfig:                    # optional, renders an MCPToolConfig + toolConfigRef
    #     toolsFilter:
    #       - example_tool_one
    #       - example_tool_two
    #   headers:                       # optional, renders spec.headerForward.addHeadersFromSecret
    #     - name: X-Internal-Auth
    #       secretKey: shared_token    # key inside the generated <name>-mcp-secret
    #       token:
    #         key: example-remote-shared-token

externalSecrets:
  kind: ClusterSecretStore
  name: vault
  refreshInterval: 1h
  creationPolicy: Orphan
