{{- if .Values.dex.enabled }}
{{- if eq (.Values.authServerSecret.strategy | default "vault") "selfGenerated" }}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: toolhive-authserver-signing
spec:
  secretName: toolhive-authserver-signing
  commonName: toolhive-authserver
  duration: 87600h
  privateKey:
    algorithm: RSA
    size: 2048
    encoding: PKCS8
    rotationPolicy: Never
  {{- with .Values.authServerSecret.issuerRef }}
  issuerRef:
    {{- toYaml . | nindent 4 }}
  {{- end }}
---
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: toolhive-authserver-hmac
spec:
  length: 64
  symbols: 0
  allowRepeat: true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: toolhive-authserver-hmac
spec:
  refreshPolicy: CreatedOnce
  target:
    name: toolhive-authserver-hmac
    creationPolicy: {{ .Values.externalSecrets.creationPolicy }}
    immutable: true
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: toolhive-authserver-hmac
{{- else }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: toolhive-authserver-secrets
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    kind: {{ .Values.externalSecrets.kind }}
    name: {{ .Values.externalSecrets.name }}
  target:
    name: toolhive-authserver-secrets
    creationPolicy: {{ .Values.externalSecrets.creationPolicy }}
  data:
    - secretKey: hmac
      remoteRef:
        key: toolhive
        property: authserver-hmac
    - secretKey: signing
      remoteRef:
        key: toolhive
        property: authserver-signing
{{- end }}
{{- end }}
