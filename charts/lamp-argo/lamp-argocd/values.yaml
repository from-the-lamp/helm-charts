global:
  projectId: ""

defaultClusterName: ""

gcp:
  workloadIdentity:
    enabled: false
    serviceAccountName: argocd-repo-server

sso:
  enabled: false
  secretName: argocd-sso
  oauthClientID:
    key: argocd
    property: oauth-client-id
  oauthClientSecret:
    key: argocd
    property: oauth-client-secret
  googleServiceAccountKey:
    enabled: false
    name: argocd-sso-gsa

externalClusters: []

repositories: []

githubApps: []

externalSecrets:
  kind: ClusterSecretStore
  name: ""
  refreshInterval: 1h
  creationPolicy: Orphan

argo-cd:
  configs:
    params:
      server.insecure: "true"
    rbac:
      policy.default: deny
      scopes: "[email, groups]"
    cm:
      admin.enabled: false
      exec.enabled: true
      # No IngressClass/controller in this cluster ever watches classic
      # networking.k8s.io Ingress objects - all real traffic routes through
      # Gateway API (Istio HTTPRoute). Some community charts (e.g.
      # lamp-actualbudget) still render one because it gates unrelated
      # template logic behind `ingress.enabled`, leaving `status.loadBalancer`
      # permanently empty. ArgoCD's default Ingress health check reports
      # Progressing forever on that empty status, so override it cluster-wide.
      resource.customizations.health.networking.k8s.io_Ingress: |
        hs = {}
        hs.status = "Healthy"
        hs.message = "Classic Ingress objects are never watched on this cluster (Gateway API/Istio only)"
        return hs

  controller:
    metrics:
      enabled: true
      serviceMonitor:
        enabled: true

  server:
    metrics:
      enabled: true
      serviceMonitor:
        enabled: true

  repoServer:
    serviceAccount:
      name: argocd-repo-server
    metrics:
      enabled: true
      serviceMonitor:
        enabled: true
        relabelings:
          - targetLabel: job
            replacement: argocd-repo-server

  applicationSet:
    metrics:
      enabled: true
      serviceMonitor:
        enabled: true

  notifications:
    metrics:
      enabled: true
      serviceMonitor:
        enabled: true

  redis:
    metrics:
      enabled: true
      serviceMonitor:
        enabled: true
    exporter:
      enabled: true
