project:
  enabled: false
  name: example
  nameGenerator: "{{ .Values.project.type }}-{{ .Values.project.environment }}-{{ .Values.project.name }}"
  namespace: argocd
  type: product
  description: ""
  environment: dev
  roles:
    developer: []
      # - example-developers@example.com
  # Globals
  region: europe-west4
  projectName: common
  projectId: common-dev-347a
  networkName: common-dev-eu-w4-main-0
  clusterName: common-dev-eu-w4-main-0

git:
  repo: https://github.com/example-project.git
  revision: HEAD
  path: "{{`{{ .path.path }}`}}"
  valueFiles:
    - ../values.yaml
    - values.yaml
    - .kargo.values.yaml
  parameters:
    - name: global.environment
      value: "{{ .Values.project.environment }}"
    - name: global.projectName
      value: "{{ .Values.project.projectName }}"
    - name: global.projectId
      value: "{{ .Values.project.projectId }}"
    - name: global.region
      value: "{{ .Values.project.region }}"
    - name: global.networkName
      value: "{{ .Values.project.networkName }}"
    - name: global.clusterName
      value: "{{ .Values.project.clusterName }}"

appset:
  name: example
  nameGenerator: "{{ .Values.project.type }}-{{ .Values.project.environment }}-{{ .Values.project.name }}"
  generators:
    - git:
        directories:
          - path: "envs/{{ .Values.project.environment }}/{{ .Values.project.type }}/*"
        repoURL: "{{ .Values.git.repo }}"
        revision: "{{ .Values.git.revision }}"
  app:
    nameGenerator: "{{ .Values.project.type }}-{{ .Values.project.environment }}-{{`{{ .path.basename }}`}}"
    annotations: {}
      # kargo.akuity.io/authorized-stage: "kargo-project-{{`{{ .path.basename }}`}}:{{ .Values.project.environment }}-{{`{{ .path.basename }}`}}"

destination:
  name: "gke-{{ .Values.project.projectId }}-{{ .Values.project.clusterName }}"
  namespace: "{{`{{ .path.basename }}`}}"
  releaseName: "{{`{{ .path.basename }}`}}"

sync:
  prune: true
  selfHeal: true
  createNamespace: true
  changeSyncPolicy: true
  preserveResourcesOnDeletion: true
  # labels/annotations, проставляемые ArgoCD на управляемый namespace (требует CreateNamespace=true)
  namespaceLabels: {}
  namespaceAnnotations: {}

ignoreDifferences:
  - group: apps
    jqPathExpressions:
      - .spec.volumeClaimTemplates[].apiVersion
      - .spec.volumeClaimTemplates[].kind
    jsonPointers:
      - /spec/replicas
    kind: StatefulSet
  - group: apps
    jsonPointers:
      - /spec/replicas
    kind: Deployment
  - group: admissionregistration.k8s.io
    jsonPointers:
      - /webhooks/0/failurePolicy
    kind: ValidatingWebhookConfiguration
    name: istio-validator-istio-system
  - group: admissionregistration.k8s.io
    jsonPointers:
      - /webhooks/0/failurePolicy
    kind: ValidatingWebhookConfiguration
    name: istiod-default-validator
  - group: apps
    kind: Deployment
    jqPathExpressions:
      - '.spec.template.spec.containers[].env[]? | select(.valueFrom.resourceFieldRef != null) | .valueFrom.resourceFieldRef.divisor'
