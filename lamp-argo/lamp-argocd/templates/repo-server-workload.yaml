{{- if .Values.gcp.workloadIdentity.enabled }}
{{- if not .Values.global.projectId }}
{{- fail "gcp.workloadIdentity.enabled requires global.projectId" }}
{{- end }}
apiVersion: iam.cnrm.cloud.google.com/v1beta1
kind: IAMServiceAccount
metadata:
  name: {{ .Values.gcp.workloadIdentity.serviceAccountName }}
  annotations:
    cnrm.cloud.google.com/project-id: "{{ .Values.global.projectId }}"
spec:
  displayName: "GCP SA bound to K8S SA {{ .Values.global.projectId }}[{{ .Values.gcp.workloadIdentity.serviceAccountName }}]"
---
apiVersion: iam.cnrm.cloud.google.com/v1beta1
kind: IAMPolicyMember
metadata:
  name: {{ .Values.gcp.workloadIdentity.serviceAccountName }}-workload
  annotations:
    cnrm.cloud.google.com/project-id: "{{ .Values.global.projectId }}"
spec:
  member: "serviceAccount:{{ .Values.global.projectId }}.svc.id.goog[{{ .Release.Namespace }}/{{ .Values.gcp.workloadIdentity.serviceAccountName }}]"
  role: "roles/iam.workloadIdentityUser"
  resourceRef:
    apiVersion: iam.cnrm.cloud.google.com/v1beta1
    kind: IAMServiceAccount
    name: {{ .Values.gcp.workloadIdentity.serviceAccountName }}
{{- end }}
