{{- $project := .Values.project -}}
{{- range $app := .Values.apps }}
{{- range $warehouses := $.Values.warehouses }}
---
apiVersion: kargo.akuity.io/v1alpha1
kind: Warehouse
metadata:
  name: {{ $warehouses.name }}-{{ $app.name }}
  namespace: {{ $project.prefix }}-{{ $app.name }}
spec:
  subscriptions:
  {{- if $app.subscriptions }}
    {{- toYaml $app.subscriptions | nindent 4 }}
  {{- else if $warehouses.subscriptions }}
    {{- toYaml $warehouses.subscriptions | nindent 4 }}
  {{- else }}
  {{- $strategy := default $warehouses.imageSelectionStrategy $app.imageSelectionStrategy }}
  - image:
      repoURL: {{ $app.image }}
      imageSelectionStrategy: {{ $strategy }}
      {{- if eq $strategy "NewestBuild" }}
      allowTags: {{ default $warehouses.allowTags $app.allowTags | quote }}
      {{- end }}
      {{- if eq $strategy "Digest" }}
      constraint: {{ default $warehouses.constraint $app.constraint | quote }}
      {{- end }}
  {{- end }}
{{- end }}
{{- end }}
