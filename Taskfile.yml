version: '3'

dotenv: [.env]
vars:
  # Single source for the container subdirectory charts live under - every consumer below re-adds
  # it instead of hardcoding "charts" a second time, so a future move only needs this one line.
  CHARTS_DIR: charts
  CHART_DIRS:
    sh: find . -type f -name "Chart.yaml" -not -path "./.git/*" -exec dirname {} \; | sed 's|^\./||' | sed 's|^{{.CHARTS_DIR}}/||' | tr '\n' ' '
  DIFF_BASE:
    sh: |
      if [ -n "${DIFF_BASE:-}" ]; then
        echo "$DIFF_BASE"
        exit 0
      fi
      for c in "${CI_MERGE_REQUEST_DIFF_BASE_SHA:-}" "${CI_COMMIT_BEFORE_SHA:-}"; do
        if [ -n "$c" ] && [ "$c" != "0000000000000000000000000000000000000000" ] && git cat-file -e "$c^{commit}" 2>/dev/null; then
          echo "$c"
          exit 0
        fi
      done
      # Local/pre-commit fallback: "HEAD" is a sentinel GIT_DIFF_FLAGS below
      # keys off of, not just another ref. HEAD~1 looked equivalent but
      # breaks the moment HEAD is a merge commit - its first parent is "my
      # own tip before the merge", so everything the merge brought in from
      # the other side reads as "changed" (e.g. every renovate Chart.yaml
      # bump pulled in by a `git pull`/merge from main).
      echo HEAD
  # Pre-commit hooks see the *staged* snapshot, not the full working tree -
  # --cached scopes the local fallback to that, so unrelated unstaged edits
  # elsewhere in the tree don't get swept into "changed" either. Empty in CI,
  # where DIFF_BASE is a real historical SHA and the checkout has nothing
  # staged anyway.
  GIT_DIFF_FLAGS:
    sh: |
      if [ "{{.DIFF_BASE}}" = "HEAD" ]; then
        echo "--cached"
      fi
  CHANGED_CHART_DIRS:
    sh: |
      if [ -n "${TARGETS:-}" ]; then
        echo "$TARGETS"
        exit 0
      fi
      git diff {{.GIT_DIFF_FLAGS}} --name-only --diff-filter=d {{.DIFF_BASE}} | grep 'Chart.yaml$' | xargs -r -n1 dirname | sed 's|^{{.CHARTS_DIR}}/||' | sort -u | tr '\n' ' '

includes:
  init:
    taskfile: .tasks/init.yml
    flatten: true
  build:
    taskfile: .tasks/build.yml
    flatten: true
  build_dev:
    taskfile: .tasks/build_dev.yml
    flatten: true
  readme:
    taskfile: .tasks/readme.yml
    flatten: true
  template:
    taskfile: .tasks/template.yml
    flatten: true

silent: true
tasks:
  default:
    desc: List all available tasks
    cmd: task --list-all

  list:all:
    desc: List all Chart directories
    cmd: echo {{.CHART_DIRS}} | tr ' ' '\n'

  plan:
    desc: Show what CI would build and push from the current diff - diff base, changed charts, target OCI refs
    cmds:
      - echo -e "\033[36m==>\033[0m diff base {{.DIFF_BASE}} (override with DIFF_BASE=<ref>, or name charts with TARGETS=\"dir1 dir2\" - both as environment variables)"
      - |
        if [ -z "{{.CHANGED_CHART_DIRS}}" ]; then
          echo -e "\033[36m==>\033[0m no Chart.yaml changed - CI would build and push nothing"
          exit 0
        fi
        for d in {{.CHANGED_CHART_DIRS}}; do
          echo "$d -> oci://${OCI_REPO:-<OCI_REPO>}/$(yq '.name' "{{.CHARTS_DIR}}/$d/Chart.yaml"):$(yq '.version' "{{.CHARTS_DIR}}/$d/Chart.yaml")"
        done

  list:changed:
    desc: List changed Chart directories
    cmd: echo {{.CHANGED_CHART_DIRS}} | tr ' ' '\n'
    preconditions:
      - sh: '[ -n "{{.CHANGED_CHART_DIRS}}" ]'
        msg: "No changed chart directories found."

  lint:changed:
    desc: Helm lint for changed charts
    cmds:
      - |
        set -e
        for d in {{.CHANGED_CHART_DIRS}}; do
          echo "== helm lint: $d =="
          helm lint "{{.CHARTS_DIR}}/$d"
        done
    preconditions:
      - sh: '[ -n "{{.CHANGED_CHART_DIRS}}" ]'
        msg: "No changed chart directories found."

  cleanup:
    desc: Remove temporary files
    cmds:
    - find . -type d -name ".output" -prune -exec rm -rf {} \;
    - find {{.CHARTS_DIR}} -mindepth 2 -type d -name "charts" -prune -exec rm -rf {} \;
    - find . -iname "*tmpcharts*" -delete;
    - find . -iname "Chart.lock" -delete;

  auth:
    desc: Auth in Helm registry
    cmds:
      - echo -e "\033[36m==>\033[0m logging in to ${OCI_REPO%%/*} - helm 4 registry login takes the registry host, not the repository path"
      - echo "${OCI_REPO_PASS}" | helm registry login -u "${OCI_REPO_USER}" --password-stdin "${OCI_REPO%%/*}"
