{{- if .Values.backup.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: immich-backup
data:
  BACKUP_BUCKET: {{ .Values.backup.bucket | quote }}
  BACKUP_PATH: {{ .Values.backup.path | quote }}
  BACKUP_KEEP: {{ .Values.backup.keep | quote }}
  IMMICH_NAMESPACE: {{ .Release.Namespace | quote }}
  POD_SELECTOR: {{ .Values.backup.podSelector | quote }}
  DEPLOYMENT_NAME: {{ .Values.backup.deploymentName | quote }}
  PVC_NAME: {{ .Values.backup.pvcClaimName | quote }}
  RCLONE_CONFIG_DEFAULT_TYPE: s3
  RCLONE_S3_PROVIDER: {{ .Values.backup.rclone.provider | quote }}
  RCLONE_S3_NO_CHECK_BUCKET: "true"
  RCLONE_S3_REGION: {{ .Values.backup.rclone.region | quote }}
  RCLONE_S3_ENDPOINT: {{ .Values.backup.rclone.endpoint | quote }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: immich-backup-credentials
spec:
  refreshInterval: "{{ .Values.externalSecrets.refreshInterval }}"
  secretStoreRef:
    kind: "{{ .Values.externalSecrets.kind }}"
    name: "{{ .Values.externalSecrets.name }}"
  target:
    name: immich-backup-credentials
    creationPolicy: "{{ .Values.externalSecrets.creationPolicy }}"
    template:
      data:
        RCLONE_S3_ACCESS_KEY_ID: "{{`{{ .access_key }}`}}"
        RCLONE_S3_SECRET_ACCESS_KEY: "{{`{{ .secret_key }}`}}"
  data:
    - secretKey: access_key
      remoteRef:
        key: {{ .Values.backup.vault.remoteSecretKey | quote }}
        property: {{ .Values.backup.vault.accessKeyProperty | quote }}
    - secretKey: secret_key
      remoteRef:
        key: {{ .Values.backup.vault.remoteSecretKey | quote }}
        property: {{ .Values.backup.vault.secretKeyProperty | quote }}
{{- end }}
