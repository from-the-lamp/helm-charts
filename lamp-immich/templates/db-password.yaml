# The "immich" role/password lives on the shared postgres cluster (a
# different namespace) - Kubernetes Secrets are namespace-scoped, so that
# cluster's own ExternalSecret can't be referenced directly here. Pull the
# same Vault property into this namespace too, same pattern lamp-pgadmin
# uses for its DB password.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.database.passwordSecret.name }}
spec:
  refreshInterval: "{{ .Values.externalSecrets.refreshInterval }}"
  secretStoreRef:
    kind: "{{ .Values.externalSecrets.kind }}"
    name: "{{ .Values.externalSecrets.name }}"
  target:
    name: {{ .Values.database.passwordSecret.name }}
    creationPolicy: "{{ .Values.externalSecrets.creationPolicy }}"
  data:
    - secretKey: password
      remoteRef:
        key: {{ .Values.database.passwordSecret.remoteSecretKey }}
        property: {{ .Values.database.passwordSecret.remoteSecretProperty }}
