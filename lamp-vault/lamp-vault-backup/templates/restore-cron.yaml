{{- if .Values.backup.enabled }}
{{- $ksa := include "vsoft-vault-backup.workloadIdentitySA" . }}
{{- $credentials := include "vsoft-vault-backup.needsCredentials" . }}
{{- $tokenSource := include "vsoft-vault-backup.tokenSource" . }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: vault-restore
spec:
  suspend: true
  schedule: "0 0 1 1 *"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 86400
      template:
        spec:
          restartPolicy: Never
          {{- if $ksa }}
          serviceAccountName: {{ $ksa }}
          {{- end }}
          initContainers:
            - name: download
              image: "{{ .Values.backup.rclone.image.name }}:{{ .Values.backup.rclone.image.tag }}"
              command: ['/bin/sh', '-eu', '-c']
              args:
                - |
                  DEST="default:${BACKUP_BUCKET}/${BACKUP_PATH}"
                  if [ "${SNAPSHOT:-latest}" = "latest" ]; then
                    SNAPSHOT=$(rclone lsf "${DEST}" --include "vault-*.snap" | sort -r | head -n1)
                  fi
                  echo "downloading snapshot: ${SNAPSHOT}"
                  rclone copyto "${DEST}/${SNAPSHOT}" /backup/vault.snap --progress
              imagePullPolicy: IfNotPresent
              env:
                - name: SNAPSHOT
                  value: "latest"
              envFrom:
                - configMapRef:
                    name: vault-backup
                {{- if $credentials }}
                - secretRef:
                    name: vault-backup-credentials
                {{- end }}
              resources:
                {{- toYaml .Values.backup.rclone.resources | nindent 16 }}
              volumeMounts:
                - name: backup
                  mountPath: /backup
          containers:
            - name: restore
              image: "{{ .Values.backup.vault.image.name }}:{{ .Values.backup.vault.image.tag }}"
              command: ['/bin/sh', '-eu', '-c']
              args:
                - vault operator raft snapshot restore -force /backup/vault.snap
              imagePullPolicy: IfNotPresent
              envFrom:
                - configMapRef:
                    name: vault-backup
                {{- if $credentials }}
                - secretRef:
                    name: vault-backup-credentials
                {{- end }}
              {{- if eq $tokenSource "existingSecret" }}
              env:
                - name: VAULT_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.backup.vault.token.existingSecret.name }}
                      key: {{ .Values.backup.vault.token.existingSecret.key }}
              {{- end }}
              resources:
                {{- toYaml .Values.backup.vault.resources | nindent 16 }}
              volumeMounts:
                - name: backup
                  mountPath: /backup
          volumes:
            - name: backup
              emptyDir: {}
{{- end }}
